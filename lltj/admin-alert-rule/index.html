<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警规则 - 园区人员热力图与流量统计</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
  <script src="../mock-store.js"></script>
  <style>
    .toggle-sw { width:40px;height:22px;border-radius:11px;background:#bfbfbf;cursor:pointer;position:relative;transition:background .2s;display:inline-block;vertical-align:middle; }
    .toggle-sw.on { background:var(--ant-primary); }
    .toggle-sw::after { content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-sw.on::after { left:20px; }
  </style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-people-group"></i></div><span class="app-name">园区人员热力图与流量统计</span><div class="spacer"></div>
    <span class="nav-action"><i class="fa-regular fa-bell mr-1"></i>3</span>
    <span class="role-switch"></span><div class="flex items-center gap-2 user-block" style="color:rgba(255,255,255,.85);"><div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">管</div><span style="font-size:13px;">管理员·王</span></div>
  </header>
  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">人流分析</div>
      <a class="menu-item" href="../admin-dashboard/index.html"><i class="fa-solid fa-gauge-high"></i>分析总览</a>
      <a class="menu-item" href="../admin-stats/index.html"><i class="fa-solid fa-chart-column"></i>流量统计分析</a>
      <a class="menu-item" href="../admin-heatmap/index.html"><i class="fa-solid fa-fire"></i>热力图分析</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-correlation/index.html"><i class="fa-solid fa-diagram-project"></i>建筑关联分析</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-report/index.html"><i class="fa-solid fa-file-lines"></i>人流报表</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-region-monitor/index.html"><i class="fa-solid fa-eye"></i>建筑人数监测</a>
      <a class="menu-item" data-role-hide="visitor,operator" href="../admin-config/index.html"><i class="fa-solid fa-sliders"></i>分析配置</a>
      <div class="menu-group-title">告警</div>
      <a class="menu-item active" data-role-hide="visitor,operator" href="../admin-alert-rule/index.html"><i class="fa-solid fa-bell"></i>告警规则</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-alert-list/index.html"><i class="fa-solid fa-triangle-exclamation"></i>告警列表</a>
      <div class="menu-group-title">监控</div>
      <a class="menu-item" href="../admin-screen/index.html"><i class="fa-solid fa-display"></i>监控中心大屏</a>
    </aside>
    <main class="main">
      <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><span class="current">告警规则</span></div>
      <div class="flex items-center justify-between mb-4">
        <div class="page-title" style="margin-bottom:0;">告警规则</div>
        <button class="ant-btn ant-btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> 新增规则</button>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-head"><div class="ant-card-head-title">规则列表 · <span id="ruleCount">0 条</span></div></div>
        <div class="ant-card-body" style="padding:0">
          <table class="ant-table">
            <thead><tr><th width="70">类型</th><th>统计分组</th><th>阈值</th><th width="70">持续</th><th width="60">级别</th><th width="130">通知方式</th><th width="70">状态</th><th width="100">近7天触发</th><th width="130">最近触发</th><th width="160">操作</th></tr></thead>
            <tbody id="ruleBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="ant-modal-mask" id="ruleModalMask">
  <div class="ant-modal" style="width:500px">
    <div class="ant-modal-header"><div class="ant-modal-title" id="modalTitle">新增告警规则</div><button class="ant-modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="ant-modal-body">
      <div class="ant-form-item"><label class="ant-form-label ant-form-label-required">规则类型</label>
        <div class="flex gap-4">
          <label class="ant-radio"><input type="radio" name="alertType" value="overcrowd" checked onchange="switchType()"><span>超员</span></label>
          <label class="ant-radio"><input type="radio" name="alertType" value="gather" onchange="switchType()"><span>聚集</span></label>
          <label class="ant-radio" style="opacity:.45;cursor:not-allowed"><input type="radio" disabled><span>异常行为（未来迭代）</span></label>
        </div>
      </div>
      <div class="ant-form-item"><label class="ant-form-label ant-form-label-required">统计分组</label>
        <select class="ant-select" id="groupSel" style="width:100%"><option>食堂就餐区</option><option>B 栋大堂</option><option>广场</option><option>A 栋办公区</option><option>地下车库入口</option></select>
      </div>
      <div class="ant-form-item"><label class="ant-form-label ant-form-label-required" id="thrLabel">人数阈值</label>
        <input type="number" class="ant-input" id="thrInput" placeholder="正整数" min="1">
      </div>
      <div class="ant-form-item" id="radiusRow" style="display:none"><label class="ant-form-label ant-form-label-required">聚集半径（米）</label>
        <input type="number" class="ant-input" id="radiusInput" placeholder="如 5" min="0.1" step="0.1">
      </div>
      <div class="ant-form-item"><label class="ant-form-label ant-form-label-required">持续时间</label>
        <select class="ant-select" id="durSel" style="width:100%"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">1 分钟</option><option value="300">5 分钟</option><option value="600">10 分钟</option><option value="0">自定义（秒）</option></select>
        <input type="number" class="ant-input mt-2" id="durCustom" placeholder="自定义秒数" style="display:none" min="1">
      </div>
      <div class="ant-form-item"><label class="ant-form-label ant-form-label-required">告警级别</label>
        <select class="ant-select" id="levelSel"><option>警告</option><option>紧急</option></select>
      </div>
      <div class="ant-form-item" style="margin-bottom:4px"><label class="ant-form-label ant-form-label-required">通知方式</label>
        <div class="flex gap-3">
          <div class="ant-checkbox-card selected" id="notifyInapp" onclick="this.classList.toggle('selected')"><i class="fa-solid fa-bell"></i><span>站内信</span></div>
        </div>
      </div>
      <div class="text-xs text-tertiary" style="background:#f6f8fa;border-radius:6px;padding:10px 12px;margin-top:8px" id="ruleSummary"></div>
    </div>
    <div class="ant-modal-footer"><button class="ant-btn" onclick="closeModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitRule()">确定</button></div>
  </div>
</div>

<style>
  .ant-checkbox-card { display:flex;align-items:center;gap:6px;padding:8px 14px;border:2px solid var(--ant-border-secondary);border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s; }
  .ant-checkbox-card:hover { border-color:var(--ant-primary); }
  .ant-checkbox-card.selected { border-color:var(--ant-primary);background:var(--ant-primary-bg);color:var(--ant-primary); }
</style>

<script>
function showToast(m,d){d=d||2000;var w=document.querySelector('.toast-wrap');if(!w){w=document.createElement('div');w.className='toast-wrap';document.body.appendChild(w);}var e=document.createElement('div');e.className='toast-msg';e.innerHTML='<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>'+m;w.appendChild(e);requestAnimationFrame(function(){e.classList.add('show');});setTimeout(function(){e.classList.remove('show');setTimeout(function(){e.remove();},300);},d);}

var rules = MockStore.getRules();

function renderRules(){
  var ll='';
  rules.forEach(function(r){
    var thr=r.type==='聚集'?r.threshold+'人 / '+r.radius+'m':r.threshold+' 人';
    var dur=r.duration<60?r.duration+'秒':Math.floor(r.duration/60)+'分'+(r.duration%60?(r.duration%60)+'秒':'');
    ll+='<tr>'
      +'<td>'+r.type+'</td>'
      +'<td>'+r.group+'</td><td class="tnum">'+thr+'</td><td class="tnum">'+dur+'</td>'
      +'<td>'+r.level+'</td>'
      +'<td><span class="text-xs">站内信</span></td>'
      +'<td><div class="toggle-sw'+(r.active?' on':'')+'" onclick="toggleRule('+r.id+')" title="'+(r.active?'启用中·点击禁用':'已禁用·点击启用')+'"></div></td>'
      +'<td class="tnum">'+(r.hit7d||0)+' 次</td>'
      +'<td class="text-xs text-tertiary">'+r.lastHit+'</td>'
      +'<td class="action-wrap">'
      +'<button class="ant-btn ant-btn-text ant-btn-sm" onclick="editRule('+r.id+')"><i class="fa-solid fa-pen"></i> 编辑</button>'
      +'<button class="ant-btn ant-btn-text ant-btn-dangerous ant-btn-sm" onclick="deleteRule('+r.id+')"><i class="fa-solid fa-trash"></i></button>'
      +'</td></tr>';
  });
  document.getElementById('ruleBody').innerHTML=ll;
  document.getElementById('ruleCount').textContent=rules.length+' 条';
}

function toggleRule(id){
  var r=rules.find(function(x){return x.id===id;});
  if(!r) return;
  r.active=!r.active; MockStore.saveRules(rules); renderRules(); showToast(r.active?'规则已启用':'规则已禁用');
}
function deleteRule(id){
  var r=rules.find(function(x){return x.id===id;});
  if(!r) return;
  if(r.active){showToast('请先禁用规则再删除');return;}
  if(confirm('确认删除「'+r.group+'」的'+r.type+'告警规则？不可恢复。')){
    rules=rules.filter(function(x){return x.id!==id;}); MockStore.saveRules(rules); renderRules(); showToast('规则已删除');
  }
}

// === 弹窗 ===
var editingId=null;
function openModal(){editingId=null;resetForm();document.getElementById('modalTitle').textContent='新增告警规则';document.getElementById('ruleModalMask').classList.add('active');}
function editRule(id){editingId=id;var r=rules.find(function(x){return x.id===id;});resetForm();
  document.getElementById('modalTitle').textContent='编辑告警规则 · '+r.group;
  document.querySelector('input[name="alertType"][value="'+(r.type==='超员'?'overcrowd':'gather')+'"]').checked=true;switchType();
  document.getElementById('groupSel').value=r.group;document.getElementById('thrInput').value=r.threshold;
  if(r.radius) document.getElementById('radiusInput').value=r.radius;
  var durVal=r.duration==10?'10':r.duration==30?'30':r.duration==60?'60':r.duration==300?'300':r.duration==600?'600':'0';
  document.getElementById('durSel').value=durVal; if(durVal==='0'){document.getElementById('durCustom').style.display='';document.getElementById('durCustom').value=r.duration;}
  document.getElementById('levelSel').value=r.level;
  document.getElementById('ruleModalMask').classList.add('active');updateSummary();
}
function closeModal(){document.getElementById('ruleModalMask').classList.remove('active');editingId=null;}
function resetForm(){
  document.querySelector('input[name="alertType"][value="overcrowd"]').checked=true;switchType();
  document.getElementById('thrInput').value='';document.getElementById('radiusInput').value='';
  document.getElementById('durSel').value='30';document.getElementById('durCustom').style.display='none';
  document.getElementById('levelSel').value='警告';updateSummary();
}
function switchType(){
  var g=document.querySelector('input[name="alertType"]:checked').value==='gather';
  document.getElementById('thrLabel').textContent=g?'聚集人数阈值':'人数阈值';
  document.getElementById('radiusRow').style.display=g?'':'none';
  document.getElementById('levelSel').value=g?'警告':document.getElementById('levelSel').value;
  updateSummary();
}
document.getElementById('durSel').onchange=function(){
  document.getElementById('durCustom').style.display=this.value==='0'?'':'none';
  updateSummary();
};

function updateSummary(){
  var t=document.querySelector('input[name="alertType"]:checked').value==='gather'?'聚集':'超员';
  var g=document.getElementById('groupSel').value;
  var thr=document.getElementById('thrInput').value||'?';
  var dur=document.getElementById('durSel').value;
  var durTxt=dur==='0'?(document.getElementById('durCustom').value||'?')+'秒':(dur<60?dur+'秒':Math.floor(dur/60)+'分钟');
  var lv=document.getElementById('levelSel').value;
  document.getElementById('ruleSummary').innerHTML='<i class="fa-solid fa-circle-info mr-1"></i>当 <b>'+g+'</b> '+(t==='聚集'?'聚集人数':'人数')+' <b>≥ '+thr+'</b> 且持续 <b>'+durTxt+'</b> → <b>'+lv+'告警</b>，站内信通知';
}

function submitRule(){
  var t=document.querySelector('input[name="alertType"]:checked').value==='gather'?'聚集':'超员';
  var g=document.getElementById('groupSel').value;
  var thr=parseInt(document.getElementById('thrInput').value);
  if(!thr||thr<=0){showToast('请输入有效的人数阈值');return;}
  var dur=parseInt(document.getElementById('durSel').value);
  if(dur===0){dur=parseInt(document.getElementById('durCustom').value);if(!dur||dur<=0){showToast('请输入有效的持续时间');return;}}
  var rad=t==='聚集'?parseFloat(document.getElementById('radiusInput').value):null;
  if(t==='聚集'&&(!rad||rad<=0)){showToast('请输入有效的聚集半径');return;}
  var lv=document.getElementById('levelSel').value;

  if(editingId){
    var r=rules.find(function(x){return x.id===editingId;});
    if(r){r.type=t;r.group=g;r.threshold=thr;r.radius=rad;r.duration=dur;r.level=lv;r.notify='站内信';}
  }else{
    rules.push({id:Date.now(),type:t,group:g,threshold:thr,radius:rad,duration:dur,level:lv,active:true,hit7d:0,lastHit:'-',notify:'站内信'});
  }
  MockStore.saveRules(rules);
  closeModal();renderRules();showToast(editingId?'规则已保存':'规则已创建，默认启用');
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('ruleModalMask').classList.contains('active'))closeModal();});
document.getElementById('ruleModalMask').addEventListener('click',function(e){if(e.target===this)closeModal();});

renderRules();
</script>
</body>
</html>
