<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警列表 - 园区人员热力图与流量统计</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
  <script src="../mock-store.js"></script>
  <style>
    .desc-row { display:flex;padding:10px 0;border-bottom:1px solid var(--ant-border-secondary); }
    .desc-label { width:100px;flex-shrink:0;color:var(--ant-text-tertiary);font-size:13px; }
    .desc-value { flex:1;color:var(--ant-text);font-size:13px; }
    .btn-dim { opacity:.45;cursor:not-allowed; }
    .timeline { position:relative;padding-left:28px; }
    .timeline::before { content:'';position:absolute;left:10px;top:4px;bottom:4px;width:2px;background:var(--ant-border-secondary); }
    .tl-item { position:relative;padding-bottom:16px; }
    .tl-item:last-child { padding-bottom:0; }
    .tl-dot { position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--ant-primary);border:2px solid #fff; }
    .tl-dot.gray { background:#bfbfbf; }
    .batch-bar { display:none;background:var(--ant-primary-bg);border:1px solid #91caff;border-radius:8px;padding:8px 14px;margin-bottom:12px; }
    .batch-bar.show { display:flex;align-items:center;justify-content:space-between; }
  </style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-people-group"></i></div><span class="app-name">园区人员热力图与流量统计</span><div class="spacer"></div>
    <span class="nav-action"><i class="fa-regular fa-bell mr-1"></i>3</span>
    <span class="role-switch"></span><div class="flex items-center gap-2 user-block" style="color:rgba(255,255,255,.85);"><div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">管</div><span style="font-size:13px;">管理员·王</span></div>
  </header>
  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">人流分析</div>
      <a class="menu-item" href="../admin-dashboard/index.html"><i class="fa-solid fa-gauge-high"></i>分析总览</a>
      <a class="menu-item" href="../admin-stats/index.html"><i class="fa-solid fa-chart-column"></i>流量统计分析</a>
      <a class="menu-item" href="../admin-heatmap/index.html"><i class="fa-solid fa-fire"></i>热力图分析</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-correlation/index.html"><i class="fa-solid fa-diagram-project"></i>建筑关联分析</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-report/index.html"><i class="fa-solid fa-file-lines"></i>人流报表</a>
      <a class="menu-item" data-role-hide="visitor" href="../admin-region-monitor/index.html"><i class="fa-solid fa-eye"></i>建筑人数监测</a>
      <a class="menu-item" data-role-hide="visitor,operator" href="../admin-config/index.html"><i class="fa-solid fa-sliders"></i>分析配置</a>
      <div class="menu-group-title">告警</div>
      <a class="menu-item" data-role-hide="visitor,operator" href="../admin-alert-rule/index.html"><i class="fa-solid fa-bell"></i>告警规则</a>
      <a class="menu-item active" data-role-hide="visitor" href="../admin-alert-list/index.html"><i class="fa-solid fa-triangle-exclamation"></i>告警列表</a>
      <div class="menu-group-title">监控</div>
      <a class="menu-item" href="../admin-screen/index.html"><i class="fa-solid fa-display"></i>监控中心大屏</a>
    </aside>
    <main class="main">
      <div id="listView">
        <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><span class="current">告警列表</span></div>
        <div class="page-title">告警列表</div>

        <!-- 批量操作栏 -->
        <div class="batch-bar" id="batchBar">
          <span class="text-sm">已选 <b id="batchCount">0</b> 条</span>
          <div class="flex gap-2">
            <button class="ant-btn ant-btn-primary ant-btn-sm" onclick="batchConfirm()">一键确认</button>
            <button class="ant-btn ant-btn-sm" onclick="batchResolve()">批量标记已处理</button>
            <button class="ant-btn ant-btn-sm" onclick="clearBatch()">取消选择</button>
          </div>
        </div>

        <!-- 筛选栏 -->
        <div class="ant-card ant-card-bordered mb-4">
          <div class="ant-card-body" style="padding:12px 16px;">
            <div class="flex items-center gap-3 flex-wrap">
              <label class="text-sm text-secondary">类型</label><select class="ant-select" id="fType" style="width:100px"><option>全部</option><option>超员</option><option>聚集</option></select>
              <label class="text-sm text-secondary">分组</label><select class="ant-select" id="fGroup" style="width:130px"><option>全部</option><option>食堂就餐区</option><option>B 栋大堂</option><option>广场</option><option>A 栋办公区</option></select>
              <label class="text-sm text-secondary">状态</label><select class="ant-select" id="fStatus" style="width:100px"><option>全部</option><option>待处理</option><option>处理中</option><option>已处理</option><option>误报</option></select>
              <label class="text-sm text-secondary">时间</label><input type="date" class="ant-input" value="2026-07-14" style="width:130px"> <span>-</span> <input type="date" class="ant-input" value="2026-07-16" style="width:130px">
              <button class="ant-btn ant-btn-primary" onclick="applyFilter()"><i class="fa-solid fa-search"></i> 查询</button>
              <button class="ant-btn" onclick="resetFilter()"><i class="fa-solid fa-rotate-right"></i> 重置</button>
            </div>
          </div>
        </div>

        <!-- 告警事件列表 -->
        <div class="ant-card ant-card-bordered">
          <div class="ant-card-head"><div class="ant-card-head-title">告警事件 · <span id="eventCountLabel">0 条</span></div></div>
          <div class="ant-card-body" style="padding:0">
            <table class="ant-table">
              <thead><tr><th width="36"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th><th width="160">触发时间</th><th>统计分组</th><th width="70">类型</th><th width="70">级别</th><th width="90">触众人数</th><th width="80">状态</th><th width="90">时效</th><th width="180">操作</th></tr></thead>
              <tbody id="eventTableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="text-xs text-tertiary mt-3"><i class="fa-solid fa-circle-info mr-1"></i>处理时效 = 触发→标记已处理，仅「已处理」计入；误报/无需处理不计。</div>
      </div>

      <!-- 详情视图 - 时间线布局 -->
      <div id="detailView" style="display:none">
        <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="javascript:void(0)" onclick="showListView()">告警列表</a><span>/</span><span class="current" id="detailCrumb">事件详情</span></div>
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <button class="ant-btn" onclick="showListView()"><i class="fa-solid fa-arrow-left"></i> 返回</button>
            <div class="page-title" style="margin-bottom:0;" id="detailTitle">告警事件详情</div>
          </div>
          <div class="flex gap-2" id="detailActions"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 mb-4">
          <div class="col-span-2">
            <div class="ant-card ant-card-bordered">
              <div class="ant-card-head"><div class="ant-card-head-title">事件时间线</div></div>
              <div class="ant-card-body" style="padding:16px 24px;">
                <div class="timeline" id="timeline"></div>
              </div>
            </div>
          </div>
          <div>
            <div class="ant-card ant-card-bordered mb-4">
              <div class="ant-card-head"><div class="ant-card-head-title">关键信息</div></div>
              <div class="ant-card-body" style="padding:8px 16px;">
                <div class="desc-row"><div class="desc-label">事件ID</div><div class="desc-value" id="dEventId"></div></div>
                <div class="desc-row"><div class="desc-label">分组</div><div class="desc-value" id="dGroup"></div></div>
                <div class="desc-row"><div class="desc-label">类型/级别</div><div class="desc-value" id="dTypeLevel"></div></div>
                <div class="desc-row"><div class="desc-label">触发人数</div><div class="desc-value" id="dTriggerCount"></div></div>
                <div class="desc-row"><div class="desc-label">当前人数</div><div class="desc-value" id="dCurCount"></div></div>
                <div class="desc-row"><div class="desc-label">阈值</div><div class="desc-value" id="dThreshold"></div></div>
                <div class="desc-row" style="border-bottom:0"><div class="desc-label">状态</div><div class="desc-value" id="dStatus"></div></div>
              </div>
            </div>
            <div class="ant-card ant-card-bordered">
              <div class="ant-card-head"><div class="ant-card-head-title">同区域近期</div></div>
              <div class="ant-card-body" style="padding:8px 16px;font-size:13px;" id="recentAlerts">
                <div class="text-tertiary text-center py-4">暂无历史告警</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="ant-modal-mask" id="markModalMask">
  <div class="ant-modal" style="width:460px">
    <div class="ant-modal-header"><div class="ant-modal-title">标记处理结果</div><button class="ant-modal-close" onclick="closeMarkModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="ant-modal-body">
      <div class="ant-form-item"><label class="ant-form-label ant-form-label-required">处理结果</label>
        <div class="flex gap-4"><label class="ant-radio"><input type="radio" name="handleResult" value="已处理"><span>已处理</span></label><label class="ant-radio"><input type="radio" name="handleResult" value="误报"><span>误报</span></label><label class="ant-radio"><input type="radio" name="handleResult" value="无需处理"><span>无需处理</span></label></div>
        <div id="resultError" class="text-error text-sm mt-2 hidden">请选择处理结果</div>
      </div>
      <div class="ant-form-item" style="margin-bottom:0"><label class="ant-form-label">备注 <span class="text-xs text-tertiary">≤200字</span></label>
        <textarea class="ant-input" id="handleRemark" rows="3" maxlength="200" placeholder="如：已现场疏导" oninput="updateRemarkCount()"></textarea>
        <div class="text-xs text-tertiary mt-1 text-right"><span id="remarkCount">0</span>/200</div>
      </div>
    </div>
    <div class="ant-modal-footer"><button class="ant-btn" onclick="closeMarkModal()">取消</button><button class="ant-btn ant-btn-primary" onclick="submitMark()">确定</button></div>
  </div>
</div>

<script>
function showToast(m,d){d=d||2000;var w=document.querySelector('.toast-wrap');if(!w){w=document.createElement('div');w.className='toast-wrap';document.body.appendChild(w);}var e=document.createElement('div');e.className='toast-msg';e.innerHTML='<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>'+m;w.appendChild(e);requestAnimationFrame(function(){e.classList.add('show');});setTimeout(function(){e.classList.remove('show');setTimeout(function(){e.remove();},300);},d);}

var events = MockStore.getEvents();
var filtered=events.slice(), curDetailId=null, currentMarkId=null, selectedIds={};

function toggleSelectAll(){
  var ck=document.getElementById('selectAll').checked;
  document.querySelectorAll('.evt-cb').forEach(function(cb){cb.checked=ck;});
  updateBatch();
}
function updateBatch(){
  var cbs=document.querySelectorAll('.evt-cb:checked'); selectedIds={};
  cbs.forEach(function(cb){selectedIds[cb.getAttribute('data-id')]=true;});
  var bar=document.getElementById('batchBar');
  if(cbs.length){ bar.classList.add('show'); document.getElementById('batchCount').textContent=cbs.length; }
  else bar.classList.remove('show');
}
function clearBatch(){ document.querySelectorAll('.evt-cb').forEach(function(cb){cb.checked=false;}); document.getElementById('selectAll').checked=false; updateBatch(); }
function batchConfirm(){
  var cnt=Object.keys(selectedIds).length; if(!cnt) return;
  events.forEach(function(e){if(selectedIds[e.id]&&e.status==='待处理'){e.status='处理中';e.confirmUser='管理员·王';e.confirmTime='2026-07-16 12:50:00';}});
  MockStore.saveEvents(events); clearBatch(); applyFilterSilent(); renderEventTable(); showToast('已批量确认 '+cnt+' 条');
}
function batchResolve(){
  var cnt=Object.keys(selectedIds).length; if(!cnt) return;
  events.forEach(function(e){if(selectedIds[e.id]&&e.status==='处理中'){e.status='已处理';e.handleResult='已处理';e.handleUser='管理员·王';e.handleTime='2026-07-16 12:55:00';e.sla='3分40秒';}});
  MockStore.saveEvents(events); clearBatch(); applyFilterSilent(); renderEventTable(); showToast('已批量标记 '+cnt+' 条');
}

function actionButtons(e){
  var view='<button class="ant-btn ant-btn-text ant-btn-sm" onclick="showDetail(\''+e.id+'\')"><i class="fa-solid fa-eye"></i></button>';
  if(e.status==='待处理') return view+'<button class="ant-btn ant-btn-primary ant-btn-sm" onclick="confirmAlert(\''+e.id+'\')">确认</button>';
  if(e.status==='处理中') return view+'<button class="ant-btn ant-btn-primary ant-btn-sm" onclick="openMarkModal(\''+e.id+'\')">标记处理</button>';
  return view;
}

function renderEventTable(){
  document.getElementById('eventCountLabel').textContent='共 '+filtered.length+' 条';
  if(!filtered.length){ document.getElementById('eventTableBody').innerHTML='<tr><td colspan="9" class="ant-empty"><div class="ant-empty-icon"><i class="fa-solid fa-inbox"></i></div><div class="ant-empty-text">暂无告警</div></td></tr>';return;}
  document.getElementById('eventTableBody').innerHTML=filtered.map(function(e){
    return '<tr>'
      +'<td><input type="checkbox" class="evt-cb" data-id="'+e.id+'" onchange="updateBatch()"'+(selectedIds[e.id]?' checked':'')+'></td>'
      +'<td class="mono">'+e.triggerTime+'</td><td>'+e.group+'</td>'
      +'<td>'+e.type+'</td>'
      +'<td>'+e.level+'</td>'
      +'<td class="tnum">'+e.triggerCount+'人</td>'
      +'<td>'+e.status+'</td>'
      +'<td>'+(e.sla?'<span class="tnum">'+e.sla+'</span>':'<span class="text-tertiary">-</span>')+'</td>'
      +'<td class="action-wrap">'+actionButtons(e)+'</td></tr>';
  }).join('');
}

function applyFilterSilent(){
  var t=document.getElementById('fType').value,g=document.getElementById('fGroup').value,s=document.getElementById('fStatus').value;
  filtered=events.filter(function(e){return (t==='全部'||e.type===t)&&(g==='全部'||e.group===g)&&(s==='全部'||e.status===s);});
}
function applyFilter(){applyFilterSilent();renderEventTable();showToast('查询完成');}
function resetFilter(){document.getElementById('fType').value='全部';document.getElementById('fGroup').value='全部';document.getElementById('fStatus').value='全部';filtered=events.slice();renderEventTable();showToast('已重置');}

function confirmAlert(id){
  var e=events.find(function(x){return x.id===id;});
  if(!e||e.status!=='待处理'){showToast('当前状态不可确认');return;}
  e.status='处理中';e.confirmUser='管理员·王';e.confirmTime='2026-07-16 12:40:11';
  MockStore.saveEvents(events); applyFilterSilent();renderEventTable();showToast('已确认，事件转为处理中');
}

function openMarkModal(id){
  var e=events.find(function(x){return x.id===id;});
  if(!e||e.status!=='处理中'){showToast('不可标记');return;}
  currentMarkId=id;document.querySelectorAll('input[name="handleResult"]').forEach(function(r){r.checked=false;});
  document.getElementById('handleRemark').value='';document.getElementById('remarkCount').textContent='0';
  document.getElementById('resultError').classList.add('hidden');document.getElementById('markModalMask').classList.add('active');
}
function closeMarkModal(){document.getElementById('markModalMask').classList.remove('active');currentMarkId=null;}
function updateRemarkCount(){document.getElementById('remarkCount').textContent=document.getElementById('handleRemark').value.length;}
function submitMark(){
  var ck=document.querySelector('input[name="handleResult"]:checked');if(!ck){document.getElementById('resultError').classList.remove('hidden');return;}
  var e=events.find(function(x){return x.id===currentMarkId;});if(!e){closeMarkModal();return;}
  e.handleResult=ck.value;e.handleRemark=document.getElementById('handleRemark').value.trim();e.handleUser='管理员·王';e.handleTime='2026-07-16 12:50:33';
  if(ck.value==='误报'){e.status='误报';e.sla='';}else{e.status='已处理';e.sla='3分45秒';}
  MockStore.saveEvents(events); closeMarkModal();applyFilterSilent();renderEventTable();showToast('已标记处理');
}

function showDetail(id){
  var e=events.find(function(x){return x.id===id;});if(!e)return;
  document.getElementById('listView').style.display='none';document.getElementById('detailView').style.display='';
  document.getElementById('detailTitle').textContent='告警事件 · '+e.id;document.getElementById('detailCrumb').textContent=e.id;
  document.getElementById('dEventId').textContent=e.id;document.getElementById('dGroup').textContent=e.group;
  document.getElementById('dTypeLevel').textContent=e.type+' · '+e.level;
  document.getElementById('dTriggerCount').innerHTML='<span class="tnum" style="font-size:18px;font-weight:700;color:#ff4d4f">'+e.triggerCount+'</span> 人';
  document.getElementById('dCurCount').textContent=e.curCount!==null&&e.curCount!==undefined?e.curCount+' 人':'-';
  document.getElementById('dThreshold').textContent=e.threshold?e.threshold+' 人':'-';
  document.getElementById('dStatus').textContent=e.status;

  // 时间线
  var tl='<div class="tl-item"><div class="tl-dot"></div><div class="text-sm"><b>'+e.triggerTime+'</b> 触发告警</div><div class="text-xs text-tertiary">'+e.group+' · '+e.triggerCount+' 人 · 阈值 '+e.threshold+'</div></div>';
  if(e.confirmTime) tl+='<div class="tl-item"><div class="tl-dot"></div><div class="text-sm"><b>'+e.confirmTime+'</b> '+e.confirmUser+' 确认告警</div><div class="text-xs text-tertiary">状态 → 处理中</div></div>';
  if(e.handleTime) tl+='<div class="tl-item"><div class="tl-dot'+(e.status==='误报'?' gray':'')+'"></div><div class="text-sm"><b>'+e.handleTime+'</b> '+e.handleUser+' 标记'+e.handleResult+'</div><div class="text-xs text-tertiary">'+(e.handleRemark||'')+'</div></div>';
  if(e.recoverTime) tl+='<div class="tl-item"><div class="tl-dot gray"></div><div class="text-sm"><b>'+e.recoverTime+'</b> 自动恢复</div></div>';
  document.getElementById('timeline').innerHTML=tl;

  // 同区域近期
  var recent=events.filter(function(x){return x.group===e.group&&x.id!==e.id&&x.triggerTime>='2026-07-14';}).slice(0,3);
  document.getElementById('recentAlerts').innerHTML=recent.length?recent.map(function(r){
    return '<div class="flex items-center justify-between py-1" style="border-bottom:1px solid #f5f5f5"><span class="text-xs">'+r.triggerTime.substring(5)+'</span><span class="text-xs">'+r.status+'</span></div>';
  }).join(''):'<div class="text-tertiary text-center py-4">暂无历史告警</div>';

  document.getElementById('detailActions').innerHTML=actionButtons(e);
  window.scrollTo(0,0);
}
function showListView(){document.getElementById('detailView').style.display='none';document.getElementById('listView').style.display='';curDetailId=null;window.scrollTo(0,0);}

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(document.getElementById('markModalMask').classList.contains('active')){closeMarkModal();return;}
  if(document.getElementById('detailView').style.display!=='none')showListView();
});
document.getElementById('markModalMask').addEventListener('click',function(e){if(e.target===this)closeMarkModal();});

renderEventTable();
</script>
</body>
</html>
