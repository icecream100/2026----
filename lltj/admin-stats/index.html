<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流量统计分析 - 园区人员热力图与流量统计</title>
  <script src="../assets/tailwind.js"></script>
  <link rel="stylesheet" href="../assets/fa-all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
  <script src="../mock-store.js"></script>
  <style>
    .chart-line { height:220px; position:relative; }
    .chart-legend { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
    .chart-legend .lg-item { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ant-text-secondary); cursor:pointer; user-select:none; }
    .chart-legend .lg-item.off { opacity:.35; text-decoration:line-through; }
    .chart-legend .lg-item:focus-visible { outline:2px solid var(--ant-primary); outline-offset:2px; border-radius:3px; }
    .chart-legend .lg-swatch { width:14px; height:3px; border-radius:2px; display:inline-block; }
  </style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-people-group"></i></div>
    <span class="app-name">园区人员热力图与流量统计</span>
    <div class="spacer"></div>
  </header>

  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">人流分析</div>
      <a class="menu-item" href="../admin-dashboard/index.html"><i class="fa-solid fa-gauge-high"></i>分析总览</a>
      <a class="menu-item active" href="../admin-stats/index.html"><i class="fa-solid fa-chart-column"></i>流量统计分析</a>
      <a class="menu-item" href="../admin-heatmap/index.html"><i class="fa-solid fa-fire"></i>热力图分析</a>
      <a class="menu-item" href="../admin-report/index.html"><i class="fa-solid fa-file-lines"></i>统计报表</a>
      <a class="menu-item" href="../admin-region-monitor/index.html"><i class="fa-solid fa-eye"></i>实时人数监测</a>
      <a class="menu-item" href="../admin-config/index.html"><i class="fa-solid fa-sliders"></i>分析配置</a>
      <div class="menu-group-title">告警</div>
      <a class="menu-item" href="../admin-alert-rule/index.html"><i class="fa-solid fa-bell"></i>告警规则</a>
      <a class="menu-item" href="../admin-alert-list/index.html"><i class="fa-solid fa-triangle-exclamation"></i>告警列表</a>
      <div class="menu-group-title">监控</div>
      <a class="menu-item" href="../admin-screen/index.html"><i class="fa-solid fa-display"></i>监控中心大屏</a>
    </aside>

    <main class="main">
      <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><span class="current">流量统计分析</span></div>
      <div class="page-title" style="margin-bottom:16px;">流量统计分析</div>

      <!-- Tab 切换 -->
      <div class="tab-bar" id="tabBar">
        <button type="button" class="tab-item active" role="tab" aria-selected="true" onclick="switchTab(this,'t-trend')">分时趋势</button>
        <button type="button" class="tab-item" role="tab" aria-selected="false" onclick="switchTab(this,'t-rank')">建筑排行</button>
      </div>

      <!-- 分时趋势 -->
      <div id="t-trend" class="tab-panel">
        <div class="ant-card ant-card-bordered mb-4">
          <div class="ant-card-head">
            <div class="ant-card-head-title">分时流量趋势</div>
            <div class="ant-card-extra">
              <select class="ant-select ant-select-sm" style="width:100px" id="trendRange" onchange="onTrendFilterChange()"><option>今日</option><option>本周</option><option>本月</option><option>自定义</option></select>
              <span id="customDateWrap" style="display:none">
                <input type="date" class="ant-input" value="2026-07-01" style="width:130px" onchange="onTrendFilterChange()"> <span>-</span> <input type="date" class="ant-input" value="2026-07-07" style="width:130px" onchange="onTrendFilterChange()">
              </span>
              <select class="ant-select ant-select-sm ml-2" id="trendCmp" style="width:120px" onchange="onTrendCompareChange()"><option value="none">不对比</option><option value="period">对比同期</option></select>
              <span class="mx-2" style="color:var(--ant-border-secondary)">|</span>
              <label class="ant-checkbox"><input type="checkbox" checked onchange="toggleTrend(0,this.checked)"><span>进入人数</span></label>
              <label class="ant-checkbox ml-3"><input type="checkbox" checked onchange="toggleTrend(1,this.checked)"><span>离开人数</span></label>
              <label class="ant-checkbox ml-3"><input type="checkbox" checked onchange="toggleTrend(3,this.checked)"><span>同时在场峰值</span></label>
              <span class="mx-2" style="color:var(--ant-border-secondary)">|</span>
              <button class="ant-btn ant-btn-primary ant-btn-sm" onclick="queryTrend()"><i class="fa-solid fa-magnifying-glass mr-1"></i>查询</button>
              <button class="ant-btn ant-btn-primary ant-btn-sm" onclick="exportData()"><i class="fa-solid fa-download"></i> 导出数据</button>
            </div>
          </div>
          <div class="ant-card-body">
            <div class="chart-legend mb-2" id="trendLegend"></div>
            <div class="chart-line" id="trendChart"></div>
            <!-- 趋势数据表格 -->
            <div class="mt-4" id="trendTableWrap">
              <table class="ant-table" style="font-size:12px">
                <thead id="trendTableHead"></thead>
                <tbody id="trendTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 建筑排行 -->
      <div id="t-rank" class="tab-panel" style="display:none">
        <div class="flex items-end gap-4 mb-4">
          <div class="ant-form-item" style="margin-bottom:0"><label class="ant-form-label">时间范围</label><select class="ant-select" id="rankTime" style="width:160px"><option>今日</option><option>本周</option><option>本月</option><option>自定义</option></select></div>
          <button class="ant-btn ant-btn-primary" onclick="queryRank()"><i class="fa-solid fa-magnifying-glass mr-1"></i>查询</button>
          <button class="ant-btn ant-btn-primary" onclick="exportData()"><i class="fa-solid fa-download"></i> 导出数据</button>
        </div>

        <!-- 建筑排行表 -->
        <div class="ant-card ant-card-bordered" id="rankAreaView">
          <div class="ant-card-body" style="padding:0">
            <table class="ant-table">
              <thead><tr><th width="60">排名</th><th>区域</th><th>进入人数</th><th>离开人数</th><th>峰值同时在</th><th>同比</th><th width="80">操作</th></tr></thead>
              <tbody id="rankBody"></tbody>
            </table>
          </div>
        </div>

        <!-- 设备级明细（查看详情后显示） -->
        <div class="ant-card ant-card-bordered mt-4" id="rankDeviceView" style="display:none">
          <div class="ant-card-head">
            <div class="ant-card-head-title" id="rankDeviceTitle">设备级明细</div>
            <div class="ant-card-extra"><button class="ant-btn ant-btn-sm" onclick="drillBack()"><i class="fa-solid fa-arrow-left"></i> 返回建筑排行</button></div>
          </div>
          <div class="ant-card-body" style="padding:0">
            <table class="ant-table">
              <thead><tr><th>设备名称</th><th>进入人数</th><th>离开人数</th><th>峰值同时在</th></tr></thead>
              <tbody id="rankDeviceBody"></tbody>
            </table>
          </div>
          <div class="flex items-center justify-between p-4">
            <span class="text-sm text-secondary" id="rankDeviceCount"></span>
          </div>
        </div>
      </div>


    </main>
  </div>
</div>

<script>
  function showToast(msg, duration) {
    duration = duration || 2000;
    var wrap = document.querySelector('.toast-wrap');
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
    var el = document.createElement('div');
    el.className = 'toast-msg';
    el.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>' + msg;
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () { el.classList.remove('show'); setTimeout(function () { el.remove(); }, 300); }, duration);
  }
  function exportData(){ showToast('导出任务已创建，完成后通知（单次上限 10 万行）'); }

  // 明细表仅在「趋势 / 排行」Tab 下展示
  function switchTab(el,id){
    document.querySelectorAll('.tab-panel').forEach(function(p){p.style.display='none';});
    document.getElementById(id).style.display='';
    document.querySelectorAll('#tabBar .tab-item').forEach(function(t){t.classList.remove('active');});
    el.classList.add('active');
  }

  // ===== 通用折线图：坐标轴 + 网格 + Y轴刻度 + 图例联动 =====
  // series: [{name,color,data,hidden}]  xLabels:[...]
  function lineChart(container, series, xLabels, legendEl){
    var padL=44, padB=24, padT=8, padR=8;
    var w=container.clientWidth||800, h=container.clientHeight||220;
    var iw=w-padL-padR, ih=h-padT-padB;
    var vis=series.filter(function(s){return !s.hidden;});
    var max=1;
    vis.forEach(function(s){ s.data.forEach(function(v){ if(v>max)max=v; }); });
    // Y轴刻度取整
    var step=Math.ceil(max/4/10)*10||10; var top=step*4;
    function xy(i,len,v){ var x=padL+(len<=1?0:i/(len-1)*iw); var y=padT+ih-(v/top)*ih; return [x,y]; }
    var svg='<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
    // 网格 + Y刻度
    for(var g=0; g<=4; g++){
      var gy=padT+ih-(g/4)*ih;
      svg+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="#f0f0f0" stroke-width="1"/>';
      svg+='<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="10" fill="#8c8c8c">'+(g*step)+'</text>';
    }
    // 轴线
    svg+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+ih)+'" stroke="#d9d9d9" stroke-width="1"/>';
    svg+='<line x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(w-padR)+'" y2="'+(padT+ih)+'" stroke="#d9d9d9" stroke-width="1"/>';
    // 折线
    vis.forEach(function(s){
      var pts=s.data.map(function(v,i){ var c=xy(i,s.data.length,v); return c[0]+','+c[1]; }).join(' ');
      svg+='<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>';
    });
    // X标签
    if(xLabels && xLabels.length){
      var len=vis.length?vis[0].data.length:xLabels.length;
      xLabels.forEach(function(lb){
        var idx=lb.i, c=xy(idx,len,0);
        svg+='<text x="'+c[0]+'" y="'+(padT+ih+16)+'" text-anchor="middle" font-size="10" fill="#8c8c8c">'+lb.t+'</text>';
      });
    }
    svg+='</svg>';
    container.innerHTML=svg;
    // 图例（点击隐藏/显示）
    if(legendEl){
      legendEl.innerHTML=series.map(function(s,i){
        var tip = s.name==='同时在场峰值' ? ' title="基于净流入+营业日清零，估算（见 3.5.1/3.5.5）"' : '';
        return '<span class="lg-item'+(s.hidden?' off':'')+'" data-i="'+i+'" role="button" tabindex="0" aria-pressed="'+(!s.hidden)+'"'+tip+'><span class="lg-swatch" style="background:'+s.color+'"></span>'+s.name+'</span>';
      }).join('');
      legendEl.querySelectorAll('.lg-item').forEach(function(it){
        function toggle(){ var i=+it.getAttribute('data-i'); series[i].hidden=!series[i].hidden; it.setAttribute('aria-pressed',(!series[i].hidden)); lineChart(container,series,xLabels,legendEl); }
        it.onclick=toggle;
        it.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } };
      });
    }
  }

  // ===== 数据 =====
  var trendSeries=[
    {name:'进入人数', color:'#1677ff', hidden:false, data:[12,8,5,4,3,6,28,95,180,210,240,268,312,295,260,238,256,278,242,180,120,80,50,28]},
    {name:'离开人数', color:'#52c41a', hidden:false, data:[10,7,4,3,3,5,22,80,165,195,228,250,298,280,255,232,248,270,238,178,115,75,48,26]},

    {name:'同时在场峰值', color:'#722ed1', hidden:false, data:[22,18,12,9,8,12,45,140,260,320,360,400,430,410,380,350,368,395,360,280,190,130,90,55]}
  ];
  // 对比数据（同期对比：今日->昨日、本周->上周、本月->上月，数值略低于当期）
  var trendCmpData = [
    {name:'进入人数', color:'#1677ff', data:[10,7,4,3,3,5,25,88,168,195,225,250,290,275,245,220,238,260,228,168,112,74,45,25]},
    {name:'离开人数', color:'#52c41a', data:[9,6,4,2,2,4,20,75,155,182,215,235,280,262,240,218,232,255,225,168,108,70,44,24]},

    {name:'同时在场峰值', color:'#722ed1', data:[20,16,11,8,7,11,42,130,245,300,340,378,408,388,360,330,348,375,340,262,178,122,84,51]}
  ];
  var trendCmpActive = 'none'; // none | period（对比同期：今日->昨日、本周->上周、本月->上月、自定义->上一相同长度周期）
  // 周（7 天）/ 月（30 天）聚合数据，避免与今日 24 小时数据混用（review-full-v1 M4）
  var trendWeekSeries=[
    {name:'进入人数', color:'#1677ff', hidden:false, data:[1850,1920,2100,2050,1980,1680,1450]},
    {name:'离开人数', color:'#52c41a', hidden:false, data:[1820,1880,2050,2010,1950,1660,1430]},

    {name:'同时在场峰值', color:'#722ed1', hidden:false, data:[430,455,520,498,470,380,290]}
  ];
  var trendWeekCmp=[
    {name:'进入人数', color:'#1677ff', data:[1680,1750,1900,1860,1800,1520,1310]},
    {name:'离开人数', color:'#52c41a', data:[1650,1720,1880,1840,1780,1500,1290]},

    {name:'同时在场峰值', color:'#722ed1', data:[410,430,490,470,445,360,275]}
  ];
  var trendMonthSeries=[
    {name:'进入人数', color:'#1677ff', hidden:false, data:[8200,8600,8400,8700,9100,9800,11200,12800,13500,13100,12600,12200,11800,12100,12500,13000,13400,12900,11800,10200,9100,8600,8400,8200,8300,8100,7900,7800,7600,7400]},
    {name:'离开人数', color:'#52c41a', hidden:false, data:[8000,8400,8200,8500,8900,9600,11000,12600,13300,12900,12400,12000,11600,11900,12300,12800,13200,12700,11600,10000,8900,8400,8200,8000,8100,7900,7700,7600,7400,7200]},

    {name:'同时在场峰值', color:'#722ed1', hidden:false, data:[280,290,295,300,310,318,328,320,315,300,285,275,270,272,280,290,300,295,280,260,250,245,240,238,240,235,230,228,225,222]}
  ];
  var trendMonthCmp=[
    {name:'进入人数', color:'#1677ff', data:[7600,7900,8100,8400,8800,9500,10800,12300,13000,12700,12200,11800,11400,11700,12100,12600,13000,12500,11400,9800,8700,8200,8000,7800,7900,7700,7500,7400,7200,7100]},
    {name:'离开人数', color:'#52c41a', data:[7400,7700,7900,8200,8600,9300,10600,12100,12800,12500,12000,11600,11200,11500,11900,12400,12800,12300,11200,9600,8500,8000,7800,7600,7700,7500,7300,7200,7000,6900]},

    {name:'同时在场峰值', color:'#722ed1', data:[265,275,280,285,295,302,296,305,300,285,270,260,255,257,265,275,285,280,265,245,235,230,225,223,225,220,215,213,210,208]}
  ];
  function renderTrend(){
    var rng = document.getElementById('trendRange').value;
    var gran = rng==='今日'?'小时':'天';
    var baseSrc, cmpSrc;
    if(rng==='本周'){ baseSrc=trendWeekSeries; cmpSrc=trendWeekCmp; }
    else if(rng==='本月'){ baseSrc=trendMonthSeries; cmpSrc=trendMonthCmp; }
    else { baseSrc=trendSeries; cmpSrc=trendCmpData; }
    var n = baseSrc[0].data.length;
    var xLabels = gran==='小时' ? [{i:0,t:'00:00'},{i:6,t:'06:00'},{i:12,t:'12:00'},{i:18,t:'18:00'},{i:23,t:'24:00'}]
      : (rng==='本周' ? [{i:0,t:'周一'},{i:6,t:'周日'}] : [{i:0,t:'1日'},{i:7,t:'8日'},{i:14,t:'15日'},{i:21,t:'22日'},{i:29,t:'30日'}]);
    var series = baseSrc.map(function(s){ return {name:s.name,color:s.color,hidden:s.hidden,data:s.data}; });
    if(trendCmpActive !== 'none'){
      var suffix = rng==='今日' ? ' 昨日' : rng==='本周' ? ' 上周' : rng==='本月' ? ' 上月' : ' 上一周期';
      cmpSrc.forEach(function(s,i){
        var a = baseSrc[i];
        series.push({name:a.name + suffix, color:a.color, hidden:a.hidden, data:s.data, cmp:true});
      });
    }
    lineChart(document.getElementById('trendChart'), series, xLabels, document.getElementById('trendLegend'));
    renderTrendTable(series, gran, n);
  }
  function toggleTrend(i,on){
    var rng=document.getElementById('trendRange').value;
    var src = rng==='本周'?trendWeekSeries : rng==='本月'?trendMonthSeries : trendSeries;
    src[i].hidden=!on; renderTrend();
  }
  function onTrendCompareChange(){
    trendCmpActive = document.getElementById('trendCmp').value;
    renderTrend();
  }
  function renderTrendTable(series, gran, n){
    var vis = series.filter(function(s){return !s.hidden;});
    var headHtml = '<tr><th>时段</th>';
    vis.forEach(function(s){ headHtml += '<th class="tnum">'+s.name+'</th>'; });
    headHtml += '</tr>';
    document.getElementById('trendTableHead').innerHTML = headHtml;
    n = n || (vis[0]?vis[0].data.length:0);
    var labels = [];
    if(n===24){ for(var h=0;h<24;h++) labels.push((h<10?'0':'')+h+':00'); }
    else if(n===7){ labels=['周一','周二','周三','周四','周五','周六','周日']; }
    else { for(var d=1;d<=n;d++) labels.push(d+'日'); }
    var bodyHtml = '';
    for(var i=0;i<labels.length;i++){
      bodyHtml += '<tr><td>'+labels[i]+'</td>';
      vis.forEach(function(s){
        bodyHtml += '<td class="tnum">'+(s.data[i]||0).toLocaleString()+'</td>';
      });
      bodyHtml += '</tr>';
    }
    document.getElementById('trendTableBody').innerHTML = bodyHtml;
  }
  function queryTrend(){
    onTrendFilterChange();
    showToast('已查询：'+document.getElementById('trendRange').value);
  }
  function queryRank(){
    renderRank();
    showToast('已查询：'+document.getElementById('rankTime').value);
  }
  function onTrendFilterChange(){
    var rng=document.getElementById('trendRange').value;
    var gran = rng==='今日'?'小时':'天';
    document.getElementById('customDateWrap').style.display = rng==='自定义'?'':'none';
    showToast('已切换：'+rng+' · 粒度 '+gran);
    renderTrend();
  }

  // 区域数据（供排行 / 明细共用）
  // 建筑排行 — 不同时间段数据
  var areasToday=[
    {name:'食堂就餐区', in:3856, out:3612, peak:486, cur:120, mom:12.5, yoy:22.0},
    {name:'B 栋大堂',   in:2402, out:2388, peak:312,  cur:88,  mom:5.2,  yoy:9.4},
    {name:'广场',       in:1956, out:1920, peak:258, cur:64,  mom:-3.1, yoy:4.2},
    {name:'A 栋办公区', in:1536, out:1498, peak:204, cur:152, mom:8.0,  yoy:15.1},
    {name:'地下车库入口', in:896, out:880, peak:128,  cur:12,  mom:null, yoy:null}
  ];
  var areasWeek=[
    {name:'食堂就餐区', in:22450, out:21080, peak:2580, cur:520, mom:6.2, yoy:18.5},
    {name:'广场',       in:15680, out:15200, peak:1850, cur:310, mom:-2.0, yoy:5.8},
    {name:'B 栋大堂',   in:14820, out:14650, peak:1600,  cur:420, mom:4.0,  yoy:8.2},
    {name:'A 栋办公区', in:9820, out:9650, peak:1100, cur:680, mom:7.5,  yoy:13.0},
    {name:'地下车库入口', in:5280, out:5200, peak:520,  cur:45,  mom:null, yoy:null}
  ];
  function fmt(n){ return n.toLocaleString('en-US'); }
  function pct(v){ if(v===null) return '<span class="text-tertiary">-</span>'; var c=v>=0?'var(--ant-success)':'var(--ant-error)'; return '<span style="color:'+c+'">'+(v>0?'+':'')+v+'%</span>'; }

  function getAreas(){ return document.getElementById('rankTime').value==='今日'?areasToday:areasWeek; }

  function renderRank(){
    // 简化：只按时间范围，固定进入人数降序，展示同比
    var areas = getAreas();
    var rows = areas.slice().sort(function(a,b){ return b.in-a.in; });
    document.getElementById('rankBody').innerHTML=rows.map(function(d,i){
      return '<tr><td>'+(i+1)+'</td><td>'+d.name+'</td><td>'+fmt(d.in)+'</td><td>'+fmt(d.out)+'</td><td>'+d.peak+'</td><td>'+pct(d.yoy)+'</td><td><button class="ant-btn ant-btn-text ant-btn-sm" onclick="drillTo(\''+d.name+'\')">查看详情</button></td></tr>';
    }).join('');
  }

  // ===== 查看详情：建筑排行 → 设备级明细 =====
  var deviceMap={
    '食堂就餐区':[{n:'食堂东门-01',in:2010,out:1880,peak:260},{n:'食堂西门-02',in:1846,out:1732,peak:226}],
    'B 栋大堂':[{n:'B栋正门-01',in:1402,out:1390,peak:190},{n:'B栋侧门-02',in:1000,out:998,peak:122}],
    '广场':[{n:'广场北闸-01',in:1156,out:1130,peak:150},{n:'广场南闸-02',in:800,out:790,peak:108}],
    'A 栋办公区':[{n:'A栋闸机-01',in:900,out:880,peak:120},{n:'A栋闸机-02',in:636,out:618,peak:84}],
    '地下车库入口':[{n:'车库入口-01',in:896,out:880,peak:128}]
  };
  function drillTo(name){
    if(!deviceMap[name]){ showToast('「'+name+'」暂无设备级明细'); return; }
    document.getElementById('rankAreaView').style.display='none';
    document.getElementById('rankDeviceView').style.display='';
    document.getElementById('rankDeviceTitle').textContent=name+' · 设备级明细';
    var list=deviceMap[name];
    document.getElementById('rankDeviceBody').innerHTML=list.map(function(d){
      return '<tr><td>'+d.n+'</td><td style="font-variant-numeric:tabular-nums">'+fmt(d.in)+'</td><td style="font-variant-numeric:tabular-nums">'+fmt(d.out)+'</td><td>'+d.peak+'</td></tr>';
    }).join('');
    document.getElementById('rankDeviceCount').textContent='共 '+list.length+' 台设备';
  }
  function drillBack(){
    document.getElementById('rankAreaView').style.display='';
    document.getElementById('rankDeviceView').style.display='none';
  }

  // ===== 初始化 =====
  renderTrend();
  renderRank();
</script>
</body>
</html>
