  <style>
    .heat-layer { background:
      radial-gradient(circle at 30% 45%, rgba(255,77,79,0.85) 0%, rgba(250,140,22,0.5) 18%, transparent 32%),
      radial-gradient(circle at 65% 55%, rgba(250,140,22,0.8) 0%, rgba(255,204,0,0.4) 20%, transparent 35%),
      radial-gradient(circle at 50% 25%, rgba(82,196,26,0.6) 0%, transparent 28%),
      radial-gradient(circle at 25% 75%, rgba(22,119,255,0.5) 0%, transparent 30%),
      radial-gradient(circle at 80% 30%, rgba(22,119,255,0.4) 0%, transparent 25%);
      mix-blend-mode:multiply; }
    .heat-layer-3d { background:
      radial-gradient(circle at 30% 45%, rgba(255,77,79,0.85) 0%, transparent 30%),
      radial-gradient(circle at 65% 55%, rgba(250,140,22,0.7) 0%, transparent 30%); }
    .map-base { background:#e8eef5; background-image:
      linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px);
      background-size:40px 40px; }
    .legend-bar { width:180px; height:10px; border-radius:5px; background:linear-gradient(90deg,#1677ff,#52c41a,#faad14,#ff4d4f); }
    .pin-online { color:#52c41a; } .pin-offline { color:rgba(0,0,0,0.25); }
    .rank-row { padding:9px 10px; border:1px solid var(--ant-border-secondary); border-radius:8px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, box-shadow .15s, background .15s; }
    .rank-row:hover { border-color:var(--ant-primary); box-shadow:0 2px 8px rgba(22,119,255,.12); }
    .rank-row.active { border-color:var(--ant-primary); background:var(--ant-primary-bg); }
    .rank-bar-track { height:5px; border-radius:3px; background:#f0f0f0; margin-top:6px; overflow:hidden; }
    .rank-bar-fill { height:100%; border-radius:3px; }
    .st-tag { font-size:10px; padding:0 6px; border-radius:8px; line-height:16px; display:inline-block; }
    .st-normal { background:#f6ffed; color:#52c41a; border:1px solid #b7eb8f; }
    .st-near { background:#fff7e6; color:#fa8c16; border:1px solid #ffd591; }
    .st-over { background:#fff2f0; color:#ff4d4f; border:1px solid #ffccc7; }
    @keyframes overPulse { 0%,100%{opacity:.85;} 50%{opacity:.35;} }
    .poly-over { animation:overPulse 1.2s ease-in-out infinite; }
    .adv-toggle { cursor:pointer; user-select:none; color:var(--ant-primary); font-size:13px; }
  </style>
</head>

              <!-- 建筑示意 -->
              <div style="position:absolute;top:15%;left:8%;width:24%;height:32%;background:rgba(22,119,255,0.12);border:1px solid rgba(22,119,255,0.4);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(22,119,255,0.8);">A 栋</div>
              <div style="position:absolute;top:15%;right:8%;width:30%;height:38%;background:rgba(250,140,22,0.12);border:1px solid rgba(250,140,22,0.4);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(250,140,22,0.9);">食堂</div>

        <!-- 右侧：实时建筑热度榜 + 高级面板 -->

                  <button class="ant-btn ant-btn-sm ant-btn-primary w-full" onclick="toggleCluster(this)">开启检测</button>

</div>

<script>
  function showToast(msg, duration) {
    duration = duration || 2000;
    var wrap = document.querySelector('.toast-wrap');
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
    var el = document.createElement('div');
    el.className = 'toast-msg';
    el.innerHTML = '<i class="fa-solid fa-circle-info" style="color:#1677ff;"></i>' + msg;
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () { el.classList.remove('show'); setTimeout(function () { el.remove(); }, 300); }, duration);
  }
  var TODAY = '2026-07-01'; // 原型基准“今日”
  // 历史回看不再是独立视图 Tab：由“日期”控件驱动--选今日=实时态，选历史日期=历史回看态（时间轴回放该日快照）
  function isLiveDate(){ var d=document.getElementById('dateSel'); return !d || d.value === TODAY; }
  // 统一联动实时/历史态：刷新标签、脉冲、榜单标题、KPI 语义
  function applyLiveState(){
    var live = isLiveDate();
    var refreshLabel=document.getElementById('refreshLabel'), refreshDot=document.getElementById('refreshDot');
    if(refreshLabel){ refreshLabel.textContent = live ? '实时 · 5 秒刷新 · 当前拥挤度（已去重）' : '历史回看 · 已定格 · 足迹热度（经过频率）'; }
    if(refreshDot){ refreshDot.style.background = live ? '#52c41a' : '#bfbfbf'; refreshDot.classList.toggle('pulse-dot', live); }
    var rankTitle=document.getElementById('rankTitle');
    if(rankTitle){ rankTitle.textContent = live ? '实时建筑热度榜' : '该日建筑热度榜'; }
    var sumLbl=document.getElementById('sumLbl');
    if(sumLbl){ sumLbl.textContent = live ? '在场' : '峰值'; }
    if(!live && playing){ togglePlay(); } // 历史态停止刷新动画，避免与定格态冲突
    return live;
  }
  function viewTitle(live){
    var d=document.getElementById('dateSel'); var day=d?d.value:TODAY;
    return (live?'实时热力图 · ':'历史回看 · ')+day+(live?' 全天':'（逐人位置快照重算密度）');
  }
  // 日期变更：今日→实时态，历史日期→历史回看态；随后刷新标题
  function onDateChange(){
    var live = applyLiveState();
    hourFilter = null;
    document.getElementById('heatTitle').textContent = viewTitle(live);
    renderHeatmap();
    showToast(live ? '已回到今日 · 实时热力图' : '已切换到历史回看 · '+document.getElementById('dateSel').value+'（拖动时间轴/播放回放该日）');
  }
  // 时段过滤：仅历史回看态生效
  var hourFilter = null; // {from, to} 小时数
  function parseHour(str){
    var m = String(str||'').trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    var h = parseInt(m[1],10), mm = parseInt(m[2],10);
    if(h<0||h>24||mm<0||mm>59) return null;
    return h + mm/60;
  }
  function filterByHour(){
    if(isLiveDate()){ showToast('请先切换到历史日期'); return; }
    var from = parseHour(document.getElementById('hourFrom').value);
    var to = parseHour(document.getElementById('hourTo').value);
    if(from === null || to === null){ showToast('时段格式无效，请输入 HH:MM'); return; }
    if(from > to){ showToast('起始时段不能晚于结束时段'); return; }
    hourFilter = {from:from, to:to};
    renderHeatmap();
    showToast('已按时段 '+document.getElementById('hourFrom').value+'-'+document.getElementById('hourTo').value+' 过滤足迹点');
  }
  var playing=false, timer=null, pos=52, speed=4;
  function togglePlay(){
    var btn=document.getElementById('playBtn');
    playing=!playing;
    btn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i> 暂停' : '<i class="fa-solid fa-play"></i> 播放';
    if(playing){ timer=setInterval(function(){ pos=(pos+0.5)%100; updateTimeline(); }, 200/speed); }
    else { clearInterval(timer); }
  }
  function exportHeatPNG(){
    var map=document.querySelector('.map-base');
    if(!map){ showToast('未找到热力图区域'); return; }
    var w=map.offsetWidth||800, h=map.offsetHeight||440;
    var svg=document.getElementById('heatRegionSvg');
    var svgContent=svg?svg.outerHTML:'';
    var data='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><rect width="100%" height="100%" fill="#e8eef5"/>'+svgContent.replace(/<svg[^>]*>/,'').replace(/<\/svg>/,'')+'</svg>';
    var blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var ctx=c.getContext('2d'); ctx.fillStyle='#e8eef5'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0);
      c.toBlob(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='heatmap-'+Date.now()+'.png'; a.click(); URL.revokeObjectURL(a.href); showToast('热力图已导出为 PNG'); });
      URL.revokeObjectURL(url);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); showToast('导出失败（浏览器安全限制），请截图保存'); };
    img.src=url;
  }
  function setSpeed(s,el){ speed=s; document.querySelectorAll('.ant-card-body .ant-btn-sm').forEach(function(b){ if(b.textContent==='1x'||b.textContent==='4x'||b.textContent==='16x') b.classList.remove('ant-btn-primary'); }); el.classList.add('ant-btn-primary'); if(playing){ clearInterval(timer); timer=setInterval(function(){ pos=(pos+0.5)%100; updateTimeline(); }, 200/speed); } }
  function updateTimeline(){
    document.getElementById('timeProgress').style.width=pos+'%';
    document.getElementById('timeKnob').style.left=pos+'%';
    var mins=Math.floor(pos/100*1440); var h=Math.floor(mins/60), m=mins%60;
    document.getElementById('timeLabel').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){} });
  // ===== 建筑热度数据（含阈值/环比，供热度榜 + KPI + 区域中心点）=====
  var heatRegions = [
    { id:'r1', name:'cam_001 取餐台区', group:'食堂', cam:'cam_001', count:486, threshold:400, mom:12, offline:false, mapX:0.75, mapY:0.22, trend:[30,42,55,70,88,100] },
    { id:'r2', name:'cam_002 就餐区', group:'食堂', cam:'cam_002', count:312, threshold:350, mom:6,  offline:false, mapX:0.80, mapY:0.42, trend:[20,35,48,60,72,80] },
    { id:'r3', name:'cam_008 主通道', group:'广场', cam:'cam_008', count:258, threshold:300, mom:-4, offline:false, mapX:0.45, mapY:0.80, trend:[40,52,60,58,64,66] },
    { id:'r4', name:'cam_007 候梯区', group:'A 栋', cam:'cam_007', count:96,  threshold:120, mom:3,  offline:false, mapX:0.20, mapY:0.58, trend:[10,18,22,28,25,24] },
    { id:'r5', name:'cam_006 大堂',   group:'A 栋', cam:'cam_006', count:0,   threshold:150, mom:0,  offline:true,  mapX:0.20, mapY:0.30, trend:[] }
  ];
  var curRegion=null;

  function ratioOf(r){ return r.threshold>0 ? r.count/r.threshold : 0; }
  function statusOf(r){ if(r.offline) return 'offline'; var x=ratioOf(r); if(x>=1) return 'over'; if(x>=0.8) return 'near'; return 'normal'; }
  function heatColor(r){
    if(r.offline) return '#bfbfbf';
    var x=ratioOf(r);
    if(x>=1) return '#ff4d4f';
    if(x>=0.8) return '#fa8c16';
    if(x>=0.5) return '#faad14';
    if(x>=0.2) return '#52c41a';
    return '#1677ff';
  }

  // ===== 足迹热力图（逐人脚位置映射累积密度，网格聚合着色）=====
  var mockFootprints = [
    {x:72,y:25},{x:75,y:28},{x:78,y:30},{x:73,y:32},{x:76,y:35},{x:80,y:38},{x:74,y:40},{x:77,y:42},{x:79,y:45},{x:82,y:48},
    {x:71,y:30},{x:74,y:33},{x:76,y:38},{x:78,y:42},{x:80,y:25},{x:75,y:45},{x:77,y:28},{x:79,y:35},{x:81,y:40},{x:73,y:38},
    {x:76,y:30},{x:78,y:25},{x:74,y:45},{x:80,y:42},{x:72,y:40},{x:77,y:32},{x:79,y:28},{x:75,y:42},{x:81,y:35},{x:73,y:35},
    {x:40,y:75},{x:45,y:78},{x:42,y:80},{x:48,y:82},{x:44,y:85},{x:46,y:78},{x:43,y:82},{x:47,y:80},{x:41,y:78},{x:44,y:82},
    {x:18,y:55},{x:20,y:58},{x:22,y:60},{x:19,y:62},{x:21,y:56},{x:20,y:60},{x:18,y:58}
  ];
  var clusterOn = false;
  var mockClusters = [{x:76,y:35,r:7,n:24},{x:44,y:80,r:5,n:9}];
  function densityColor(n,max){
    if(n===0) return 'transparent';
    var r=n/max;
    if(r>0.75) return '#ff4d4f';
    if(r>0.5) return '#fa8c16';
    if(r>0.3) return '#faad14';
    if(r>0.15) return '#52c41a';
    return '#1677ff';
  }
  function renderHeatmap(from, to){
    var svg=document.getElementById('heatRegionSvg'); if(!svg) return;
    var cols=24, rows=14;
    var grid=[]; for(var i=0;i<cols*rows;i++) grid[i]=0;
    // 时段过滤：传参优先，否则用 hourFilter（历史回看态持久化）；无时间属性按索引比例近似
    var useFrom = (from !== undefined) ? from : (hourFilter ? hourFilter.from : null);
    var useTo = (to !== undefined) ? to : (hourFilter ? hourFilter.to : null);
    var fp = mockFootprints;
    if(useFrom !== null && useTo !== null){
      var N = mockFootprints.length;
      fp = mockFootprints.filter(function(p,i){
        var hour = (i / N) * 24;
        return hour >= useFrom && hour <= useTo;
      });
    }
    fp.forEach(function(p){
      var cx=Math.floor(p.x/100*cols), cy=Math.floor(p.y/100*rows);
      if(cx>=0&&cx<cols&&cy>=0&&cy<rows) grid[cy*cols+cx]++;
    });
    var max=Math.max.apply(null,grid)||1;
    var cw=100/cols, ch=100/rows;
    var h='';
    for(var cy=0;cy<rows;cy++){
      for(var cx=0;cx<cols;cx++){
        var n=grid[cy*cols+cx];
        if(n>0){
          var op=0.2+0.55*(n/max);
          h+='<rect x="'+(cx*cw).toFixed(2)+'%" y="'+(cy*ch).toFixed(2)+'%" width="'+cw.toFixed(2)+'%" height="'+ch.toFixed(2)+'%" fill="'+densityColor(n,max)+'" fill-opacity="'+op.toFixed(2)+'"/>';
        }
      }
    }
    heatRegions.forEach(function(r){
      if(r.offline) return;
      var hl=r.id===curRegion;
      var color=heatColor(r);
      h+='<circle cx="'+(r.mapX*100)+'%" cy="'+(r.mapY*100)+'%" r="'+(hl?6:4)+'" fill="#fff" stroke="'+color+'" stroke-width="2" style="cursor:pointer" onclick="selectRegion(\''+r.id+'\')"><title>'+r.name+'：'+r.count+' 人 / 阈值 '+r.threshold+'</title></circle>';
    });
    if(clusterOn){
      mockClusters.forEach(function(c){
        h+='<circle cx="'+c.x+'%" cy="'+c.y+'%" r="'+c.r+'" fill="none" stroke="#ff4d4f" stroke-width="2" stroke-dasharray="4 3"/>';
        h+='<text x="'+c.x+'%" y="'+(c.y-2)+'%" text-anchor="middle" fill="#ff4d4f" font-size="10" font-weight="600" style="paint-order:stroke;stroke:rgba(0,0,0,0.5);stroke-width:2px;">聚集 '+c.n+'人</text>';
      });
    }
    svg.innerHTML=h;
  }
  function toggleCluster(btn){
    clusterOn=!clusterOn;
    btn.textContent = clusterOn?'关闭检测':'开启检测';
    btn.classList.toggle('ant-btn-primary', clusterOn);
    renderHeatmap();
    showToast(clusterOn?'聚集点检测已开启':'聚集点检测已关闭');
  }
  window.addEventListener('resize', renderHeatmap);

  // ===== 实时建筑热度榜 =====
  function renderRank(){
    var el=document.getElementById('rankList'); if(!el) return;
    var list=heatRegions.slice().sort(function(a,b){
      return b.count-a.count;
    });
    var maxCount=Math.max.apply(null, heatRegions.map(function(r){return r.count;}))||1;
    var stMeta={normal:['正常','st-normal'],near:['接近阈值','st-near'],over:['超员','st-over'],offline:['离线','st-tag']};
    el.innerHTML=list.map(function(r){
      var st=statusOf(r), meta=stMeta[st];
      var color=heatColor(r);
      var pct=Math.round(r.count/maxCount*100);
      var momHtml = r.offline ? '<span class="text-xs text-tertiary">-</span>'
        : '<span class="text-xs" style="color:'+(r.mom>=0?'#ff4d4f':'#52c41a')+'"><i class="fa-solid fa-arrow-'+(r.mom>=0?'up':'down')+'"></i> '+Math.abs(r.mom)+'%</span>';
      var extra = '';
      return '<div class="rank-row'+(r.id===curRegion?' active':'')+'" onclick="selectRegion(\''+r.id+'\')">'
        + '<div class="flex items-center justify-between">'
        + '<span class="text-sm font-medium">'+r.name+' <span class="text-xs text-tertiary">'+r.group+'</span></span>'
        + '<span class="st-tag '+meta[1]+'">'+meta[0]+'</span></div>'
        + '<div class="flex items-center justify-between mt-1">'
        + '<span class="text-sm font-semibold" style="color:'+color+'">'+(r.offline?'--':r.count)+' 人'+(r.offline?'':' <span class="text-xs text-tertiary">/'+r.threshold+'</span>')+'</span>'
        + '<span class="flex items-center gap-2">'+momHtml+extra+'</span></div>'
        + '<div class="rank-bar-track"><div class="rank-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
        + '</div>';
    }).join('');
  }

  // ===== 摘要（标题栏：在场/峰值 + 超员数）=====
  function renderKpi(){
    var online=heatRegions.filter(function(r){return !r.offline;});
    var total=online.reduce(function(a,r){return a+r.count;},0);
    var over=online.filter(function(r){return statusOf(r)==='over';}).length;
    var st=document.getElementById('sumTotal'); if(st) st.textContent=total.toLocaleString();
    var so=document.getElementById('sumOver'); if(so) so.textContent=over;
  }

  // ===== 图榜联动 =====
  function selectRegion(id){ curRegion=(curRegion===id?null:id); renderHeatmap(); renderRank(); }
  function toggleAdv(){ var p=document.getElementById('advPanel'), c=document.getElementById('advCaret'); var open=p.style.display==='none'; p.style.display=open?'block':'none'; c.style.transform=open?'rotate(90deg)':'rotate(0)'; }

  function renderAll(){ renderHeatmap(); renderRank(); renderKpi(); }
  document.addEventListener('DOMContentLoaded', renderAll);
</script>
</body>
