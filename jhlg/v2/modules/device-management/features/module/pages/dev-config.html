<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理 - 设备开发配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1677ff', 'primary-hover': '#4096ff', success: '#52c41a', slate: '#f0f2f5' }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 4px;
        }

        /* Toggle Switch CSS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #1677ff;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #1677ff;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans h-screen flex overflow-hidden">
    <!-- 侧边栏 -->
    <aside class="w-56 bg-white border-r border-gray-200 flex flex-col h-full flex-shrink-0 z-20">
        <div class="h-14 flex items-center px-6 border-b border-gray-200">
            <i class="ph-fill ph-hard-drives text-2xl text-primary mr-2"></i>
            <span class="text-base font-bold text-gray-800">物联网管理平台</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 custom-scrollbar">
            <div class="px-6 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">设备管理</div>
            <div class="space-y-1">
                <a href="#" class="flex items-center px-6 py-2 text-sm text-gray-700 bg-gray-50 font-medium">
                    <i class="ph ph-cpu text-lg mr-2 text-gray-500"></i> 设备
                    <i class="ph ph-caret-down ml-auto text-xs text-gray-400"></i>
                </a>
                <div class="pl-12 space-y-1">
                    <a href="../../../dashboard/module/index.html"
                        class="block py-2 text-sm text-gray-600 hover:text-primary">仪表盘</a>
                    <a href="../index.html" class="block py-2 text-sm text-gray-600 hover:text-primary">设备列表</a>
                    <a href="dev-config.html"
                        class="block py-2 text-sm text-primary font-medium hover:text-primary">设备开发配置</a>
                    <a href="data-catalog.html" class="block py-2 text-sm text-gray-600 hover:text-primary">感知数据目录管理</a>
                    <a href="group-config.html" class="block py-2 text-sm text-gray-600 hover:text-primary">设备组开发配置</a>
                </div>
            </div>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- 顶部通栏 -->
        <header class="h-14 bg-white border-b border-gray-200 flex justify-between items-center px-6 flex-shrink-0">
            <div class="flex items-center text-sm text-gray-500">
                <span>设备管理</span>
                <i class="ph ph-caret-right mx-2 text-xs"></i> <span>设备</span>
                <i class="ph ph-caret-right mx-2 text-xs"></i> <span class="text-gray-900 font-medium">设备开发配置</span>
            </div>
            <div class="flex items-center space-x-4">
                <i class="ph ph-bell text-xl text-gray-500 cursor-pointer"></i>
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-primary font-bold">管
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-slate custom-scrollbar relative">



            <!-- 搜索区 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 mb-4">
                <form class="grid grid-cols-4 gap-4">
                    <div class="flex flex-col space-y-1">
                        <label class="text-[13px] text-slate-500">设备组织名称</label>
                        <input type="text" placeholder="如: 保卫处"
                            class="w-full h-9 px-3 border border-slate-300 rounded focus:border-primary outline-none text-[13px] hover:border-primary/50 transition">
                    </div>
                    <div class="flex flex-col space-y-1">
                        <label class="text-[13px] text-slate-500">设备名称 / ID</label>
                        <input type="text" placeholder="输入名称或ID"
                            class="w-full h-9 px-3 border border-slate-300 rounded focus:border-primary outline-none text-[13px] hover:border-primary/50 transition">
                    </div>
                    <div class="flex flex-col space-y-1">
                        <label class="text-[13px] text-slate-500">开放状态</label>
                        <select
                            class="w-full h-9 px-3 border border-slate-300 rounded focus:border-primary outline-none text-[13px] hover:border-primary/50 transition bg-white">
                            <option value="">全部</option>
                            <option value="enabled">启用</option>
                            <option value="disabled">停用</option>
                        </select>
                    </div>
                    <div class="flex items-end justify-end space-x-2">
                        <button type="button"
                            class="px-4 py-1.5 border border-slate-300 text-slate-600 rounded text-[13px] hover:border-primary hover:text-primary transition-colors bg-white">重置</button>
                        <button type="button"
                            class="px-4 py-1.5 bg-primary text-white border border-primary rounded text-[13px] hover:bg-primary-hover transition-colors shadow-sm">查询</button>
                    </div>
                </form>
            </div>

            <!-- 列表区 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex space-x-2">
                    <button
                        class="px-3 py-1.5 border border-slate-300 text-slate-700 rounded text-[13px] hover:border-primary hover:text-primary transition-colors flex items-center bg-white shadow-sm"
                        onclick="batchAction('启用')">
                        <i class="ph ph-play-circle mr-1.5"></i> 批量启用
                    </button>
                    <button
                        class="px-3 py-1.5 border border-slate-300 text-slate-700 rounded text-[13px] hover:border-error hover:text-error transition-colors flex items-center bg-white shadow-sm"
                        onclick="batchAction('停用')">
                        <i class="ph ph-stop-circle mr-1.5"></i> 批量停用
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[13px] whitespace-nowrap">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-500">
                            <tr>
                                <th class="py-3 px-4 w-10 text-center"><input type="checkbox" id="selectAll"
                                        class="rounded border-slate-300 text-primary cursor-pointer focus:ring-0"></th>
                                <th class="py-3 px-4 font-medium">设备组织名称</th>
                                <th class="py-3 px-4 font-medium">设备 ID / 名称</th>
                                <th class="py-3 px-4 font-medium">所属产品</th>
                                <th class="py-3 px-4 font-medium">设备类型</th>
                                <th class="py-3 px-4 font-medium">开放状态</th>
                                <th class="py-3 px-4 font-medium">更新时间</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-700" id="tableBody">
                            <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                <td class="py-3 px-4 text-center"><input type="checkbox"
                                        class="row-checkbox rounded border-slate-300 text-primary cursor-pointer focus:ring-0"></td>
                                <td class="py-3 px-4 text-slate-800">浙江金华理工学院 / 保卫处</td>
                                <td class="py-3 px-4">
                                    <div class="font-medium text-slate-800">C2023-Cam-01</div>
                                    <div class="text-slate-500 text-xs mt-0.5">主校区南门摄像头</div>
                                </td>
                                <td class="py-3 px-4">智能安防摄像头</td>
                                <td class="py-3 px-4">直连设备</td>
                                <td class="py-3 px-4">
                                    <!-- Toggle -->
                                    <div
                                        class="relative inline-block w-9 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" name="toggle" id="toggle1"
                                            class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-2 appearance-none cursor-pointer top-0.5 left-0.5"
                                            checked onclick="handleToggle(this, '主校区南门摄像头')" />
                                        <label for="toggle1"
                                            class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-300 cursor-pointer"></label>
                                    </div>
                                    <span class="text-[13px] font-medium text-primary ml-1" id="status-toggle1">启用</span>
                                </td>
                                <td class="py-3 px-4 text-slate-500">2026-03-08 10:30:00</td>
                            </tr>
                            <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                <td class="py-3 px-4 text-center"><input type="checkbox"
                                        class="row-checkbox rounded border-slate-300 text-primary cursor-pointer focus:ring-0"></td>
                                <td class="py-3 px-4 text-slate-800">--</td>
                                <td class="py-3 px-4">
                                    <div class="font-medium text-slate-800">ENV-00129</div>
                                    <div class="text-slate-500 text-xs mt-0.5">实验楼空气监测站</div>
                                </td>
                                <td class="py-3 px-4">空气质量微站</td>
                                <td class="py-3 px-4">网关子设备</td>
                                <td class="py-3 px-4">
                                    <div
                                        class="relative inline-block w-9 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" name="toggle" id="toggle2"
                                            class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-2 appearance-none cursor-pointer top-0.5 left-0.5"
                                            onclick="handleToggle(this, '实验楼空气监测站')" />
                                        <label for="toggle2"
                                            class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-300 cursor-pointer"></label>
                                    </div>
                                    <span class="text-[13px] font-medium text-slate-400 ml-1" id="status-toggle2">停用</span>
                                </td>
                                <td class="py-3 px-4 text-slate-500">2026-03-07 14:20:11</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <div class="px-4 py-3 border-t border-slate-100 flex items-center justify-between bg-white">
                    <div class="text-[13px] text-slate-500">共 2 条记录</div>
                    <div class="flex items-center gap-2">
                        <button class="px-2 py-1 border border-slate-200 rounded text-[12px] text-slate-500 hover:bg-slate-50 disabled:opacity-50" disabled><i class="ph ph-caret-left"></i></button>
                        <button class="px-2 py-1 bg-primary text-white border border-primary rounded text-[12px]">1</button>
                        <button class="px-2 py-1 border border-slate-200 rounded text-[12px] text-slate-500 hover:bg-slate-50 disabled:opacity-50" disabled><i class="ph ph-caret-right"></i></button>
                        <select class="border border-slate-200 rounded text-[12px] text-slate-500 py-1 px-1 outline-none bg-white">
                            <option>10 条/页</option>
                            <option>20 条/页</option>
                            <option>50 条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Alert Modal / Toast for simulation -->
    <div id="toast"
        class="fixed top-6 right-1/2 translate-x-1/2 bg-white border border-gray-200 shadow-lg flex items-center p-3 rounded opacity-0 transition-opacity z-50 pointer-events-none">
        <i class="ph-fill ph-check-circle text-success text-xl mr-2"></i>
        <span class="text-sm text-gray-800" id="toastMsg">状态已更新</span>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function handleToggle(checkbox, name) {
            // Prevent default toggle momentarily to show confirm
            checkbox.checked = !checkbox.checked;

            const action = checkbox.checked ? '停用' : '启用';
            if (confirm(`确定要 ${action} 设备【${name}】的开发状态吗？\n状态更新后立即生效。`)) {
                checkbox.checked = !checkbox.checked; // apply toggle
                const statusSpan = document.getElementById('status-' + checkbox.id);
                if (checkbox.checked) {
                    statusSpan.innerText = '启用';
                    statusSpan.className = 'text-sm font-medium text-primary ml-1';
                } else {
                    statusSpan.innerText = '停用';
                    statusSpan.className = 'text-sm font-medium text-gray-400 ml-1';
                }
                showToast(`已${checkbox.checked ? '启用' : '停用'}`);
            }
        }

        function batchAction(action) {
            const checks = document.querySelectorAll('.row-checkbox:checked');
            if (checks.length === 0) {
                alert("请先选择设备！");
                return;
            }
            if (confirm(`确定要批量 ${action} 选中的 ${checks.length} 个设备吗？`)) {
                showToast(`批量 ${action} 成功`);
                document.getElementById('selectAll').checked = false;
                checks.forEach(c => {
                    c.checked = false;
                    const tr = c.closest('tr');
                    if (tr) {
                        const toggle = tr.querySelector('.toggle-checkbox');
                        const statusSpan = tr.querySelector('span[id^="status-toggle"]');
                        if (toggle && statusSpan) {
                            const isEnable = action === '启用';
                            toggle.checked = isEnable;
                            if (isEnable) {
                                statusSpan.innerText = '启用';
                                statusSpan.className = 'text-sm font-medium text-primary ml-1';
                            } else {
                                statusSpan.innerText = '停用';
                                statusSpan.className = 'text-sm font-medium text-gray-400 ml-1';
                            }
                        }
                    }
                });
            }
        }

        document.getElementById('selectAll').addEventListener('change', function (e) {
            document.querySelectorAll('.row-checkbox').forEach(c => c.checked = e.target.checked);
        });
    </script>
</body>

</html>
