<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三方平台管理 v1.1 原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/prototype-theme.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .shell {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            background:
                radial-gradient(circle at top left, rgba(73, 125, 255, 0.28), transparent 26%),
                linear-gradient(180deg, #10203a 0%, #0d172b 100%);
            color: rgba(240, 246, 255, 0.9);
            padding: 28px 22px;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .brand-box {
            padding: 22px 20px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .nav-card {
            padding: 12px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-link {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 15px 16px;
            border-radius: 18px;
            text-decoration: none;
            color: rgba(234, 242, 255, 0.88);
            transition: all 0.18s ease;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-link.active {
            background: linear-gradient(135deg, rgba(22, 93, 255, 0.22) 0%, rgba(22, 93, 255, 0.08) 100%);
            border-color: rgba(135, 176, 255, 0.28);
            box-shadow: 0 12px 24px rgba(10, 24, 58, 0.24);
        }

        .nav-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 84px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(216, 227, 241, 0.9);
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(16px);
        }

        .topbar-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: #eef4ff;
            color: var(--brand);
            font-size: 12px;
            font-weight: 800;
        }

        .frame-wrap {
            flex: 1;
            min-height: 0;
            padding: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        @media (max-width: 1100px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                padding-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand-box">
                <div class="display-font text-[13px] tracking-[0.22em] uppercase text-blue-200/80">Prototype v1.1</div>
                <h1 class="display-font text-[28px] font-extrabold leading-tight mt-3">第三方平台管理</h1>
            </div>

            <div class="nav-card">
                <div class="text-xs font-bold tracking-[0.18em] uppercase text-slate-400 mb-3 px-3">功能模块</div>
                <nav class="space-y-2" id="nav-menu">
                    <a href="pages/platform.html" target="content_frame" class="nav-link active" data-page="platform" data-title="第三方平台及授权管理">
                        <span class="nav-icon"><i class="fa-solid fa-building-shield"></i></span>
                        <span>
                            <span class="block font-bold text-[15px]">第三方平台</span>
                        </span>
                    </a>
                    <a href="pages/api.html" target="content_frame" class="nav-link" data-page="api" data-title="API管理">
                        <span class="nav-icon"><i class="fa-solid fa-code-branch"></i></span>
                        <span>
                            <span class="block font-bold text-[15px]">API管理</span>
                        </span>
                    </a>
                    <a href="pages/api_governance.html" target="content_frame" class="nav-link" data-page="governance" data-title="接口治理">
                        <span class="nav-icon"><i class="fa-solid fa-wave-square"></i></span>
                        <span>
                            <span class="block font-bold text-[15px]">接口治理</span>
                        </span>
                    </a>
                    <a href="pages/data-share.html" target="content_frame" class="nav-link" data-page="stats" data-title="数据统计">
                        <span class="nav-icon"><i class="fa-solid fa-chart-column"></i></span>
                        <span>
                            <span class="block font-bold text-[15px]">数据统计</span>
                        </span>
                    </a>
                </nav>
            </div>

        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <div class="text-xs uppercase tracking-[0.18em] text-slate-400">Jinhua Polytechnic IoT</div>
                    <h2 class="display-font text-[26px] font-extrabold leading-none mt-2 text-slate-900" id="header-title">第三方平台及授权管理</h2>
                </div>
                <div class="topbar-meta">
                    <span class="version-badge"><i class="fa-solid fa-sparkles"></i> PRD 对齐版</span>
                    <div class="text-right">
                        <div class="text-xs text-slate-400">当前版本</div>
                        <div class="font-bold text-slate-800">v1.1 Prototype</div>
                    </div>
                </div>
            </header>

            <div class="frame-wrap">
                <iframe name="content_frame" id="content_frame" src="pages/platform.html"></iframe>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuItems = Array.from(document.querySelectorAll('.nav-link'));
            const headerTitle = document.getElementById('header-title');
            const frame = document.getElementById('content_frame');

            const pageMap = {
                platform: { href: 'pages/platform.html', title: '第三方平台及授权管理' },
                api: { href: 'pages/api.html', title: 'API管理' },
                governance: { href: 'pages/api_governance.html', title: '接口治理' },
                stats: { href: 'pages/data-share.html', title: '数据统计' }
            };

            function applyPage(pageKey, pushState = false) {
                const targetPage = pageMap[pageKey] ? pageKey : 'platform';
                const config = pageMap[targetPage];

                frame.src = config.href;
                headerTitle.textContent = config.title;

                menuItems.forEach((node) => {
                    node.classList.toggle('active', node.dataset.page === targetPage);
                });

                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.set('page', targetPage);
                if (pushState) {
                    window.history.pushState({}, '', nextUrl);
                } else {
                    window.history.replaceState({}, '', nextUrl);
                }
            }

            menuItems.forEach((item) => {
                item.addEventListener('click', (event) => {
                    event.preventDefault();
                    applyPage(item.dataset.page, true);
                });
            });

            window.addEventListener('popstate', () => {
                const currentPage = new URL(window.location.href).searchParams.get('page') || 'platform';
                applyPage(currentPage, false);
            });

            const initialPage = new URL(window.location.href).searchParams.get('page') || 'platform';
            applyPage(initialPage, false);
        });
    </script>
</body>
</html>
