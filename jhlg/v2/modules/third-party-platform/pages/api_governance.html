<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接口治理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="../assets/prototype-theme.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="page-body" x-data="governancePage()" x-init="init()">
    <div class="page-shell">
        <section class="panel-card">
            <div class="panel-head">
                <div>
                    <h2 class="panel-title display-font">接口治理</h2>
                </div>
            </div>
            <div class="subtabs mb-5">
                <button class="subtab-btn" :class="{ 'active': activeTab === 'monitor' }" @click="activeTab = 'monitor'">接口监控</button>
                <button class="subtab-btn" :class="{ 'active': activeTab === 'log' }" @click="activeTab = 'log'">接口日志</button>
                <button class="subtab-btn" :class="{ 'active': activeTab === 'version' }" @click="activeTab = 'version'">接口版本管理</button>
                <button class="subtab-btn" :class="{ 'active': activeTab === 'perf' }" @click="activeTab = 'perf'">接口性能</button>
                <button class="subtab-btn" :class="{ 'active': activeTab === 'debug' }" @click="activeTab = 'debug'">在线调试</button>
            </div>

            <template x-if="activeTab === 'monitor'">
                <div class="space-y-4">
                    <div class="stat-grid">
                        <div class="stat-card">
                            <p class="stat-label">监控接口总数</p>
                            <p class="stat-value display-font">18</p>
                            <div class="stat-meta">最近刷新：<span x-text="lastRefresh"></span></div>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label">正常接口</p>
                            <p class="stat-value display-font text-emerald-600">13</p>
                            <div class="stat-meta">成功率稳定</div>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label">异常接口</p>
                            <p class="stat-value display-font text-red-500">3</p>
                            <div class="stat-meta">需优先排查</div>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label">未知接口</p>
                            <p class="stat-value display-font text-amber-500">2</p>
                            <div class="stat-meta">等待新数据</div>
                        </div>
                    </div>

                    <div class="section-card">
                        <div class="control-grid">
                            <div>
                                <label class="field-label">接口名称</label>
                                <input class="field" type="text" placeholder="请输入接口名称" x-model="monitorFilters.name">
                            </div>
                            <div>
                                <label class="field-label">所属平台</label>
                                <select class="select" x-model="monitorFilters.platform">
                                    <option value="">全部平台</option>
                                    <option value="市一网统管平台">市一网统管平台</option>
                                    <option value="通广路灯管养系统">通广路灯管养系统</option>
                                    <option value="环保监测大屏">环保监测大屏</option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label">运行状态</label>
                                <select class="select" x-model="monitorFilters.status">
                                    <option value="">全部</option>
                                    <option value="正常">正常</option>
                                    <option value="异常">异常</option>
                                    <option value="未知">未知</option>
                                </select>
                            </div>
                            <div class="flex items-end justify-end gap-3">
                                <button class="btn btn-secondary" @click="monitorFilters = { name: '', platform: '', status: '' }">重置</button>
                                <button class="btn btn-primary" @click="showToast('已刷新接口监控')">查询</button>
                            </div>
                        </div>
                    </div>

                    <div class="table-shell">
                        <div class="table-scroll">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>接口名称</th>
                                        <th>所属平台</th>
                                        <th>运行状态</th>
                                        <th>成功率</th>
                                        <th>错误率</th>
                                        <th>最近调用时间</th>
                                        <th>平均响应时长</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="item in filteredMonitor" :key="item.id">
                                        <tr>
                                            <td class="font-bold" x-text="item.name"></td>
                                            <td x-text="item.platform"></td>
                                            <td><span class="status-pill" :class="item.status === '正常' ? 'success' : (item.status === '异常' ? 'danger' : 'warning')" x-text="item.status"></span></td>
                                            <td x-text="item.successRate"></td>
                                            <td x-text="item.errorRate"></td>
                                            <td class="muted" x-text="item.lastCall"></td>
                                            <td x-text="item.avgRt"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="activeTab === 'log'">
                <div class="space-y-4">
                    <div class="section-card">
                        <div class="control-grid">
                            <div>
                                <label class="field-label">平台名称</label>
                                <select class="select" x-model="logFilters.platform">
                                    <option value="">全部平台</option>
                                    <option value="市一网统管平台">市一网统管平台</option>
                                    <option value="通广路灯管养系统">通广路灯管养系统</option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label">接口名称</label>
                                <input class="field" type="text" placeholder="请输入接口名称" x-model="logFilters.name">
                            </div>
                            <div>
                                <label class="field-label">调用状态</label>
                                <select class="select" x-model="logFilters.status">
                                    <option value="">全部</option>
                                    <option value="成功">成功</option>
                                    <option value="失败">失败</option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label">时间范围</label>
                                <select class="select" x-model="logFilters.range">
                                    <option value="7d">最近 7 天</option>
                                    <option value="30d">最近 30 天</option>
                                    <option value="90d">最近 90 天</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="table-shell">
                        <div class="table-scroll">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>调用时间</th>
                                        <th>平台名称</th>
                                        <th>接口名称</th>
                                        <th>请求方式</th>
                                        <th>调用状态</th>
                                        <th>错误码</th>
                                        <th>响应时长</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="item in filteredLogs" :key="item.id">
                                        <tr>
                                            <td class="muted" x-text="item.time"></td>
                                            <td x-text="item.platform"></td>
                                            <td class="font-mono text-xs" x-text="item.path"></td>
                                            <td><span class="method-pill" :class="item.method.toLowerCase()" x-text="item.method"></span></td>
                                            <td><span class="status-pill" :class="item.status === '成功' ? 'success' : 'danger'" x-text="item.status"></span></td>
                                            <td x-text="item.errorCode || '--'"></td>
                                            <td x-text="item.duration"></td>
                                            <td><button class="link-btn" @click="openLogDetail(item)">查看详情</button></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="activeTab === 'version'">
                <div class="space-y-4">
                    <div class="panel-head !mb-0">
                        <div>
                            <h2 class="panel-title display-font">接口版本管理</h2>
                            <p class="panel-subtitle">同一接口仅允许存在一个默认版本，状态为“废弃”时不可设为默认。</p>
                        </div>
                        <div class="btn-row">
                            <button class="btn btn-secondary" @click="versionSearch = ''">重置</button>
                            <button class="btn btn-primary" @click="openVersionModal()"><i class="fa-solid fa-plus"></i>新增版本</button>
                        </div>
                    </div>
                    <div class="section-card">
                        <div class="control-grid !grid-cols-2">
                            <div>
                                <label class="field-label">接口名称</label>
                                <input class="field" type="text" placeholder="请输入接口名称" x-model="versionSearch">
                            </div>
                        </div>
                    </div>

                    <div class="table-shell">
                        <div class="table-scroll">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>接口名称</th>
                                        <th>版本号</th>
                                        <th>默认版本</th>
                                        <th>状态</th>
                                        <th>说明</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="item in filteredVersions" :key="item.id">
                                        <tr>
                                            <td class="font-bold" x-text="item.name"></td>
                                            <td class="font-mono text-xs" x-text="item.version"></td>
                                            <td x-text="item.isDefault ? '是' : '否'"></td>
                                            <td><span class="status-pill" :class="item.status === '启用' ? 'success' : (item.status === '停用' ? 'warning' : 'disabled')" x-text="item.status"></span></td>
                                            <td class="muted" x-text="item.remark"></td>
                                            <td><button class="link-btn" @click="openVersionModal(item)">编辑</button></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="activeTab === 'perf'">
                <div class="space-y-4">
                    <div class="notice warning">
                        <i class="fa-solid fa-gauge-high mt-1"></i>
                        <div>性能参数保存后仅对新请求生效，历史日志不受影响。当前页面支持超时时间、重试次数和限流阈值的行内维护。</div>
                    </div>
                    <div class="table-shell">
                        <div class="table-scroll">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>接口名称</th>
                                        <th>超时时间(ms)</th>
                                        <th>重试次数</th>
                                        <th>限流阈值(次/分)</th>
                                        <th>近1天平均响应</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="item in perfConfig" :key="item.name">
                                        <tr>
                                            <td class="font-bold" x-text="item.name"></td>
                                            <td><input class="field !h-[40px]" type="number" x-model="item.timeout"></td>
                                            <td><input class="field !h-[40px]" type="number" x-model="item.retry"></td>
                                            <td><input class="field !h-[40px]" type="number" x-model="item.limit"></td>
                                            <td x-text="item.avgRt"></td>
                                            <td><button class="btn btn-light !h-[38px]" @click="showToast('性能参数已保存')">保存</button></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="activeTab === 'debug'">
                <div class="space-y-4">
                    <div class="split-layout">
                        <div class="section-card !mb-0">
                            <h3 class="section-title display-font">目标平台与设备</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="field-label">目标平台</label>
                                    <select class="select" x-model="debug.platform">
                                        <option value="市一网统管平台">市一网统管平台</option>
                                        <option value="通广路灯管养系统">通广路灯管养系统</option>
                                    </select>
                                </div>
                                <div class="stack-list">
                                    <template x-for="item in debugDevices" :key="item.id">
                                        <div class="stack-item" :class="{ 'active': debug.deviceId === item.id }" @click="debug.deviceId = item.id; debug.command = item.commands[0]">
                                            <div class="font-bold" x-text="item.name"></div>
                                            <div class="muted text-xs mt-2" x-text="item.product"></div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div class="section-card !mb-0">
                            <div class="panel-head !mb-0">
                                <div>
                                    <h3 class="section-title display-font !mb-2">在线调试</h3>
                                    <p class="panel-subtitle">选择设备和命令后填写参数，发送后展示请求报文、响应报文和执行状态。</p>
                                </div>
                            </div>
                            <div class="form-grid">
                                <div>
                                    <label class="field-label">命令类型</label>
                                    <select class="select" x-model="debug.command">
                                        <template x-for="item in currentDebugDevice.commands" :key="item">
                                            <option :value="item" x-text="item"></option>
                                        </template>
                                    </select>
                                </div>
                                <div>
                                    <label class="field-label">执行状态</label>
                                    <input class="field" type="text" :value="debug.status" disabled>
                                </div>
                                <div class="full-span">
                                    <label class="field-label">参数模板</label>
                                    <textarea class="textarea" x-model="debug.payload"></textarea>
                                </div>
                            </div>
                            <div class="btn-row mt-4 justify-end">
                                <button class="btn btn-primary" @click="sendCommand"><i class="fa-solid fa-paper-plane"></i>发送</button>
                            </div>
                            <div class="section-card mt-5 !mb-0">
                                <h3 class="section-title display-font">响应报文</h3>
                                <pre class="code-block" x-text="debug.response"></pre>
                            </div>
                        </div>
                    </div>

                    <div class="section-card !mb-0">
                        <h3 class="section-title display-font">命令历史</h3>
                        <div class="table-shell">
                            <div class="table-scroll">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>执行时间</th>
                                            <th>目标设备</th>
                                            <th>命令类型</th>
                                            <th>执行状态</th>
                                            <th>响应时长</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="item in debugHistory" :key="item.id">
                                            <tr>
                                                <td class="muted" x-text="item.time"></td>
                                                <td x-text="item.device"></td>
                                                <td x-text="item.command"></td>
                                                <td><span class="status-pill" :class="item.status === '成功' ? 'success' : (item.status === '失败' ? 'danger' : 'warning')" x-text="item.status"></span></td>
                                                <td x-text="item.duration"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </section>
    </div>

    <template x-if="logDetail.open">
        <div>
            <div class="modal-backdrop" @click="logDetail.open = false"></div>
            <div class="drawer">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title display-font">日志详情</h2>
                        <p class="panel-subtitle" x-text="logDetail.item?.path"></p>
                    </div>
                    <button class="btn btn-ghost" @click="logDetail.open = false"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="modal-body">
                    <div class="kv-grid">
                        <div class="kv-card"><div class="kv-label">调用时间</div><div class="kv-value" x-text="logDetail.item?.time"></div></div>
                        <div class="kv-card"><div class="kv-label">调用状态</div><div class="kv-value" x-text="logDetail.item?.status"></div></div>
                    </div>
                    <div class="section-card mt-4">
                        <h3 class="section-title display-font">请求信息</h3>
                        <pre class="code-block" x-text="logDetail.item?.request"></pre>
                    </div>
                    <div class="section-card !mb-0">
                        <h3 class="section-title display-font">响应信息</h3>
                        <pre class="code-block" x-text="logDetail.item?.response"></pre>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="versionModal.open">
        <div>
            <div class="modal-backdrop" @click="versionModal.open = false"></div>
            <div class="modal-card">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title display-font" x-text="versionModal.item ? '编辑版本' : '新增版本'"></h2>
                        <p class="panel-subtitle">同一接口仅允许一个默认版本，废弃状态不可设置为默认。</p>
                    </div>
                    <button class="btn btn-ghost" @click="versionModal.open = false"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="modal-body">
                    <div class="section-card !mb-0">
                        <div class="form-grid">
                            <div>
                                <label class="field-label">接口名称</label>
                                <input class="field" type="text" x-model="versionForm.name">
                            </div>
                            <div>
                                <label class="field-label">版本号</label>
                                <input class="field" type="text" x-model="versionForm.version">
                            </div>
                            <div>
                                <label class="field-label">状态</label>
                                <select class="select" x-model="versionForm.status">
                                    <option value="启用">启用</option>
                                    <option value="停用">停用</option>
                                    <option value="废弃">废弃</option>
                                </select>
                            </div>
                            <div class="flex items-end">
                                <label class="chip !justify-start"><input type="checkbox" x-model="versionForm.isDefault"> 设为默认版本</label>
                            </div>
                            <div class="full-span">
                                <label class="field-label">说明</label>
                                <textarea class="textarea" x-model="versionForm.remark"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="versionModal.open = false">取消</button>
                    <button class="btn btn-primary" @click="saveVersion">保存</button>
                </div>
            </div>
        </div>
    </template>

    <template x-if="toast.show">
        <div class="toast" :class="toast.type === 'error' ? 'error' : 'success'">
            <i class="fa-solid" :class="toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'"></i>
            <span x-text="toast.message"></span>
        </div>
    </template>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('governancePage', () => ({
                activeTab: 'monitor',
                lastRefresh: '2026-03-14 09:30:00',
                monitorFilters: { name: '', platform: '', status: '' },
                logFilters: { platform: '', name: '', status: '', range: '7d' },
                versionSearch: '',
                logDetail: { open: false, item: null },
                versionModal: { open: false, item: null },
                versionForm: { name: '', version: '', status: '启用', isDefault: false, remark: '' },
                toast: { show: false, message: '', type: 'success' },
                monitorList: [
                    { id: 1, name: '环境监测信息接口', platform: '市一网统管平台', status: '正常', successRate: '99.6%', errorRate: '0.4%', lastCall: '2026-03-14 09:28:12', avgRt: '128ms' },
                    { id: 2, name: '设备告警接口', platform: '市一网统管平台', status: '异常', successRate: '78.1%', errorRate: '21.9%', lastCall: '2026-03-14 09:27:41', avgRt: '632ms' },
                    { id: 3, name: '设备状态接口', platform: '环保监测大屏', status: '未知', successRate: '--', errorRate: '--', lastCall: '2026-03-13 22:17:00', avgRt: '--' }
                ],
                logs: [
                    { id: 11, time: '2026-03-14 09:21:36', platform: '市一网统管平台', path: '/api/open/v1/environment', method: 'GET', status: '成功', errorCode: '', duration: '36ms', request: 'GET /api/open/v1/environment?pageNo=1', response: '{ "code": 0, "message": "OK" }' },
                    { id: 12, time: '2026-03-14 09:18:05', platform: '通广路灯管养系统', path: '/api/open/v1/device/command', method: 'POST', status: '失败', errorCode: 'TIMEOUT', duration: '1500ms', request: 'POST /api/open/v1/device/command', response: '{ "code": 500, "message": "timeout" }' }
                ],
                versions: [
                    { id: 21, name: '环境监测信息接口', version: 'v1.0', isDefault: true, status: '启用', remark: '稳定发布版本' },
                    { id: 22, name: '环境监测信息接口', version: 'v2.0', isDefault: false, status: '停用', remark: '待联调版本' },
                    { id: 23, name: '设备告警接口', version: 'v1.1', isDefault: true, status: '启用', remark: '支持告警扩展字段' }
                ],
                perfConfig: [
                    { name: '环境监测信息接口', timeout: 5000, retry: 1, limit: 600, avgRt: '128ms' },
                    { name: '设备告警接口', timeout: 8000, retry: 2, limit: 300, avgRt: '632ms' },
                    { name: '设备状态接口', timeout: 5000, retry: 0, limit: 480, avgRt: '212ms' }
                ],
                debug: {
                    platform: '市一网统管平台',
                    deviceId: 101,
                    command: 'switch_control',
                    status: '未执行',
                    payload: '{\n  "switch": "on"\n}',
                    response: '{\n  "code": 0,\n  "message": "等待发送"\n}'
                },
                debugDevices: [
                    { id: 101, name: '9号楼2号灯控器', product: '智能路灯监控终端', commands: ['switch_control', 'brightness_adjust'] },
                    { id: 102, name: '高新区气象站A-01', product: '环境监测终端', commands: ['report_pull'] }
                ],
                debugHistory: [
                    { id: 301, time: '2026-03-14 09:24:11', device: '9号楼2号灯控器', command: 'switch_control', status: '成功', duration: '28ms' },
                    { id: 302, time: '2026-03-14 09:12:44', device: '高新区气象站A-01', command: 'report_pull', status: '失败', duration: '888ms' }
                ],

                init() {
                    this.refreshTimer = setInterval(() => {
                        this.lastRefresh = '2026-03-14 09:30:00';
                    }, 60000);
                },

                get filteredMonitor() {
                    return this.monitorList.filter((item) => {
                        const matchName = !this.monitorFilters.name || item.name.includes(this.monitorFilters.name);
                        const matchPlatform = !this.monitorFilters.platform || item.platform === this.monitorFilters.platform;
                        const matchStatus = !this.monitorFilters.status || item.status === this.monitorFilters.status;
                        return matchName && matchPlatform && matchStatus;
                    });
                },

                get filteredLogs() {
                    return this.logs.filter((item) => {
                        const matchPlatform = !this.logFilters.platform || item.platform === this.logFilters.platform;
                        const matchName = !this.logFilters.name || item.path.includes(this.logFilters.name);
                        const matchStatus = !this.logFilters.status || item.status === this.logFilters.status;
                        return matchPlatform && matchName && matchStatus;
                    });
                },

                get filteredVersions() {
                    return this.versions.filter((item) => !this.versionSearch || item.name.includes(this.versionSearch));
                },

                get currentDebugDevice() {
                    return this.debugDevices.find((item) => item.id === this.debug.deviceId) || this.debugDevices[0];
                },

                openLogDetail(item) {
                    this.logDetail = { open: true, item };
                },

                openVersionModal(item = null) {
                    this.versionModal = { open: true, item };
                    this.versionForm = item ? { ...item } : { name: '', version: '', status: '启用', isDefault: false, remark: '' };
                },

                saveVersion() {
                    if (!this.versionForm.name || !this.versionForm.version) {
                        this.showToast('请先填写接口名称和版本号', 'error');
                        return;
                    }
                    if (this.versionForm.status === '废弃' && this.versionForm.isDefault) {
                        this.showToast('废弃版本不可设为默认版本', 'error');
                        return;
                    }

                    if (this.versionForm.isDefault) {
                        this.versions.forEach((item) => {
                            if (item.name === this.versionForm.name) item.isDefault = false;
                        });
                    }

                    if (this.versionModal.item) {
                        const index = this.versions.findIndex((item) => item.id === this.versionModal.item.id);
                        this.versions.splice(index, 1, { ...this.versionForm, id: this.versionModal.item.id });
                    } else {
                        this.versions.unshift({ ...this.versionForm, id: Date.now() });
                    }

                    this.versionModal.open = false;
                    this.showToast('版本信息已保存');
                },

                sendCommand() {
                    this.debug.status = '成功';
                    this.debug.response = `{\n  "code": 0,\n  "message": "命令已发送",\n  "command": "${this.debug.command}",\n  "duration": "32ms"\n}`;
                    this.debugHistory.unshift({
                        id: Date.now(),
                        time: '2026-03-14 09:30:00',
                        device: this.currentDebugDevice.name,
                        command: this.debug.command,
                        status: '成功',
                        duration: '32ms'
                    });
                    this.showToast('在线调试请求已发送');
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 2200);
                }
            }));
        });
    </script>
</body>
</html>
