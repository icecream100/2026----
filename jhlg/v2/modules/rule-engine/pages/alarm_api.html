<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440">
    <title>规则引擎 - 异常告警二次开发接口</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'] },
                    colors: { brand: '#2f5ee5', navy: '#0b162a' }
                }
            }
        };
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            min-width: 1440px;
        }

        .submenu-item.active {
            background-color: #2f5ee5;
            color: white;
        }
    </style>
</head>

<body class="font-sans text-slate-800 antialiased overflow-hidden h-screen flex flex-col">

    <header
        class="h-[60px] bg-brand text-white flex items-center justify-between px-6 shrink-0 z-50 fixed w-full top-0">
        <div class="flex items-center gap-6">
            <div class="text-[17px] font-medium tracking-wide">物联网管理服务系统</div>
            <button class="text-xl hover:bg-white/10 p-2 rounded transition ml-8"><i
                    class="fa-solid fa-outdent"></i></button>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 cursor-pointer hover:bg-white/10 px-2 py-1 rounded">
                <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-xs"><i
                        class="fa-solid fa-user"></i></div>
                <span class="text-sm">集成开发人员</span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 pt-[60px] h-full">
        <!-- Sidebar -->
        <aside
            class="w-[200px] h-full bg-navy flex-shrink-0 text-slate-300 overflow-y-auto overflow-x-hidden border-r border-[#1a253a]">
            <!-- Nav contents hidden for brevity as it's identical -->
            <nav class="py-2 text-[14px]">
                <div class="menu-item flex items-center justify-between px-5 py-3.5 cursor-pointer text-white">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-code-branch w-4"></i><span>规则引擎</span>
                    </div>
                    <i class="fa-solid fa-caret-up text-[10px]"></i>
                </div>
                <div class="bg-black/20 pb-1">
                    <div class="px-5 py-2 text-xs text-slate-500 font-medium tracking-wider">规则编排</div>
                    <a href="../index.html"
                        class="flex items-center pl-[46px] pr-5 py-2.5 cursor-pointer hover:text-white text-[13px] relative block">
                        <i class="fa-solid fa-list w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>规则编排列表</span>
                    </a>
                    <a href="protocol_api.html"
                        class="flex items-center pl-[46px] pr-5 py-2.5 cursor-pointer hover:text-white text-[13px] relative block">
                        <i class="fa-solid fa-layer-group w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>协议解析二次接口</span>
                    </a>
                    <a href="alarm_api.html"
                        class="submenu-item active flex items-center pl-[46px] pr-5 py-3 cursor-pointer text-[13px] relative block">
                        <i
                            class="fa-solid fa-triangle-exclamation w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>异常告警二开接口</span>
                    </a>
                    <div class="px-5 py-2 text-xs text-slate-500 font-medium tracking-wider mt-1">场景联动</div>
                    <a href="event_level.html"
                        class="flex items-center pl-[46px] pr-5 py-2.5 cursor-pointer hover:text-white text-[13px] relative block">
                        <i class="fa-solid fa-layer-group w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>事件等级管理</span>
                    </a>
                    <a href="event_type.html"
                        class="flex items-center pl-[46px] pr-5 py-2.5 cursor-pointer hover:text-white text-[13px] relative block">
                        <i class="fa-solid fa-tags w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>事件类型管理</span>
                    </a>
                    <a href="event_rule.html"
                        class="flex items-center pl-[46px] pr-5 py-2.5 cursor-pointer hover:text-white text-[13px] relative block">
                        <i class="fa-solid fa-diagram-project w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>事件规则管理</span>
                    </a>
                    <a href="event_notify.html"
                        class="flex items-center pl-[46px] pr-5 py-2.5 cursor-pointer hover:text-white text-[13px] relative block">
                        <i class="fa-solid fa-comment-dots w-4 text-center absolute left-6 text-[12px] opacity-70"></i>
                        <span>事件通知管理</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#f0f2f5]">
            <div class="h-12 flex items-center px-6 bg-white border-b border-slate-200 text-sm text-slate-500 shrink-0">
                <span class="text-slate-800 font-medium">异常告警二次开发接口</span>
            </div>

            <div class="flex-1 overflow-y-auto p-5">
                <!-- Search Panel -->
                <div class="bg-white p-5 rounded shadow-[0_2px_8px_rgba(0,0,0,0.04)] mb-4">
                    <div class="grid grid-cols-4 gap-6">
                        <div class="flex items-center gap-3">
                            <label class="text-[13px] text-slate-600 shrink-0">接口名称</label>
                            <input type="text" class="border border-slate-200 rounded px-3 py-1.5 text-[13px] w-full">
                        </div>
                        <div class="flex items-center gap-3">
                            <label class="text-[13px] text-slate-600 shrink-0">状态</label>
                            <select class="border border-slate-200 rounded px-3 py-1.5 text-[13px] w-full bg-white">
                                <option>全部</option>
                                <option>启用</option>
                                <option>停用</option>
                            </select>
                        </div>
                        <div class="flex justify-end gap-3 w-full col-start-4">
                            <button class="px-4 py-1.5 bg-brand text-white text-[13px] rounded">查询</button>
                        </div>
                    </div>
                </div>

                <!-- Table Panel -->
                <div class="bg-white p-5 rounded shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-[15px] font-bold">接口列表</h2>
                        <button onclick="openModal()" class="px-4 py-1.5 bg-brand text-white text-[13px] rounded"><i
                                class="fa-solid fa-plus text-xs"></i> 新增配置</button>
                    </div>

                    <table class="w-full text-left border-collapse border border-slate-200">
                        <thead>
                            <tr class="bg-slate-50 text-[13px] text-slate-500 border-b border-slate-200">
                                <th class="py-3 px-4 font-medium">接口名称</th>
                                <th class="py-3 px-4 font-medium">适用告警类型</th>
                                <th class="py-3 px-4 font-medium">调用地址</th>
                                <th class="py-3 px-4 font-medium">状态</th>
                                <th class="py-3 px-4 font-medium">最近调用结果</th>
                                <th class="py-3 px-4 font-medium w-[180px]">操作</th>
                            </tr>
                        </thead>
                        <tbody class="text-[13px] text-slate-700">
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="py-3 px-4 text-brand font-medium">消防告警流转系统对接</td>
                                <td class="py-3 px-4"><span
                                        class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded mr-1">火警</span><span
                                        class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">故障</span></td>
                                <td class="py-3 px-4 text-slate-500 font-mono">http://fire-sys:9000/api/hook</td>
                                <td class="py-3 px-4 text-green-600">启用</td>
                                <td class="py-3 px-4 text-green-600">成功</td>
                                <td class="py-3 px-4">
                                    <button class="text-brand mr-3" onclick="alert('TODO:查看说明')">说明</button>
                                    <button class="text-brand mr-3" onclick="openModal()">编辑</button>
                                    <button class="text-red-500" onclick="confirm('确认删除？')">删除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Simple Form Modal -->
    <div id="modal" class="fixed inset-0 bg-black/40 z-[60] hidden flex items-center justify-center">
        <div class="bg-white rounded shadow-xl w-[500px]">
            <div class="p-4 border-b border-slate-100 font-bold flex justify-between">配置告警二开接口<button
                    onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="p-4 space-y-3 test-[13px]">
                <div><label>名称</label><input type="text" class="w-full border rounded p-1 mt-1"></div>
                <div><label>告警类型</label><select multiple class="w-full border rounded p-1 mt-1 bg-white h-16">
                        <option>火警</option>
                        <option>安防越界</option>
                        <option>漏水</option>
                    </select></div>
                <div><label>调用地址</label><input type="text" class="w-full border rounded p-1 mt-1 font-mono text-sm">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1"><label>超时(ms)</label><input type="number" value="3000"
                            class="w-full border rounded p-1 mt-1"></div>
                    <div class="flex-1"><label>重试次数</label><input type="number" value="3"
                            class="w-full border rounded p-1 mt-1"></div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-3"><button class="px-3"
                    onclick="closeModal()">取消</button><button class="px-3 bg-brand text-white rounded"
                    onclick="closeModal()">保存</button></div>
        </div>
    </div>
    <script>
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>

</html>
