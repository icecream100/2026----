    <div id="workflowModal" class="modal-mask hidden fixed inset-0 z-[100] flex items-center justify-center p-8">

                    <option value="特别重大">特别重大</option>

                    <option value="P2">优先级：P2</option>
                    <option value="P3">优先级：P3</option>

                <input id="workflowSla" type="number" min="1" placeholder="处置时效（分钟）"

                <select id="workflowDept"
                    class="rounded border border-slate-300 px-3 py-2 text-[13px] outline-none focus:border-brand hover:border-brand/50 transition bg-white">
                    <option value="">选择责任部门</option>
                    <option value="供配电运维组">供配电运维组</option>
                    <option value="消防安全组">消防安全组</option>
                    <option value="机房保障组">机房保障组</option>
                </select>
                <input id="workflowUser" type="text" placeholder="默认责任人（可选）"

                <select id="workflowCallback"

                    <option value="开">第三方回写：开</option>

                <select id="workflowStatus"
                    class="rounded border border-slate-300 px-3 py-2 text-[13px] outline-none focus:border-brand hover:border-brand/50 transition bg-white">

                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="短信"

                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" value="邮件"

    <script>
        const workflows = [
            { id: 1, name: '主站配电故障-特别重大流程', type: '设备状态告警', level: '特别重大', priority: 'P1', sla: 5, dept: '供配电运维组', user: '刘晓东', third: '供配电工单平台', callback: '开', channels: ['平台消息', '短信', '第三方应用'], status: '启用', remark: '高压故障优先下发' },
            { id: 2, name: '主站配电故障-重大流程', type: '设备状态告警', level: '重大', priority: 'P1', sla: 10, dept: '供配电运维组', user: '陈亮', third: '', callback: '关', channels: ['平台消息', '短信'], status: '启用', remark: '' },
            { id: 3, name: '消防感知-较大流程', type: '感知数据告警', level: '较大', priority: 'P2', sla: 15, dept: '消防安全组', user: '王静', third: '消防联动平台', callback: '开', channels: ['平台消息', '第三方应用'], status: '启用', remark: '' },
            { id: 4, name: '水泵房运行异常流程', type: '设备事件告警', level: '一般', priority: 'P3', sla: 30, dept: '机电保障组', user: '', third: '', callback: '关', channels: ['平台消息'], status: '停用', remark: '' },
            { id: 5, name: '机房环控流程', type: '感知数据告警', level: '重大', priority: 'P2', sla: 20, dept: '机房保障组', user: '李峰', third: '', callback: '关', channels: ['平台消息', '短信'], status: '启用', remark: '' }
        ];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.add('hidden'), 2200);
        }

        function levelBadge(level) {
            const map = {
                '特别重大': 'bg-red-500 text-white',
                '重大': 'bg-orange-500 text-white',
                '较大': 'bg-amber-400 text-white',
                '一般': 'bg-slate-300 text-white'
            };
            return `<span class="rounded-lg px-3 py-1 text-xs font-medium ${map[level] || 'bg-slate-100 text-slate-500'}">${level}</span>`;
        }

        function statusBadge(status) {
            return status === '启用'
                ? '<span class="rounded bg-emerald-50 border border-success/20 px-2 py-0.5 text-xs font-medium text-success">启用</span>'
                : '<span class="rounded bg-slate-50 border border-slate-200 px-2 py-0.5 text-xs font-medium text-slate-500">停用</span>';
        }

        function callbackBadge(value) {
            return value === '开'
                ? '<span class="rounded bg-blue-50 border border-brand/20 px-2 py-0.5 text-xs font-medium text-brand">开启</span>'
                : '<span class="rounded bg-slate-50 border border-slate-200 px-2 py-0.5 text-xs font-medium text-slate-500">关闭</span>';
        }

        function updateSummary() {
            document.getElementById('enabledCount').textContent = workflows.filter((item) => item.status === '启用').length;
            document.getElementById('callbackCount').textContent = workflows.filter((item) => item.callback === '开').length;
        }

        function renderWorkflows() {
            const keyword = document.getElementById('keyword').value.trim();
            const type = document.getElementById('type').value;
            const level = document.getElementById('level').value;
            const status = document.getElementById('status').value;
            const rows = workflows.filter((item) => {
                const hitKeyword = !keyword || item.name.includes(keyword);
                const hitType = !type || item.type === type;
                const hitLevel = !level || item.level === level;
                const hitStatus = !status || item.status === status;
                return hitKeyword && hitType && hitLevel && hitStatus;
            });
            document.getElementById('workflowBody').innerHTML = rows.map((item) => `
                <tr class="hover:bg-slate-50 transition-colors group">
                    <td class="px-4 py-3 font-medium text-slate-800 border-r border-slate-100">${item.name}</td>
                    <td class="px-4 py-3 text-slate-600 border-r border-slate-100">${item.type}</td>
                    <td class="px-4 py-3 border-r border-slate-100">${levelBadge(item.level)}</td>
                    <td class="px-4 py-3 text-slate-600 border-r border-slate-100">${item.priority}</td>
                    <td class="px-4 py-3 text-slate-600 border-r border-slate-100">${item.sla} 分钟</td>
                    <td class="px-4 py-3 border-r border-slate-100">
                        <div class="text-slate-800">${item.dept}</div>
                        <div class="text-[12px] text-slate-400 mt-0.5"><i class="fa-regular fa-user mr-1"></i>${item.user || '未指定'}</div>
                    </td>
                    <td class="px-4 py-3 border-r border-slate-100">${callbackBadge(item.callback)}</td>
                    <td class="px-4 py-3 border-r border-slate-100">${statusBadge(item.status)}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button type="button" onclick="openWorkflowModal(${item.id})" class="text-brand hover:text-brandHover transition">编辑</button>
                            <span class="text-slate-200">|</span>
                            <button type="button" onclick="toggleWorkflow(${item.id})" class="${item.status === '启用' ? 'text-warning hover:text-yellow-600' : 'text-success hover:text-green-600'} transition">${item.status === '启用' ? '停用' : '启用'}</button>
                            <span class="text-slate-200">|</span>
                            <button type="button" onclick="removeWorkflow(${item.id})" class="text-danger hover:text-red-600 transition">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            document.getElementById('totalRowsCount').textContent = rows.length;
            updateSummary();
        }

        function resetFilter() {
            document.getElementById('keyword').value = '';
            document.getElementById('type').value = '';
            document.getElementById('level').value = '';
            document.getElementById('status').value = '';
            renderWorkflows();
        }

        function closeWorkflowModal() {
            document.getElementById('workflowModal').classList.add('hidden');
        }

        function openWorkflowModal(id = null) {
            document.getElementById('workflowModal').classList.remove('hidden');
            document.getElementById('workflowModalTitle').textContent = id ? '编辑工作流' : '新增工作流';
            document.getElementById('editId').value = id || '';
            const current = workflows.find((item) => item.id === id);
            document.getElementById('workflowName').value = current ? current.name : '';
            document.getElementById('workflowType').value = current ? current.type : '';
            document.getElementById('workflowLevel').value = current ? current.level : '';
            document.getElementById('workflowPriority').value = current ? current.priority : 'P1';
            document.getElementById('workflowSla').value = current ? current.sla : '';
            document.getElementById('workflowDept').value = current ? current.dept : '';
            document.getElementById('workflowUser').value = current ? current.user : '';
            document.getElementById('workflowThird').value = current ? current.third : '';
            document.getElementById('workflowCallback').value = current ? current.callback : '关';
            document.getElementById('workflowStatus').value = current ? current.status : '启用';
            document.getElementById('workflowRemark').value = current ? current.remark : '';
            document.querySelectorAll('.channel').forEach((node) => {
                node.checked = current ? current.channels.includes(node.value) : node.value === '平台消息';
            });
        }

        function saveWorkflow() {
            const id = Number(document.getElementById('editId').value || 0);
            const payload = {
                id: id || Date.now(),
                name: document.getElementById('workflowName').value.trim(),
                type: document.getElementById('workflowType').value,
                level: document.getElementById('workflowLevel').value,
                priority: document.getElementById('workflowPriority').value,
                sla: Number(document.getElementById('workflowSla').value),
                dept: document.getElementById('workflowDept').value,
                user: document.getElementById('workflowUser').value.trim(),
                third: document.getElementById('workflowThird').value.trim(),
                callback: document.getElementById('workflowCallback').value,
                status: document.getElementById('workflowStatus').value,
                remark: document.getElementById('workflowRemark').value.trim(),
                channels: Array.from(document.querySelectorAll('.channel:checked')).map((node) => node.value)
            };
            if (!payload.name || !payload.type || !payload.level || !payload.sla || !payload.dept || payload.channels.length === 0) {
                showToast('请补全工作流必填信息');
                return;
            }
            const duplicated = workflows.some((item) =>
                item.id !== payload.id &&
                item.type === payload.type &&
                item.level === payload.level &&
                item.status === '启用' &&
                payload.status === '启用'
            );
            if (duplicated) {
                showToast('同一告警类型 + 级别只允许一条启用中的工作流');
                return;
            }
            const index = workflows.findIndex((item) => item.id === payload.id);
            if (index >= 0) {
                workflows[index] = payload;
                showToast('工作流已更新');
            } else {
                workflows.unshift(payload);
                showToast('工作流已创建');
            }
            closeWorkflowModal();
            renderWorkflows();
        }

        function toggleWorkflow(id) {
            const item = workflows.find((row) => row.id === id);
            if (item.status === '停用') {
                const duplicated = workflows.some((row) => row.id !== id && row.type === item.type && row.level === item.level && row.status === '启用');
                if (duplicated) {
                    showToast('已存在启用中的同类型同级别工作流');
                    return;
                }
            }
            item.status = item.status === '启用' ? '停用' : '启用';
            renderWorkflows();
            showToast(`工作流已${item.status === '启用' ? '启用' : '停用'}`);
        }

        function removeWorkflow(id) {
            const index = workflows.findIndex((item) => item.id === id);
            workflows.splice(index, 1);
            renderWorkflows();
            showToast('工作流已逻辑删除');
        }

        renderWorkflows();
    </script>
</body>

</html>
