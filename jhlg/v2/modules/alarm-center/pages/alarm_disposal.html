    <script>
        const items = [
            { id: 1, ticketNo: 'GD-20260307-001', alarmName: '主站配电-2#H8 故障报警', type: '设备状态告警', level: '特别重大', status: '待分派', dept: '', user: '', workflow: '未匹配', third: '', alarmTime: '2026-03-07 21:45:18', dueTime: '--', logs: ['21:45 告警触发', '21:45 未匹配工作流，自动生成待分派处置单'] },
            { id: 2, ticketNo: 'GD-20260307-002', alarmName: '水泵房水泵运行异常', type: '设备事件告警', level: '一般', status: '待接单', dept: '机电保障组', user: '陈亮', workflow: '水泵房运行异常流程', third: '', alarmTime: '2026-03-07 20:12:08', dueTime: '2026-03-07 20:42:08', logs: ['20:12 告警触发', '20:12 工作流命中', '20:13 已分派至机电保障组 / 陈亮'] },
            { id: 3, ticketNo: 'GD-20260307-003', alarmName: '机房空调温湿度异常', type: '感知数据告警', level: '重大', status: '处理中', dept: '机房保障组', user: '李峰', workflow: '机房环控流程', third: '', alarmTime: '2026-03-07 19:41:20', dueTime: '2026-03-07 20:01:20', logs: ['19:41 告警触发', '19:42 工作流命中', '19:43 李峰已接单'] },
            { id: 4, ticketNo: 'GD-20260307-004', alarmName: '点型光电感烟探测器报警', type: '感知数据告警', level: '较大', status: '已完成', dept: '消防安全组', user: '王静', workflow: '消防感知-较大流程', third: '消防联动平台', alarmTime: '2026-03-07 18:31:54', dueTime: '2026-03-07 18:46:54', logs: ['18:31 告警触发', '18:31 工作流命中', '18:35 已提交处理结果'] },
            { id: 5, ticketNo: 'GD-20260307-005', alarmName: '消防联动通道异常', type: '设备事件告警', level: '重大', status: '已完成', dept: '消防安全组', user: '王静', workflow: '消防联动-重大流程', third: '消防联动平台', alarmTime: '2026-03-07 17:05:22', dueTime: '2026-03-07 17:20:22', logs: ['17:05 告警触发', '17:06 工作流命中', '17:10 处理结果已提交'] },
            { id: 6, ticketNo: 'GD-20260307-006', alarmName: '主站配电-1#H2 故障报警', type: '设备状态告警', level: '重大', status: '已完成', dept: '供配电运维组', user: '刘晓东', workflow: '主站配电故障-重大流程', third: '供配电工单平台', alarmTime: '2026-03-07 16:15:48', dueTime: '2026-03-07 16:25:48', logs: ['16:15 告警触发', '16:16 工作流命中', '16:17 刘晓东接单', '16:22 处置完成'] }
        ];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.add('hidden'), 2200);
        }

        function levelBadge(level) {
            const map = {
                '特别重大': 'bg-red-500 text-white',
                '重大': 'bg-orange-500 text-white',
                '较大': 'bg-amber-400 text-white',
                '一般': 'bg-slate-300 text-white'
            };
            return `<span class="rounded-lg px-3 py-1 text-xs font-medium ${map[level] || 'bg-slate-100 text-slate-500'}">${level}</span>`;
        }

        function statusBadge(status) {
            const map = {
                '待分派': 'bg-amber-50 text-warning',
                '待接单': 'bg-slate-100 text-slate-600',
                '处理中': 'bg-brand/10 text-brand',
                '已完成': 'bg-emerald-50 text-success',
                '已关闭': 'bg-slate-100 text-slate-500'
            };
            return `<span class="rounded-full px-3 py-1 text-xs font-medium ${map[status] || 'bg-slate-100 text-slate-500'}">${status}</span>`;
        }

        function updateSummary() {
            document.getElementById('waitAssignCount').textContent = items.filter((item) => item.status === '待分派').length;
            document.getElementById('waitTakeCount').textContent = items.filter((item) => item.status === '待接单').length;
            document.getElementById('processingCount').textContent = items.filter((item) => item.status === '处理中').length;
        }

        function renderTable() {
            const keyword = document.getElementById('keyword').value.trim();
            const type = document.getElementById('type').value;
            const status = document.getElementById('status').value;
            const rows = items.filter((item) => {
                const hitKeyword = !keyword || item.ticketNo.includes(keyword) || item.alarmName.includes(keyword);
                const hitType = !type || item.type === type;
                const hitStatus = !status || item.status === status;
                return hitKeyword && hitType && hitStatus;
            });
            document.getElementById('tbody').innerHTML = rows.map((item) => `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3 font-medium text-slate-900">${item.ticketNo}</td>
                    <td class="px-4 py-3">
                        <div class="font-medium text-slate-900">${item.alarmName}</div>
                        <div class="mt-0.5 text-xs text-slate-400">${item.alarmTime}</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">${item.type}</td>
                    <td class="px-4 py-3">${levelBadge(item.level)}</td>
                    <td class="px-4 py-3">${statusBadge(item.status)}</td>
                    <td class="px-4 py-3 text-slate-600">${item.dept || '--'}<br><span class="text-slate-400">${item.user || '待分派'}</span></td>
                    <td class="px-4 py-3 ${item.workflow === '未匹配' ? 'text-warning' : 'text-slate-600'}">${item.workflow}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                            ${actionButtons(item)}
                            <button type="button" onclick="openDrawer(${item.id})" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-brand hover:border-brand transition shadow-sm">详情</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            updateSummary();
        }

        function actionButtons(item) {
            if (item.status === '待分派') {
                return `<button type="button" onclick="openAssign(${item.id}, false)" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-brand hover:border-brand transition shadow-sm">分派</button>`;
            }
            if (item.status === '待接单') {
                return `
                    <button type="button" onclick="takeOrder(${item.id})" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-brand hover:border-brand transition shadow-sm">接单</button>
                    <button type="button" onclick="openAssign(${item.id}, true)" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-brand hover:border-brand transition shadow-sm">转派</button>
                `;
            }
            if (item.status === '处理中') {
                return `
                    <button type="button" onclick="openHandle(${item.id})" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-brand hover:border-brand transition shadow-sm">处理</button>
                    <button type="button" onclick="openAssign(${item.id}, true)" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-brand hover:border-brand transition shadow-sm">转派</button>
                    <button type="button" onclick="openClose(${item.id})" class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-600 hover:text-red-500 hover:border-red-500 transition shadow-sm">关闭</button>
                `;
            }
            return '';
        }

        function resetFilter() {
            document.getElementById('keyword').value = '';
            document.getElementById('type').value = '';
            document.getElementById('status').value = '';
            renderTable();
        }

        function getItem(id) {
            return items.find((item) => item.id === id);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function openAssign(id, transfer) {
            const item = getItem(id);
            document.getElementById('assignId').value = id;
            document.getElementById('assignDept').value = item.dept || '';
            document.getElementById('assignUser').value = item.user || '';
            document.getElementById('assignReason').value = '';
            document.getElementById('assignTitle').textContent = transfer ? '转派处置单' : '分派处置单';
            document.getElementById('assignModal').classList.remove('hidden');
        }

        function saveAssign() {
            const item = getItem(Number(document.getElementById('assignId').value));
            const dept = document.getElementById('assignDept').value;
            const user = document.getElementById('assignUser').value.trim();
            const reason = document.getElementById('assignReason').value.trim();
            if (!dept || !user) {
                showToast('请填写责任部门和责任人');
                return;
            }
            const transfer = item.status !== '待分派';
            item.dept = dept;
            item.user = user;
            item.status = '待接单';
            item.logs.push(`${new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 5)} ${transfer ? '已转派' : '已分派'}至 ${dept} / ${user}${reason ? '：' + reason : ''}`);
            closeModal('assignModal');
            renderTable();
            showToast(transfer ? '处置单已转派' : '处置单已分派');
        }

        function takeOrder(id) {
            const item = getItem(id);
            item.status = '处理中';
            item.logs.push(`${new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 5)} ${item.user || '当前责任人'}已接单`);
            renderTable();
            showToast('已接单，状态更新为处理中');
        }

        function openHandle(id) {
            document.getElementById('handleId').value = id;
            document.getElementById('handleResult').value = '已恢复';
            document.getElementById('handleDesc').value = '';
            document.getElementById('handleModal').classList.remove('hidden');
        }

        function submitHandle() {
            const item = getItem(Number(document.getElementById('handleId').value));
            const result = document.getElementById('handleResult').value;
            const desc = document.getElementById('handleDesc').value.trim();
            if (!desc) {
                showToast('请填写处理说明');
                return;
            }
            item.logs.push(`${new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 5)} 已提交处理结果：${result}，${desc}`);
            item.status = '已完成';
            closeModal('handleModal');
            renderTable();
            showToast('已完成处置');
        }

        function openClose(id) {
            document.getElementById('closeId').value = id;
            document.getElementById('closeReason').value = '';
            document.getElementById('closeModal').classList.remove('hidden');
        }

        function submitClose() {
            const item = getItem(Number(document.getElementById('closeId').value));
            const reason = document.getElementById('closeReason').value.trim();
            if (!reason) {
                showToast('请填写关闭原因');
                return;
            }
            item.status = '已关闭';
            item.logs.push(`${new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 5)} 处置单已关闭：${reason}`);
            closeModal('closeModal');
            renderTable();
            showToast('处置单已关闭');
        }

        function openDrawer(id) {
            const item = getItem(id);
            document.getElementById('drawerTicket').textContent = item.ticketNo;
            document.getElementById('drawerContent').innerHTML = `
                <div class="rounded-[22px] bg-slate-50 p-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div><div class="text-slate-400">告警名称</div><div class="mt-1 text-slate-900">${item.alarmName}</div></div>
                        <div><div class="text-slate-400">处置状态</div><div class="mt-1">${statusBadge(item.status)}</div></div>
                        <div><div class="text-slate-400">告警类型</div><div class="mt-1 text-slate-900">${item.type}</div></div>
                        <div><div class="text-slate-400">告警级别</div><div class="mt-1">${levelBadge(item.level)}</div></div>
                        <div><div class="text-slate-400">责任部门 / 人</div><div class="mt-1 text-slate-900">${item.dept || '--'} / ${item.user || '--'}</div></div>
                    </div>
                </div>
                <div class="rounded-[22px] border border-line p-4">
                    <div class="text-sm text-slate-400">工作流信息</div>
                    <div class="mt-2 text-slate-900">${item.workflow}</div>
                    <div class="mt-2 text-sm text-slate-500">${item.workflow === '未匹配' ? '未命中工作流，自动生成待分派处置单。' : '第三方应用：' + (item.third || '无')}</div>
                </div>
                <div class="rounded-[22px] border border-line p-4">
                    <div class="text-sm text-slate-400">处置过程</div>
                    <div class="mt-3 space-y-2">
                        ${item.logs.map((log) => `<div class="rounded-xl bg-slate-50 px-3 py-3 text-slate-600">${log}</div>`).join('')}
                    </div>
                </div>
            `;
            document.getElementById('drawerWrap').classList.remove('hidden');
        }

        function closeDrawer() {
            document.getElementById('drawerWrap').classList.add('hidden');
        }

        renderTable();
    </script>
</body>

</html>
