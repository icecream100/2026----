<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增征集 - 雄安二期</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <span class="app-name">雄安二期首页重构</span>
    <div class="spacer"></div>
    <div class="flex items-center gap-2" style="color:rgba(255,255,255,0.85);">
      <div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">管</div>
      <span style="font-size:13px;">管理员</span>
    </div>
  </header>

  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">内容管理</div>
      <div class="menu-item active" onclick="location.href='list.html'"><i class="fa-solid fa-comments"></i>意见征集</div>
      <div class="menu-item" onclick="location.href='../admin-topic/list.html'"><i class="fa-solid fa-layer-group"></i>专题专栏</div>
      <div class="menu-item" onclick="location.href='../admin-department/list.html'"><i class="fa-solid fa-building"></i>处室维护</div>
      <div class="menu-item" onclick="location.href='../admin-file/list.html'"><i class="fa-solid fa-folder-open"></i>文件管理</div>
    </aside>

    <main class="main">
      <div class="breadcrumb">
        <a href="../index.html">首页</a><span>/</span>
        <a href="list.html">意见征集管理</a><span>/</span>
        <span class="current">新增征集</span>
      </div>
      <div class="page-title">新增征集</div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body">
          <!-- 基本信息 -->
          <div class="form-section">
            <h4>基本信息</h4>
            <div class="ant-form-item">
              <label class="ant-form-label ant-form-label-required">征集标题</label>
              <input id="formTitle" class="ant-input" maxlength="100" placeholder="请输入征集标题">
            </div>
            <div class="ant-form-item">
              <label class="ant-form-label ant-form-label-required">征集类型</label>
              <div class="ant-radio-group">
                <label class="ant-radio">
                  <input type="radio" name="formType" value="form" checked onchange="toggleType()">
                  <span>表单反馈</span>
                </label>
                <label class="ant-radio">
                  <input type="radio" name="formType" value="survey" onchange="toggleType()">
                  <span>问卷投票</span>
                </label>
              </div>
            </div>
            <div class="ant-form-item">
              <label class="ant-form-label ant-form-label-required">征集说明</label>
              <textarea id="formDesc" class="ant-input" rows="4" placeholder="请说明征集目的、背景等"></textarea>
            </div>
          </div>

          <div class="divider"></div>

          <!-- 时间设置 -->
          <div class="form-section">
            <h4>时间设置</h4>
            <div class="flex gap-6">
              <div class="ant-form-item" style="flex:1">
                <label class="ant-form-label ant-form-label-required">开始时间</label>
                <input id="formStart" type="datetime-local" class="ant-input">
              </div>
              <div class="ant-form-item" style="flex:1">
                <label class="ant-form-label ant-form-label-required">结束时间</label>
                <input id="formEnd" type="datetime-local" class="ant-input">
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <!-- 附件 -->
          <div class="form-section">
            <h4>附件</h4>
            <div class="ant-form-item">
              <label class="ant-form-label">附件上传</label>
              <div style="border:1px dashed var(--ant-border);border-radius:8px;padding:24px;text-align:center;">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size:32px;color:var(--ant-primary);margin-bottom:8px;"></i>
                <p class="text-sm text-secondary mb-2">点击或拖拽文件到此处上传</p>
                <p class="text-xs text-tertiary">支持任意格式，单文件最大 20MB</p>
                <button class="ant-btn ant-btn-sm mt-3" onclick="showToast('请选择文件')">选择文件</button>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <!-- 问卷选项（仅问卷投票显示） -->
          <div class="form-section" id="optionSection" style="display:none">
            <h4>问卷选项</h4>
            <div id="optionList">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-sm text-secondary" style="width:24px">1</span>
                <input class="ant-input" style="flex:1" placeholder="选项名称（必填）" maxlength="50">
                <input class="ant-input" style="width:200px" placeholder="选项说明（选填）" maxlength="200">
                <button class="ant-btn ant-btn-text ant-btn-dangerous ant-btn-sm" onclick="removeOption(this)"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="flex items-center gap-2 mb-3">
                <span class="text-sm text-secondary" style="width:24px">2</span>
                <input class="ant-input" style="flex:1" placeholder="选项名称（必填）" maxlength="50">
                <input class="ant-input" style="width:200px" placeholder="选项说明（选填）" maxlength="200">
                <button class="ant-btn ant-btn-text ant-btn-dangerous ant-btn-sm" onclick="removeOption(this)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <button class="ant-btn ant-btn-dashed" onclick="addOption()" style="width:100%">
              <i class="fa-solid fa-plus"></i> 添加选项
            </button>
          </div>

          <!-- 操作按钮 -->
          <div class="flex justify-end gap-2 mt-6">
            <button class="ant-btn" onclick="location.href='list.html'">取消</button>
            <button class="ant-btn ant-btn-primary" onclick="submitForm()">提交</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
function toggleType() {
  var val = document.querySelector('input[name="formType"]:checked').value;
  document.getElementById('optionSection').style.display = val === 'survey' ? '' : 'none';
}

var optionCount = 2;
function addOption() {
  if (optionCount >= 20) { showToast('最多 20 个选项'); return; }
  optionCount++;
  var div = document.createElement('div');
  div.className = 'flex items-center gap-2 mb-3';
  div.innerHTML = '<span class="text-sm text-secondary" style="width:24px">' + optionCount + '</span>'
    + '<input class="ant-input" style="flex:1" placeholder="选项名称（必填）" maxlength="50">'
    + '<input class="ant-input" style="width:200px" placeholder="选项说明（选填）" maxlength="200">'
    + '<button class="ant-btn ant-btn-text ant-btn-dangerous ant-btn-sm" onclick="removeOption(this)"><i class="fa-solid fa-xmark"></i></button>';
  document.getElementById('optionList').appendChild(div);
}

function removeOption(btn) {
  var items = document.getElementById('optionList').children;
  if (items.length <= 2) { showToast('至少保留 2 个选项'); return; }
  btn.parentElement.remove();
  optionCount = 0;
  Array.from(document.getElementById('optionList').children).forEach(function(el) {
    optionCount++;
    el.querySelector('span').textContent = optionCount;
  });
}

function submitForm() {
  var title = document.getElementById('formTitle').value.trim();
  var desc = document.getElementById('formDesc').value.trim();
  if (!title) { showToast('请输入征集标题'); return; }
  if (!desc) { showToast('请输入征集说明'); return; }
  var start = document.getElementById('formStart').value;
  var end = document.getElementById('formEnd').value;
  if (!start || !end) { showToast('请设置起止时间'); return; }
  if (start >= end) { showToast('结束时间必须晚于开始时间'); return; }
  var type = document.querySelector('input[name="formType"]:checked').value;
  if (type === 'survey') {
    var opts = document.querySelectorAll('#optionList input[placeholder*="选项名称"]');
    var empty = false;
    opts.forEach(function(inp) { if (!inp.value.trim()) empty = true; });
    if (empty) { showToast('请填写所有选项名称'); return; }
  }
  showToast('征集已创建');
  setTimeout(function() { location.href = 'list.html'; }, 1000);
}

function showToast(msg, duration) {
  duration = duration || 2000;
  var wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>' + msg;
  wrap.appendChild(el);
  requestAnimationFrame(function() { el.classList.add('show'); });
  setTimeout(function() { el.classList.remove('show'); setTimeout(function() { el.remove(); }, 300); }, duration);
}
</script>
</body>
</html>
