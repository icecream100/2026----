<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意见征集管理 - 雄安二期</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <span class="app-name">雄安二期首页重构</span>
    <div class="spacer"></div>
    <span class="nav-action"><i class="fa-regular fa-bell mr-1"></i>3</span>
    <div class="flex items-center gap-2" style="color:rgba(255,255,255,0.85);">
      <div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">管</div>
      <span style="font-size:13px;">管理员</span>
    </div>
  </header>

  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">内容管理</div>
      <div class="menu-item active" onclick="location.href='list.html'"><i class="fa-solid fa-comments"></i>意见征集</div>
      <div class="menu-item" onclick="location.href='../admin-topic/list.html'"><i class="fa-solid fa-layer-group"></i>专题专栏</div>
      <div class="menu-item" onclick="location.href='../admin-department/list.html'"><i class="fa-solid fa-building"></i>处室维护</div>
      <div class="menu-item" onclick="location.href='../admin-file/list.html'"><i class="fa-solid fa-folder-open"></i>文件管理</div>
    </aside>

    <main class="main">
      <div class="breadcrumb">
        <a href="../index.html">首页</a><span>/</span><span class="current">意见征集管理</span>
      </div>
      <div class="page-title">意见征集管理</div>

      <!-- 搜索栏 -->
      <div class="ant-card ant-card-bordered mb-4">
        <div class="ant-card-body">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex items-center gap-2">
              <label class="text-sm text-secondary">征集标题</label>
              <input id="searchTitle" class="ant-input" style="width:200px" placeholder="请输入征集标题"
                     onkeydown="if(event.key==='Enter')handleSearch()">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-secondary">状态</label>
              <select id="searchStatus" class="ant-select" style="width:150px">
                <option value="">全部</option>
                <option value="未开始">未开始</option>
                <option value="进行中">进行中</option>
                <option value="已结束">已结束</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button class="ant-btn ant-btn-primary" onclick="handleSearch()">
                <i class="fa-solid fa-search"></i> 查询
              </button>
              <button class="ant-btn" onclick="handleReset()">
                <i class="fa-solid fa-rotate-right"></i> 重置
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 工具栏 -->
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm text-secondary">共 <span id="totalCount">3</span> 条</span>
        <button class="ant-btn ant-btn-primary" onclick="location.href='create.html'">
          <i class="fa-solid fa-plus"></i> 新增征集
        </button>
      </div>

      <!-- 表格 -->
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding:0">
          <table class="ant-table">
            <thead>
              <tr>
                <th width="60">序号</th>
                <th>征集标题</th>
                <th width="90">状态</th>
                <th width="90">反馈数量</th>
                <th width="300">起止时间</th>
                <th width="160">创建时间</th>
                <th width="220">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 分页 -->
      <div class="flex items-center justify-between mt-4">
        <span class="text-sm text-secondary" id="paginationInfo">共 3 条</span>
        <div class="ant-pagination">
          <button class="ant-pagination-item"><i class="fa-solid fa-chevron-left" style="font-size:12px"></i></button>
          <button class="ant-pagination-item ant-pagination-item-active">1</button>
          <button class="ant-pagination-item"><i class="fa-solid fa-chevron-right" style="font-size:12px"></i></button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="ant-modal-mask" id="deleteModalMask">
  <div class="ant-modal" id="deleteModal" style="width:400px">
    <div class="ant-modal-header">
      <span><i class="fa-solid fa-circle-exclamation" style="color:var(--ant-warning);margin-right:8px"></i>确认删除</span>
      <span class="ant-modal-close" onclick="closeModal('deleteModal')"><i class="fa-solid fa-xmark"></i></span>
    </div>
    <div class="ant-modal-body">
      <p id="deleteText">确定要删除该征集吗？删除后无法恢复。</p>
    </div>
    <div class="ant-modal-footer">
      <button class="ant-btn" onclick="closeModal('deleteModal')">取消</button>
      <button class="ant-btn ant-btn-dangerous" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<script>
const statusTagClass = { '未开始': 'ant-tag-gray', '进行中': 'ant-tag-green', '已结束': 'ant-tag-red' };

const tableData = [
  { id: 2, title: '雄安新区公共交通优化建议征集', status: '进行中', count: 89, startTime: '2026-06-15 00:00', endTime: '2026-07-15 23:59', createTime: '2026-06-10 14:20' },
  { id: 4, title: '新区绿化方案公众意见征集', status: '未开始', count: 0, startTime: '2026-07-01 00:00', endTime: '2026-07-31 23:59', createTime: '2026-06-20 16:45' },
  { id: 6, title: '政务大厅服务窗口满意度反馈', status: '已结束', count: 342, startTime: '2026-04-01 00:00', endTime: '2026-04-30 23:59', createTime: '2026-03-28 08:15' }
];

function getSearchValues() {
  return {
    title: document.getElementById('searchTitle').value.trim(),
    status: document.getElementById('searchStatus').value
  };
}

function renderTable(filters) {
  filters = filters || {};
  const body = document.getElementById('tableBody');
  const rows = tableData.filter(function(item) {
    return (!filters.title || item.title.indexOf(filters.title) >= 0)
        && (!filters.status || item.status === filters.status);
  });
  body.innerHTML = rows.map(function(item, i) {
    return '<tr>'
      + '<td>' + (i + 1) + '</td>'
      + '<td><a href="feedback.html?id=' + item.id + '" style="color:var(--ant-primary)">' + item.title + '</a></td>'
      + '<td><span class="ant-tag ' + (statusTagClass[item.status] || 'ant-tag-gray') + '">' + item.status + '</span></td>'
      + '<td>' + item.count + '</td>'
      + '<td>' + item.startTime + ' ~ ' + item.endTime + '</td>'
      + '<td>' + item.createTime + '</td>'
      + '<td>'
        + '<button class="ant-btn ant-btn-text ant-btn-sm" onclick="location.href=\'edit.html?id=' + item.id + '\'">编辑</button>'
        + '<button class="ant-btn ant-btn-text ant-btn-sm" onclick="location.href=\'feedback.html?id=' + item.id + '\'">查看反馈</button>'
        + '<button class="ant-btn ant-btn-text ant-btn-dangerous ant-btn-sm" onclick="handleDelete(' + item.id + ')">删除</button>'
      + '</td>'
      + '</tr>';
  }).join('');
  document.getElementById('totalCount').textContent = rows.length;
  document.getElementById('paginationInfo').textContent = '共 ' + rows.length + ' 条';
}

function handleSearch() { renderTable(getSearchValues()); }
function handleReset() {
  document.getElementById('searchTitle').value = '';
  document.getElementById('searchStatus').value = '';
  renderTable({});
}

var deletingId = null;
function handleDelete(id) {
  deletingId = id;
  var item = tableData.find(function(d) { return d.id === id; });
  if (item && item.count > 0) {
    document.getElementById('deleteText').textContent = '该征集已有 ' + item.count + ' 条反馈，不可删除。';
    document.getElementById('deleteModal').querySelector('.ant-btn-dangerous').style.display = 'none';
  } else {
    document.getElementById('deleteText').textContent = '确定要删除该征集吗？删除后无法恢复。';
    document.getElementById('deleteModal').querySelector('.ant-btn-dangerous').style.display = '';
  }
  openModal('deleteModal');
}
function confirmDelete() {
  showToast('已删除');
  closeModal('deleteModal');
}

renderTable({});

function showToast(msg, duration) {
  duration = duration || 2000;
  var wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>' + msg;
  wrap.appendChild(el);
  requestAnimationFrame(function() { el.classList.add('show'); });
  setTimeout(function() { el.classList.remove('show'); setTimeout(function() { el.remove(); }, 300); }, duration);
}
function openModal(id) {
  var modal = document.getElementById(id);
  var mask = document.getElementById(id + 'Mask');
  if (modal) modal.classList.add('active');
  if (mask) mask.classList.add('active');
}
function closeModal(id) {
  var modal = document.getElementById(id);
  var mask = document.getElementById(id + 'Mask');
  if (modal) modal.classList.remove('active');
  if (mask) mask.classList.remove('active');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.ant-modal.active').forEach(function(m) { m.classList.remove('active'); });
    document.querySelectorAll('.ant-modal-mask.active').forEach(function(m) { m.classList.remove('active'); });
  }
});
document.getElementById('deleteModalMask').addEventListener('click', function(e) {
  if (e.target === this) closeModal('deleteModal');
});
</script>
</body>
</html>
