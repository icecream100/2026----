<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>征集反馈详情 - 雄安二期</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <span class="app-name">雄安二期首页重构</span>
    <div class="spacer"></div>
    <div class="flex items-center gap-2" style="color:rgba(255,255,255,0.85);">
      <div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">管</div>
      <span style="font-size:13px;">管理员</span>
    </div>
  </header>

  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">内容管理</div>
      <div class="menu-item active" onclick="location.href='list.html'"><i class="fa-solid fa-comments"></i>意见征集</div>
      <div class="menu-item" onclick="location.href='../admin-topic/list.html'"><i class="fa-solid fa-layer-group"></i>专题专栏</div>
      <div class="menu-item" onclick="location.href='../admin-department/list.html'"><i class="fa-solid fa-building"></i>处室维护</div>
      <div class="menu-item" onclick="location.href='../admin-file/list.html'"><i class="fa-solid fa-folder-open"></i>文件管理</div>
    </aside>

    <main class="main">
      <div class="breadcrumb">
        <a href="../index.html">首页</a><span>/</span>
        <a href="list.html">意见征集管理</a><span>/</span>
        <span class="current">征集反馈详情</span>
      </div>
      <div class="page-title">征集反馈详情</div>

      <!-- 征集基本信息 -->
      <div class="ant-card ant-card-bordered mb-4">
        <div class="ant-card-body">
          <div class="grid grid-cols-3 gap-4" id="basicInfo">
            <!-- 动态生成 -->
          </div>
        </div>
      </div>

      <!-- 筛选条件 -->
      <div class="ant-card ant-card-bordered mb-4">
        <div class="ant-card-body">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex items-center gap-2">
              <label class="text-sm text-secondary">反馈人</label>
              <input id="searchUser" class="ant-input" style="width:150px" placeholder="请输入反馈人"
                     onkeydown="if(event.key==='Enter')handleSearch()">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-secondary">提交时间</label>
              <input id="searchDate" type="date" class="ant-input" style="width:150px">
            </div>
            <div class="flex gap-2">
              <button class="ant-btn ant-btn-primary" onclick="handleSearch()">
                <i class="fa-solid fa-search"></i> 查询
              </button>
              <button class="ant-btn" onclick="handleReset()">
                <i class="fa-solid fa-rotate-right"></i> 重置
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 反馈明细 -->
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-head">
          <span class="ant-card-head-title">反馈明细</span>
          <button class="ant-btn ant-btn-sm" onclick="showToast('导出成功')"><i class="fa-solid fa-download"></i> 导出 Excel</button>
        </div>
        <div class="ant-card-body" style="padding:0">
          <table class="ant-table">
            <thead>
              <tr>
                <th width="60">序号</th>
                <th width="80">反馈人</th>
                <th width="150">反馈标题</th>
                <th>反馈内容</th>
                <th width="160">提交时间</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 分页 -->
      <div class="flex items-center justify-between mt-4">
        <span class="text-sm text-secondary" id="paginationInfo">共 0 条</span>
        <div class="ant-pagination">
          <button class="ant-pagination-item"><i class="fa-solid fa-chevron-left" style="font-size:12px"></i></button>
          <button class="ant-pagination-item ant-pagination-item-active">1</button>
          <button class="ant-pagination-item"><i class="fa-solid fa-chevron-right" style="font-size:12px"></i></button>
        </div>
      </div>

      <div class="flex justify-end mt-4">
        <button class="ant-btn" onclick="location.href='list.html'"><i class="fa-solid fa-arrow-left"></i> 返回列表</button>
      </div>
    </main>
  </div>
</div>

<script>
// 模拟数据 - 根据URL参数获取征集信息
const urlParams = new URLSearchParams(window.location.search);
const collectionId = parseInt(urlParams.get('id')) || 1;

// 征集基本信息
const collections = {
  2: { id: 2, title: '雄安新区公共交通优化建议征集', status: '进行中', count: 89, startTime: '2026-06-15 00:00', endTime: '2026-07-15 23:59' },
  4: { id: 4, title: '新区绿化方案公众意见征集', status: '未开始', count: 0, startTime: '2026-07-01 00:00', endTime: '2026-07-31 23:59' },
  6: { id: 6, title: '政务大厅服务窗口满意度反馈', status: '已结束', count: 342, startTime: '2026-04-01 00:00', endTime: '2026-04-30 23:59' }
};

const currentCollection = collections[collectionId] || collections[2];

// 表单反馈数据
const feedbackDetails = [
  { id: 1, user: '张三', title: '建议增加公交线路', content: '目前从雄安站到市民中心没有直达公交，需要换乘2次，建议增加一条直达线路，方便市民出行。', time: '2026-06-25 14:30:22' },
  { id: 2, user: '李四', title: '优化公交站点设置', content: '很多公交站点距离居民区较远，建议在小区门口增设站点，特别是老年人较多的社区。', time: '2026-06-25 11:42:55' },
  { id: 3, user: '匿名', title: '公交准点率问题', content: '公交车经常不准时，有时候等30分钟都不来一趟，建议优化调度系统，提高准点率。', time: '2026-06-25 10:20:33' },
  { id: 4, user: '王五', title: '夜间公交服务', content: '建议延长公交运营时间，特别是连接高铁站的线路，方便晚间到达的旅客。', time: '2026-06-24 16:55:12' },
  { id: 5, user: '赵六', title: '公交WiFi覆盖', content: '建议在公交车上提供免费WiFi服务，提升乘客体验。', time: '2026-06-24 09:15:45' }
];

// 渲染基本信息
function renderBasicInfo() {
  const statusTagClass = { '未开始': 'ant-tag-gray', '进行中': 'ant-tag-green', '已结束': 'ant-tag-red' };

  document.getElementById('basicInfo').innerHTML =
    '<div>'
      + '<div class="text-xs text-tertiary">征集标题</div>'
      + '<div class="text-sm font-medium mt-1">' + currentCollection.title + '</div>'
    + '</div>'
    + '<div>'
      + '<div class="text-xs text-tertiary">状态</div>'
      + '<div class="mt-1"><span class="ant-tag ' + statusTagClass[currentCollection.status] + '">' + currentCollection.status + '</span></div>'
    + '</div>'
    + '<div>'
      + '<div class="text-xs text-tertiary">反馈总数</div>'
      + '<div class="text-lg font-semibold mt-1" style="color:var(--ant-primary)">' + currentCollection.count.toLocaleString() + '</div>'
    + '</div>';
}

// 渲染表格
function renderTable(filters) {
  filters = filters || {};

  let rows = feedbackDetails;
  if (filters.user) {
    rows = rows.filter(function(r) { return r.user.indexOf(filters.user) >= 0; });
  }
  if (filters.date) {
    rows = rows.filter(function(r) { return r.time.indexOf(filters.date) >= 0; });
  }

  document.getElementById('tableBody').innerHTML = rows.map(function(item, i) {
    return '<tr>'
      + '<td>' + (i + 1) + '</td>'
      + '<td>' + item.user + '</td>'
      + '<td><span class="text-sm font-medium">' + item.title + '</span></td>'
      + '<td><div class="text-sm text-secondary" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + item.content + '">' + item.content + '</div></td>'
      + '<td>' + item.time + '</td>'
      + '</tr>';
  }).join('');
  document.getElementById('paginationInfo').textContent = '共 ' + rows.length + ' 条';
}

function handleSearch() {
  const filters = {
    user: document.getElementById('searchUser').value.trim(),
    date: document.getElementById('searchDate').value
  };
  renderTable(filters);
}

function handleReset() {
  document.getElementById('searchUser').value = '';
  document.getElementById('searchDate').value = '';
  renderTable({});
}

// 初始化
renderBasicInfo();
renderTable({});

function showToast(msg, duration) {
  duration = duration || 2000;
  var wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>' + msg;
  wrap.appendChild(el);
  requestAnimationFrame(function() { el.classList.add('show'); });
  setTimeout(function() { el.classList.remove('show'); setTimeout(function() { el.remove(); }, 300); }, duration);
}
</script>
</body>
</html>
