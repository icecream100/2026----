<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专题专栏管理 - 雄安二期</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <span class="app-name">雄安二期首页重构</span>
    <div class="spacer"></div>
    <span class="nav-action"><i class="fa-regular fa-bell mr-1"></i>3</span>
    <div class="flex items-center gap-2" style="color:rgba(255,255,255,0.85);">
      <div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">管</div>
      <span style="font-size:13px;">管理员</span>
    </div>
  </header>

  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">内容管理</div>
      <div class="menu-item" onclick="location.href='../admin-opinion/list.html'"><i class="fa-solid fa-comments"></i>意见征集</div>
      <div class="menu-item active" onclick="location.href='list.html'"><i class="fa-solid fa-layer-group"></i>专题专栏</div>
      <div class="menu-item" onclick="location.href='../admin-department/list.html'"><i class="fa-solid fa-building"></i>处室维护</div>
      <div class="menu-item" onclick="location.href='../admin-file/list.html'"><i class="fa-solid fa-folder-open"></i>文件管理</div>
    </aside>

    <main class="main">
      <div class="breadcrumb">
        <a href="../index.html">首页</a><span>/</span><span class="current">专题专栏管理</span>
      </div>
      <div class="page-title">专题专栏管理</div>

      <!-- 搜索栏 -->
      <div class="ant-card ant-card-bordered mb-4">
        <div class="ant-card-body">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="flex items-center gap-2">
              <label class="text-sm text-secondary">专题名称</label>
              <input id="searchName" class="ant-input" style="width:200px" placeholder="请输入专题名称"
                     onkeydown="if(event.key==='Enter')handleSearch()">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-secondary">状态</label>
              <select id="searchStatus" class="ant-select" style="width:150px">
                <option value="">全部</option>
                <option value="启用">启用</option>
                <option value="停用">停用</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button class="ant-btn ant-btn-primary" onclick="handleSearch()"><i class="fa-solid fa-search"></i> 查询</button>
              <button class="ant-btn" onclick="handleReset()"><i class="fa-solid fa-rotate-right"></i> 重置</button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between mb-4">
        <span class="text-sm text-secondary">共 <span id="totalCount">5</span> 条</span>
        <button class="ant-btn ant-btn-primary" onclick="location.href='create.html'"><i class="fa-solid fa-plus"></i> 新增专题</button>
      </div>

      <!-- 表格 -->
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding:0">
          <table class="ant-table">
            <thead>
              <tr>
                <th width="60">序号</th>
                <th>专题名称</th>
                <th width="80">图标</th>
                <th width="120">关联信息公开数</th>
                <th width="80">状态</th>
                <th width="80">排序号</th>
                <th width="160">创建时间</th>
                <th width="200">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="flex items-center justify-between mt-4">
        <span class="text-sm text-secondary" id="paginationInfo">共 5 条</span>
        <div class="ant-pagination">
          <button class="ant-pagination-item"><i class="fa-solid fa-chevron-left" style="font-size:12px"></i></button>
          <button class="ant-pagination-item ant-pagination-item-active">1</button>
          <button class="ant-pagination-item"><i class="fa-solid fa-chevron-right" style="font-size:12px"></i></button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="ant-modal-mask" id="deleteModalMask">
  <div class="ant-modal" id="deleteModal" style="width:400px">
    <div class="ant-modal-header">
      <span><i class="fa-solid fa-circle-exclamation" style="color:var(--ant-warning);margin-right:8px"></i>确认删除</span>
      <span class="ant-modal-close" onclick="closeModal('deleteModal')"><i class="fa-solid fa-xmark"></i></span>
    </div>
    <div class="ant-modal-body">
      <p id="deleteText">确定要删除该专题吗？</p>
    </div>
    <div class="ant-modal-footer">
      <button class="ant-btn" onclick="closeModal('deleteModal')">取消</button>
      <button class="ant-btn ant-btn-dangerous" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<script>
const tableData = [
  { id: 1, name: '雄安新区建设成就', icon: 'fa-trophy', status: '启用', sortOrder: 100, createTime: '2026-05-10 09:00' },
  { id: 2, name: '民生保障政策专题', icon: 'fa-heart', status: '启用', sortOrder: 90, createTime: '2026-05-15 14:30' },
  { id: 3, name: '营商环境优化', icon: 'fa-briefcase', status: '启用', sortOrder: 80, createTime: '2026-06-01 10:00' },
  { id: 4, name: '生态环境保护', icon: 'fa-leaf', status: '停用', sortOrder: 70, createTime: '2026-06-05 16:20' },
  { id: 5, name: '智慧城市建设', icon: 'fa-city', status: '启用', sortOrder: 60, createTime: '2026-06-20 11:45' }
];

function getSearchValues() {
  return { name: document.getElementById('searchName').value.trim(), status: document.getElementById('searchStatus').value };
}

function renderTable(filters) {
  filters = filters || {};
  const body = document.getElementById('tableBody');
  const rows = tableData.filter(function(item) {
    return (!filters.name || item.name.indexOf(filters.name) >= 0) && (!filters.status || item.status === filters.status);
  });
  body.innerHTML = rows.map(function(item, i) {
    var relCount = (relationData[item.id] || []).length;
    return '<tr>'
      + '<td>' + (i + 1) + '</td>'
      + '<td>' + item.name + '</td>'
      + '<td><i class="fa-solid ' + item.icon + '" style="color:var(--ant-primary);font-size:18px;"></i></td>'
      + '<td>' + relCount + '</td>'
      + '<td><span class="ant-tag ' + (item.status === '启用' ? 'ant-tag-green' : 'ant-tag-gray') + '">' + item.status + '</span></td>'
      + '<td>' + item.sortOrder + '</td>'
      + '<td>' + item.createTime + '</td>'
      + '<td>'
        + '<button class="ant-btn ant-btn-text ant-btn-sm" onclick="location.href=\'create.html?edit=' + item.id + '\'">编辑</button>'
        + '<button class="ant-btn ant-btn-text ant-btn-sm" onclick="location.href=\'associate.html?id=' + item.id + '&name=' + encodeURIComponent(item.name) + '\'">关联管理</button>'
        + '<button class="ant-btn ant-btn-text ant-btn-sm" onclick="toggleStatus(' + item.id + ')">' + (item.status === '启用' ? '停用' : '启用') + '</button>'
        + '<button class="ant-btn ant-btn-text ant-btn-dangerous ant-btn-sm" onclick="handleDelete(' + item.id + ')">删除</button>'
      + '</td>'
      + '</tr>';
  }).join('');
  document.getElementById('totalCount').textContent = rows.length;
  document.getElementById('paginationInfo').textContent = '共 ' + rows.length + ' 条';
}

function handleSearch() { renderTable(getSearchValues()); }
function handleReset() {
  document.getElementById('searchName').value = '';
  document.getElementById('searchStatus').value = '';
  renderTable({});
}
function toggleStatus(id) { showToast('状态已切换'); renderTable(getSearchValues()); }

var deletingId = null;
function handleDelete(id) {
  deletingId = id;
  var relCount = (relationData[id] || []).length;
  if (relCount > 0) {
    document.getElementById('deleteText').textContent = '该专题已关联 ' + relCount + ' 条信息公开，请先解除关联后再删除。';
    document.getElementById('deleteModal').querySelector('.ant-btn-dangerous').style.display = 'none';
  } else {
    document.getElementById('deleteText').textContent = '确定要删除该专题吗？';
    document.getElementById('deleteModal').querySelector('.ant-btn-dangerous').style.display = '';
  }
  openModal('deleteModal');
}
function confirmDelete() { showToast('已删除'); closeModal('deleteModal'); renderTable(getSearchValues()); }

// 关联管理相关数据和函数
const relationData = {
  1: [
    { id: 1, title: '雄安新区2026年重点项目建设进展通报', publishTime: '2026-05-15' },
    { id: 2, title: '新区智慧交通系统建设规划公示', publishTime: '2026-06-01' }
  ],
  2: [
    { id: 3, title: '雄安新区人才引进优惠政策（2026版）', publishTime: '2026-05-20' }
  ],
  3: [
    { id: 4, title: '关于优化营商环境的若干措施', publishTime: '2026-06-05' }
  ],
  4: [],
  5: []
};

const allInfos = [
  { id: 1, title: '关于印发《雄安新区绿化管理办法》的通知', publishTime: '2026-04-10' },
  { id: 2, title: '雄安新区2026年重点项目建设进展通报', publishTime: '2026-05-15' },
  { id: 3, title: '新区政务服务"最多跑一次"改革实施方案', publishTime: '2026-05-20' },
  { id: 4, title: '雄安新区人才引进优惠政策（2026版）', publishTime: '2026-05-20' },
  { id: 5, title: '新区智慧交通系统建设规划公示', publishTime: '2026-06-01' },
  { id: 6, title: '关于优化营商环境的若干措施', publishTime: '2026-06-05' },
  { id: 7, title: '雄安新区教育事业发展"十四五"规划', publishTime: '2026-06-10' }
];

renderTable({});

function showToast(msg, duration) {
  duration = duration || 2000;
  var wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--ant-success);"></i>' + msg;
  wrap.appendChild(el);
  requestAnimationFrame(function() { el.classList.add('show'); });
  setTimeout(function() { el.classList.remove('show'); setTimeout(function() { el.remove(); }, 300); }, duration);
}
function openModal(id) {
  var modal = document.getElementById(id); var mask = document.getElementById(id + 'Mask');
  if (modal) modal.classList.add('active'); if (mask) mask.classList.add('active');
}
function closeModal(id) {
  var modal = document.getElementById(id); var mask = document.getElementById(id + 'Mask');
  if (modal) modal.classList.remove('active'); if (mask) mask.classList.remove('active');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.ant-modal.active').forEach(function(m) { m.classList.remove('active'); });
    document.querySelectorAll('.ant-modal-mask.active').forEach(function(m) { m.classList.remove('active'); });
  }
});
document.getElementById('deleteModalMask').addEventListener('click', function(e) { if (e.target === this) closeModal('deleteModal'); });
</script>
</body>
</html>
