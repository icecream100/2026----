<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧校园物联中枢 - 设备影子 原型导航</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="proto-ui.css">
  <link rel="stylesheet" href="tailwind-fallback.css">
  <style>
    .page-card { background:#fff; border-radius:8px; border:1px solid var(--ant-border-secondary); box-shadow:var(--shadow-1); transition:all 0.2s; cursor:pointer; text-decoration:none; display:block; color:inherit; }
    .page-card:hover { border-color:var(--ant-primary); box-shadow:0 4px 12px rgba(22,119,255,0.15); transform:translateY(-1px); }
    .section-bar { width:4px; height:16px; border-radius:2px; display:inline-block; margin-right:10px; }
    .legend-tag { border-radius:10px; padding:1px 6px; font-size:11px; font-weight:500; }
    .tag-new { background:#fff2f0; color:#ff4d4f; border:1px solid #ffccc7; }
  </style>
</head>
<body class="min-h-screen">
  <header class="header" style="padding:0 32px;">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <div>
      <div class="app-name">智慧校园物联中枢 · 设备影子</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);">产品原型 · 共 1 个页面 · 2026.06</div>
    </div>
    <div class="spacer"></div>
    <div class="flex gap-2">
      <button onclick="filterSection('all')" id="tab-all" class="px-4 py-1 rounded text-sm cursor-pointer transition-all" style="background:#1677ff;color:#fff;border:1px solid #1677ff;">全部</button>
      <button onclick="filterSection('platform')" id="tab-platform" class="px-4 py-1 rounded text-sm cursor-pointer transition-all" style="background:transparent;color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.3);">平台端</button>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto">
    <div class="flex gap-4 mb-8 p-4 bg-white rounded-lg" style="border:1px solid #f0f0f0;">
      <span class="flex items-center gap-2 text-sm"><span class="legend-tag tag-new">全新</span> 本次迭代新建页面</span>
    </div>

    <section data-section="platform" class="mb-10">
      <h2 class="text-base font-semibold text-gray-700 mb-5 flex items-center">
        <span class="section-bar" style="background:#1677ff;"></span>平台端
        <span class="ml-3 text-xs font-normal text-tertiary">设备管理 · 产品详情 · 设备影子 Tab（含编辑弹窗与确认弹窗）</span>
      </h2>
      <div class="grid grid-cols-3 gap-4">
        <a href="admin-shadow/detail.html" class="page-card p-5">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:var(--ant-primary-bg);color:var(--ant-primary);">
                <i class="fa-solid fa-ghost"></i>
              </div>
              <div>
                <div class="font-medium text-gray-800">设备影子</div>
                <div class="text-xs text-tertiary">产品详情 - 设备影子 Tab</div>
              </div>
            </div>
            <span class="legend-tag tag-new">全新</span>
          </div>
          <p class="text-xs m-0 text-tertiary">admin-shadow/ · 1 个页面 · 影子状态展示 / 差异分析 / 编辑弹窗 / 清除确认</p>
        </a>
      </div>
    </section>
  </main>

  <script>
    function filterSection(key) {
      document.querySelectorAll('section[data-section]').forEach(function(sec) {
        sec.style.display = (key === 'all' || sec.dataset.section === key) ? '' : 'none';
      });
      document.querySelectorAll('header button[id^="tab-"]').forEach(function(btn) {
        var on = btn.id === 'tab-' + key;
        btn.style.background = on ? '#1677ff' : 'transparent';
        btn.style.color = on ? '#fff' : 'rgba(255,255,255,0.7)';
        btn.style.borderColor = on ? '#1677ff' : 'rgba(255,255,255,0.3)';
      });
    }
  </script>
</body>
</html>
