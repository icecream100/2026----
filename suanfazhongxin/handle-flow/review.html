<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警审核 - 算法中心 + 业务场景功能</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../proto-ui.css">
  <link rel="stylesheet" href="../tailwind-fallback.css">
  <style>
    .field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .drawer-panel { width:760px; max-width:94vw; margin-left:auto; height:100%; border-radius:0; }
    .full-modal { width:min(900px,94vw); max-height:88vh; overflow:auto; }
    .tree-box { border:1px solid var(--ant-border-secondary); border-radius:8px; padding:12px; background:#fff; }
    .tree-node-row { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:6px; cursor:pointer; }
    .tree-node-row:hover,.tree-node-row.active { background:var(--ant-primary-bg); color:var(--ant-primary); }
    .flow-card { border:1px solid var(--ant-border-secondary); border-radius:8px; padding:14px; background:#fff; }
    .fake-line { height:160px; background:linear-gradient(180deg,#fff,#f5f8ff); border:1px dashed var(--ant-border); border-radius:8px; overflow:hidden; }
    .evidence { height:180px; border-radius:10px; background:linear-gradient(135deg,#172554,#0f766e); color:white; display:flex; align-items:center; justify-content:center; flex-direction:column; }
    .timeline { border-left:2px solid var(--ant-border-secondary); padding-left:16px; }
    .timeline-item { position:relative; padding-bottom:18px; }
    .timeline-item::before { content:''; position:absolute; left:-22px; top:3px; width:10px; height:10px; background:var(--ant-primary); border-radius:50%; }
    .mini-bar { height:8px; border-radius:4px; background:#e6f4ff; overflow:hidden; }
    .mini-bar span { display:block; height:100%; background:var(--ant-primary); }
    .radio-card { border:1px solid var(--ant-border-secondary); border-radius:6px; padding:10px 12px; cursor:pointer; }
    .radio-card.active { border-color:#1677ff; background:#e6f4ff; }
    .star-row { display:flex; gap:4px; font-size:20px; color:#d9d9d9; cursor:pointer; }
    .star-row .active { color:#faad14; }
    .section-title { font-weight:600; margin-bottom:10px; color:var(--ant-text); }
    .readonly-card { background:#f6ffed; border:1px solid #b7eb8f; border-radius:8px; padding:12px; }
    .upload-box { border:1px dashed var(--ant-border); border-radius:8px; padding:20px; text-align:center; color:var(--ant-text-secondary); cursor:pointer; }
    .upload-box:hover { border-color:#1677ff; color:#1677ff; }
    .menu-badge { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:#ff4d4f; color:#fff; font-size:12px; padding:0 6px; border-radius:10px; line-height:18px; min-width:18px; text-align:center; }
    .ant-tag-lightgreen{background:#d9f7be;color:#52c41a;border-color:#b7eb8f}
  
    .radio-inline{display:flex;gap:20px;align-items:center}
    .radio-option{display:flex;align-items:center;gap:6px;font-size:13px;color:#262626;cursor:pointer;white-space:nowrap}
    .radio-option input[type="radio"]{width:14px;height:14px;accent-color:#1677ff;cursor:pointer;margin:0}
    .form-item-inline{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
    .form-item-inline .ant-form-label{margin-bottom:0;white-space:nowrap;min-width:72px;padding-top:4px}
    .form-item-inline .radio-inline{flex:1;padding-top:4px}
</style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-cube"></i></div>
    <span class="app-name">算法中心 + 业务场景功能</span>
    <div class="spacer"></div>
    <button class="nav-action" onclick="showToast('通知中心已打开')"><i class="fa-regular fa-bell mr-1"></i>6</button>
    <button class="nav-action" onclick="showToast('已切换为演示账号')"><i class="fa-regular fa-user mr-1"></i>平台管理员 · alex</button>
  </header>
  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">4 大核心模块</div>
      <div class="menu-item" onclick="location.href='../admin-algorithm/list.html'"><i class="fa-solid fa-microchip"></i>算法中心</div>
      <div class="menu-item" onclick="location.href='../admin-grid/list.html'"><i class="fa-solid fa-sitemap"></i>业务管理</div>
      <div class="menu-item" onclick="location.href='../admin-policy/home.html'"><i class="fa-solid fa-diagram-project"></i>策略管理</div>
      <div class="menu-item has-sub expanded active" onclick="toggleSubMenu(this)"><i class="fa-solid fa-bell"></i>报警中心<i class="fa-solid fa-chevron-right menu-arrow"></i></div>
      <div class="menu-sub">
        <div class="menu-item" onclick="location.href='../admin-dashboard/index.html'">看板</div>
        <div class="menu-item" onclick="location.href='../handle-flow/confirm.html'" style="position:relative">告警确认<span class="menu-badge">18</span></div>
        <div class="menu-item" onclick="location.href='../handle-flow/handle.html'" style="position:relative">告警处理<span class="menu-badge">26</span></div>
        <div class="menu-item active" onclick="location.href='../handle-flow/review.html'" style="position:relative">告警审核<span class="menu-badge">9</span></div>
        <div class="menu-item" onclick="location.href='../handle-flow/list.html'">告警列表</div>
      </div>
      <div class="menu-group-title mt-4">原型版本</div>
      <div class="menu-item" onclick="location.href='../index.html'"><i class="fa-solid fa-compass"></i>返回导航中心</div>
    </aside>
    <main class="main">
      <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="../admin-dashboard/index.html">报警中心</a><span>/</span><span class="current">告警审核</span></div>

      <div class="flex items-start justify-between mb-4">
        <div>
          <div class="page-title">报警中心 / 告警审核</div>
        </div>
        <div class="flex gap-2">
          <button class="ant-btn" onclick="openBatch('review')"><i class="fa-solid fa-clipboard-check"></i> 批量审核</button>
          <button class="ant-btn ant-btn-primary" onclick="showToast('批量导出任务已创建')"><i class="fa-solid fa-download"></i> 批量导出</button>
        </div>
      </div>

      <!-- 筛选 -->
      <div class="ant-card ant-card-bordered mb-4">
        <div class="ant-card-body">
          <div class="flex gap-2 mb-3">
            <button class="ant-btn ant-btn-primary ant-btn-sm" id="tabTodo" onclick="switchTab('todo')">待办</button>
            <button class="ant-btn ant-btn-sm" id="tabDone" onclick="switchTab('done')">已办</button>
          </div>
          <div class="flex gap-3 flex-wrap items-center">
            <select id="alarmLevel" class="ant-select"><option value="">全部级别</option><option>紧急</option><option>重要</option><option>一般</option></select>
            <input id="alarmKeyword" class="ant-input" style="width:240px" placeholder="告警标题/设备名称/编号" onkeydown="if(event.key==='Enter')renderAlarms(true)">
            <button class="ant-btn ant-btn-primary" onclick="renderAlarms(true)">查询</button>
            <button class="ant-btn" onclick="resetAlarm()">重置</button>
          </div>
        </div>
      </div>

      <!-- 列表 -->
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding:0;overflow:auto">
          <table class="ant-table">
            <thead><tr><th><input type="checkbox" id="checkAll" onclick="toggleAll()"></th><th>告警编号</th><th>告警标题</th><th>业务</th><th>设备名称</th><th>网格路径</th><th>告警类型</th><th>级别</th><th>状态</th><th>触发时间</th><th>当前责任人</th><th>操作</th></tr></thead>
            <tbody id="alarmBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 4. 审核弹窗 -->
<div class="ant-modal-mask" id="auditModal">
  <div class="ant-modal" style="width:720px">
    <div class="ant-modal-header"><span>审核处理结果</span><span class="ant-modal-close" onclick="closeModal('auditModal')"><i class="fa-solid fa-xmark"></i></span></div>
    <div class="ant-modal-body">
      <div class="section-title">完整回顾</div>
      <div class="readonly-card mb-4">
        <div class="flex gap-3">
          <div class="evidence" style="width:120px;height:80px;flex-shrink:0"><i class="fa-solid fa-image"></i></div>
          <div class="flex-1">
            <div class="font-semibold" id="auTitle">垃圾桶满溢</div>
            <div class="text-sm text-secondary">处理结果：已解决 · 现场处理</div>
            <div class="text-sm text-secondary">处理备注：已清理垃圾并通知环卫</div>
            <div class="text-sm text-secondary">处理人：赵伟 · 提交时间：2026-06-25 08:30:11</div>
          </div>
        </div>
      </div>
      <div class="ant-form-item form-item-inline">
        <label class="ant-form-label ant-form-label-required">审核结论</label>
        <div class="radio-inline">
          <label class="radio-option"><input type="radio" name="auditType" value="通过" checked onchange="setAuditType('pass')"> 通过</label>
          <label class="radio-option"><input type="radio" name="auditType" value="不通过" onchange="setAuditType('reject')"> 不通过</label>
        </div>
      </div>
      <div id="auPassBox">
        <div class="ant-form-item">
          <label class="ant-form-label">评分（可选）</label>
          <div class="star-row" id="starRow">
            <i class="fa-solid fa-star" onclick="setStar(1)"></i>
            <i class="fa-solid fa-star" onclick="setStar(2)"></i>
            <i class="fa-solid fa-star" onclick="setStar(3)"></i>
            <i class="fa-solid fa-star" onclick="setStar(4)"></i>
            <i class="fa-solid fa-star" onclick="setStar(5)"></i>
          </div>
        </div>
      </div>
      <div id="auRejectBox" style="display:none">
        <div class="ant-form-item">
          <label class="ant-form-label ant-form-label-required">驳回原因</label>
          <textarea class="ant-input" rows="3" placeholder="请说明驳回原因，将退回原处理人"></textarea>
        </div>
      </div>
    </div>
    <div class="ant-modal-footer flex justify-start gap-2">
      <button class="ant-btn ant-btn-primary" onclick="submitAudit()">提交审核</button>
      <button class="ant-btn" onclick="closeModal('auditModal')">取消</button>
    </div>
  </div>
</div>

<!-- 2. 批量审核弹窗 -->
<div class="ant-modal-mask" id="batchConfirmModal">
  <div class="ant-modal" style="width:600px">
    <div class="ant-modal-header"><span>批量审核</span><span class="ant-modal-close" onclick="closeModal('batchConfirmModal')"><i class="fa-solid fa-xmark"></i></span></div>
    <div class="ant-modal-body">
      <div class="ant-alert ant-alert-info mb-3">已勾选 <strong id="bcCount">3</strong> 条告警审核，将统一执行审核。</div>
      <div class="ant-alert ant-alert-warning mb-3" style="background:#fffbe6;border-color:#ffe58f;color:#614700">同一告警被驳回 3 次后，第 4 次提交审核时强制通过。</div>
      <div class="ant-form-item form-item-inline">
        <label class="ant-form-label ant-form-label-required">统一审核结论</label>
        <div class="radio-inline">
          <label class="radio-option"><input type="radio" name="batchAuditType" value="通过" checked onchange="setBatchConfirm('real')"> 通过</label>
          <label class="radio-option"><input type="radio" name="batchAuditType" value="驳回" onchange="setBatchConfirm('false')"> 驳回</label>
        </div>
      </div>
      <div id="bcRealBox">
        <div class="ant-form-item">
          <label class="ant-form-label">评分（可选）</label>
          <div class="star-row" id="batchStarRow">
            <i class="fa-solid fa-star" onclick="setBatchStar(1)"></i>
            <i class="fa-solid fa-star" onclick="setBatchStar(2)"></i>
            <i class="fa-solid fa-star" onclick="setBatchStar(3)"></i>
            <i class="fa-solid fa-star" onclick="setBatchStar(4)"></i>
            <i class="fa-solid fa-star" onclick="setBatchStar(5)"></i>
          </div>
        </div>
      </div>
      <div id="bcFalseBox" style="display:none">
        <div class="ant-form-item">
          <label class="ant-form-label ant-form-label-required">统一驳回原因</label>
          <textarea class="ant-input" rows="3" placeholder="请说明驳回原因，将退回原处理人"></textarea>
        </div>
      </div>
    </div>
    <div class="ant-modal-footer flex justify-start gap-2">
      <button class="ant-btn ant-btn-primary" onclick="submitBatchConfirm()">批量审核</button>
      <button class="ant-btn" onclick="closeModal('batchConfirmModal')">取消</button>
    </div>
  </div>
</div>

<div class="toast-wrap"></div>
<script>
function toggleSubMenu(el){el.classList.toggle('expanded');var sub=el.nextElementSibling;if(sub&&sub.classList.contains('menu-sub')){sub.classList.toggle('collapsed')}}
</script>

<script>
const pageMode='review';
function showToast(msg,duration){
  duration=duration||2000;
  var wrap=document.querySelector('.toast-wrap');
  var el=document.createElement('div');
  el.className='toast-msg';
  el.innerHTML='<i class="fa-solid fa-circle-info" style="color:#1677ff"></i>'+msg;
  wrap.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); },300); },duration);
}
function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') document.querySelectorAll('.ant-modal-mask.active').forEach(function(m){m.classList.remove('active');}); });

const alarms=[
  ['ALM20260625-00123','后厨人员未戴工帽','明厨亮灶','摄像头-西湖-001','明厨亮灶/片区A','未戴工帽识别','重要','待确认','2026-06-25 09:30:12','—'],
  ['ALM20260625-00122','消防通道疑似占用','消防','摄像头-消防-018','消防/城西片区','消防通道占用识别','紧急','待处理','2026-06-25 09:18:45','王强'],
  ['ALM20260625-00121','后厨明火异常','明厨亮灶','摄像头-西湖-008','明厨亮灶/片区B','烟雾明火检测','紧急','待处理','2026-06-25 08:56:02','李娜'],
  ['ALM20260625-00120','垃圾桶满溢','环境监测','摄像头-环卫-022','环境/西溪片区','垃圾满溢识别','一般','待审核','2026-06-25 08:30:11','赵伟'],
  ['ALM20260624-00118','电动车违规停放','消防','摄像头-消防-021','消防/城东片区','电动车违规识别','重要','已处理','2026-06-24 16:10:22','孙杰'],
  ['ALM20260624-00119','车辆违停','交通治理','摄像头-交通-009','交通/文一路','车辆违停检测','重要','已审核','2026-06-24 18:20:00','陈晨']
];

function tagLevel(v){ return v==='紧急'?'ant-tag-red':v==='重要'?'ant-tag-orange':'ant-tag-blue'; }
function tagStatus(v){
  const map={'待确认':'ant-tag-orange','待处理':'ant-tag-blue','待审核':'ant-tag-purple','已处理':'ant-tag-lightgreen','已审核':'ant-tag-green'};
  return map[v]||'ant-tag-default';
}
function statusMatch(v,s){
  if(!s) return true;
  if(s==='待处理') return v==='待处理';
  return v===s;
}
function statusKey(v){return {'待确认':'confirm','待处理':'handle','待审核':'review','已处理':'done','已审核':'closed'}[v]||'all';}
let currentTab='todo';function switchTab(t){currentTab=t;document.getElementById('tabTodo').className='ant-btn '+(t==='todo'?'ant-btn-primary':'')+' ant-btn-sm';document.getElementById('tabDone').className='ant-btn '+(t==='done'?'ant-btn-primary':'')+' ant-btn-sm';renderAlarms();}
function renderAlarms(tip){
  const l=document.getElementById('alarmLevel').value,k=document.getElementById('alarmKeyword').value.trim();
  const rows=alarms.filter(a=>(currentTab==='todo'?a[7]==='待审核':a[7]!=='待审核')&&(!l||a[6]===l)&&(!k||(a[0].includes(k)||a[1].includes(k)||a[3].includes(k))));
  document.getElementById('alarmBody').innerHTML=rows.length?rows.map(a=>{const sk=statusKey(a[7]); return `<tr><td><input type="checkbox" class="row-check"></td><td><code>${a[0]}</code></td><td><a href="detail-${a[0].split('-')[1]}.html">${a[1]}</a></td><td><span class="ant-tag ant-tag-blue">${a[2]}</span></td><td>${a[3]}</td><td>${a[4]}</td><td>${a[5]}</td><td><span class="ant-tag ${tagLevel(a[6])}">${a[6]}</span></td><td><span class="ant-tag ${tagStatus(a[7])}">${a[7]}</span></td><td>${a[8]}</td><td>${a[9]}</td><td>${ops(a)}</td></tr>`}).join(''):`<tr><td colspan="12" class="text-center" style="padding:48px"><div class="text-secondary"><i class="fa-regular fa-folder-open" style="font-size:36px;color:#d9d9d9"></i><div class="mt-3">${k||l?'未找到符合条件的告警，请调整筛选条件':'暂无告警审核'}</div></div></td></tr>`;
  if(tip) showToast('查询完成');
}
function ops(a){
  let list=[`<button class="ant-btn ant-btn-text ant-btn-sm" onclick="location.href='detail-${a[0].split('-')[1]}.html'">查看</button>`];
  if(a[7]==='待审核') list.unshift(`<button class="ant-btn ant-btn-text ant-btn-sm" onclick="openAudit('${a[0]}')">审核</button>`);
  return '<div class="action-wrap">'+list.join('')+'</div>';
}
function toggleAll(){
  const checked=document.getElementById('checkAll').checked;
  document.querySelectorAll('.row-check').forEach(c=>c.checked=checked);
  showToast(checked?'已全选':'已取消全选');
}
function resetAlarm(){ document.getElementById('alarmLevel').value=''; document.getElementById('alarmKeyword').value=''; renderAlarms(); showToast('筛选条件已重置'); }

// 审核
function openAudit(id){
  const a=alarms.find(x=>x[0]===id);
  document.getElementById('auTitle').textContent=a[1];
  setAuditType('pass'); setStar(0);
  openModal('auditModal');
}
function setAuditType(t){
  document.querySelectorAll('input[name="auditType"], input[name="batchAuditType"]').forEach(function(el){var target={'pass':'通过','reject':'不通过'}[t]||t;el.checked=(el.value===target)});
  document.getElementById('auPassBox').style.display=t==='pass'?'block':'none';
  document.getElementById('auRejectBox').style.display=t==='reject'?'block':'none';
}
function setStar(n){
  const stars=document.querySelectorAll('#starRow i');
  stars.forEach((s,i)=>s.classList.toggle('active',i<n));
}
function setBatchStar(n){
  const stars=document.querySelectorAll('#batchStarRow i');
  stars.forEach((s,i)=>s.classList.toggle('active',i<n));
}
function submitAudit(){ showToast('审核已提交'); closeModal('auditModal'); renderAlarms(); }

// 批量
function openBatch(type){
  const checked=document.querySelectorAll('.row-check:checked').length;
  if(checked===0){ showToast('请先勾选告警'); return; }
  if(type==='review'){ document.getElementById('bcCount').textContent=checked; setBatchConfirm('real'); openModal('batchConfirmModal'); }
}
function setBatchConfirm(t){
  document.querySelectorAll('input[name="batchConfirmType"], input[name="batchAuditType"]').forEach(function(el){var target={'real':'通过','false':'驳回','pass':'通过','reject':'驳回'}[t]||t;el.checked=(el.value===target)});
  document.getElementById('bcRealBox').style.display=t==='real'?'block':'none';
  document.getElementById('bcFalseBox').style.display=t==='false'?'block':'none';
}
function submitBatchConfirm(){ showToast('批量审核已执行'); closeModal('batchConfirmModal'); }

renderAlarms();
</script>
</body>
</html>
