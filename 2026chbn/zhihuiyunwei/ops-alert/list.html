<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设备告警 - 视频智能运维管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--ant-primary:#1677ff;--ant-primary-bg:#e6f4ff;--ant-success:#52c41a;--ant-warning:#faad14;--ant-error:#ff4d4f;--ant-text:rgba(0,0,0,0.88);--ant-text-secondary:rgba(0,0,0,0.65);--ant-text-tertiary:rgba(0,0,0,0.45);--ant-border:#d9d9d9;--ant-border-secondary:#f0f0f0;--shadow-1:0 1px 2px rgba(0,0,0,0.03),0 1px 6px -1px rgba(0,0,0,0.02);--shadow-2:0 3px 6px -4px rgba(0,0,0,0.12),0 6px 16px rgba(0,0,0,0.08);}
    *{box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:var(--ant-text);background:#f0f2f5;margin:0;}
    .layout{display:flex;min-height:100vh;flex-direction:column;}
    .header{height:56px;background:#001529;display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:100;}
    .content-wrap{display:flex;flex:1;}
    .sider{width:220px;background:#001529;min-height:calc(100vh - 56px);flex-shrink:0;}
    .main{flex:1;padding:20px 24px;overflow:auto;overflow-x:hidden;}
    .menu-group-title{padding:12px 16px 4px;font-size:11px;color:rgba(255,255,255,0.35);}
    .menu-item{display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;color:rgba(255,255,255,0.65);cursor:pointer;transition:all 0.2s;font-size:14px;}
    .menu-item:hover{color:#fff;background:rgba(255,255,255,0.08);}
    .menu-item.active{color:#fff;background:var(--ant-primary);}
    .menu-item i{width:16px;text-align:center;}
    .ant-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 15px;font-size:14px;border:1px solid var(--ant-border);border-radius:4px;background:#fff;color:var(--ant-text);cursor:pointer;transition:all 0.2s;}
    .ant-btn:hover{color:var(--ant-primary);border-color:var(--ant-primary);}
    .ant-btn-primary{background:var(--ant-primary);border-color:var(--ant-primary);color:#fff;}
    .ant-btn-danger{background:#ff4d4f;border-color:#ff4d4f;color:#fff;}
    .ant-btn-sm{height:28px;padding:0 12px;font-size:13px;}
    .ant-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:1000;}
    .ant-modal-mask.active{display:flex;}
    .ant-modal{background:#fff;border-radius:8px;box-shadow:0 3px 6px -4px rgba(0,0,0,0.12),0 6px 16px rgba(0,0,0,0.08);width:540px;max-width:92vw;}
    .ant-modal-header{padding:16px 24px;border-bottom:1px solid var(--ant-border-secondary);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
    .ant-modal-body{padding:24px;max-height:60vh;overflow:auto;}
    .ant-modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--ant-border-secondary);}
    .ant-card{background:#fff;border-radius:8px;box-shadow:var(--shadow-1);}
    .ant-card-head{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 24px;border-bottom:1px solid var(--ant-border-secondary);font-size:15px;font-weight:600;}
    .ant-card-body{padding:24px;}
    .ant-input{height:32px;padding:0 11px;font-size:14px;border:1px solid var(--ant-border);border-radius:4px;outline:none;background:#fff;width:100%;}
    .ant-select{height:32px;padding:0 11px;border:1px solid var(--ant-border);border-radius:4px;background:#fff;font-size:14px;outline:none;}
    .ant-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;}
    .ant-table th{padding:12px 16px;font-weight:600;background:#fafafa;border-bottom:1px solid var(--ant-border-secondary);text-align:left;white-space:nowrap;}
    .ant-table td{padding:12px 16px;border-bottom:1px solid var(--ant-border-secondary);}
    .ant-table tbody tr:hover td{background:rgba(0,0,0,0.02);}
    .ant-tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;font-size:12px;border-radius:4px;border:1px solid;}
    .ant-pagination{display:flex;align-items:center;gap:4px;margin-top:16px;justify-content:flex-end;}
    .ant-page-item{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ant-border);border-radius:4px;cursor:pointer;padding:0 6px;font-size:14px;background:#fff;}
    .ant-page-item.active{background:var(--ant-primary);border-color:var(--ant-primary);color:#fff;}
    .ant-page-item:hover:not(.active){color:var(--ant-primary);border-color:var(--ant-primary);}
    /* KPI卡片 */
    .kpi-card{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);padding:20px;display:flex;align-items:center;gap:16px;transition:box-shadow 0.2s;}
    .kpi-card:hover{box-shadow:var(--shadow-2);}
    .kpi-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
    .kpi-value{font-size:28px;font-weight:700;line-height:1;}
    .kpi-label{font-size:13px;color:var(--ant-text-tertiary);margin-top:4px;}
    .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
    .tab-bar{display:flex;border-bottom:2px solid var(--ant-border-secondary);margin-bottom:16px;}
    .tab-item{padding:10px 20px;cursor:pointer;font-size:14px;color:var(--ant-text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;}
    .tab-item.active{color:var(--ant-primary);border-bottom-color:var(--ant-primary);font-weight:600;}
    .tab-item:hover{color:var(--ant-primary);}
    .breadcrumb{display:flex;align-items:center;gap:6px;color:var(--ant-text-tertiary);font-size:14px;margin-bottom:16px;}
    .breadcrumb a{color:var(--ant-text-tertiary);text-decoration:none;}
    .breadcrumb a:hover{color:var(--ant-primary);}
    .kpi-card{background:#fff;border-radius:8px;box-shadow:var(--shadow-1);padding:16px 20px;}
    /* 全选下拉 */
    .select-all-wrap{position:relative;display:inline-block;}
    .select-all-dropdown{display:none;position:absolute;left:0;top:100%;margin-top:4px;background:#fff;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,0.12);border:1px solid var(--ant-border-secondary);z-index:50;min-width:120px;padding:4px 0;white-space:nowrap;}
    .select-all-dropdown.show{display:block;}
    .select-all-item{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;color:var(--ant-text);cursor:pointer;transition:background 0.15s;}
    .select-all-item:hover{background:#f5f5f5;}
    /* 实时闪烁点 */
    @keyframes pulse{0%{opacity:1;}50%{opacity:0.4;}100%{opacity:1;}}
    .pulse-dot{animation:pulse 1.5s infinite;}
    /* 操作列 */
    .action-wrap{display:inline-flex;align-items:center;gap:8px;}
    /* 设备树样式 */
    .tree-node{transition:all 0.2s;}
    .tree-node:hover{background:#f5f5f5;}
    .tree-node.active{background:#e6f4ff;color:#1677ff;font-weight:600;}
    /* Toast */
    .toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
    .toast-msg{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#fff;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,0.12);font-size:14px;color:rgba(0,0,0,0.88);pointer-events:auto;opacity:0;transform:translateY(-12px);transition:opacity 0.3s,transform 0.3s;}
    .toast-msg.show{opacity:1;transform:translateY(0);}
  </style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="flex items-center gap-3">
      <div style="background:#1677ff;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-video text-white text-sm"></i></div>
      <span class="text-white font-semibold text-base">视频智能运维管理平台</span>
    </div>
    <div style="flex:1;"></div>
    <div class="flex items-center gap-4">
      <span style="color:rgba(255,255,255,0.65);font-size:13px;cursor:pointer;"><i class="fa-regular fa-bell mr-1"></i>3</span>
      <div class="flex items-center gap-2" style="color:rgba(255,255,255,0.85);">
        <div style="width:28px;height:28px;border-radius:50%;background:#1677ff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;">张</div>
        <span style="font-size:13px;">张工程师</span>
      </div>
    </div>
  </header>
  <div class="content-wrap">
    <aside class="sider">
      <div class="menu-group-title">智能运维</div>
      <div class="menu-item" onclick="location.href='../ops-algorithm/list.html'"><i class="fa-solid fa-microchip"></i>检测算法</div>
      <div class="menu-item" onclick="location.href='../ops-inspection/list.html'"><i class="fa-solid fa-clipboard-list"></i>巡检任务</div>
      <div class="menu-item" onclick="location.href='../ops-log/list.html'"><i class="fa-solid fa-file-lines"></i>巡检日志</div>
      <div class="menu-item" onclick="location.href='../ops-sla/index.html'"><i class="fa-solid fa-chart-line"></i>可用性报告</div>
      <div class="menu-item" onclick="location.href='../ops-predict/list.html'"><i class="fa-solid fa-brain"></i>故障预警</div>
      <div class="menu-item active"><i class="fa-solid fa-triangle-exclamation"></i>设备告警</div>
    </aside>
    <main class="main">
      <!-- 顶部：面包屑 + 提示条 -->
      <div class="breadcrumb">
        <a href="../index.html">首页</a><span>/</span><span>智能运维</span><span>/</span><span style="color:var(--ant-text);">设备告警</span>
      </div>

      <!-- KPI 统计卡片（行动导向） -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;">
        <div class="kpi-card" style="cursor:pointer;" onclick="filterByAlertStatus('pending')">
          <div class="kpi-icon" style="background:#fff1f0;color:#ff4d4f;"><i class="fa-solid fa-bell"></i></div>
          <div>
            <div class="kpi-value" style="color:#ff4d4f;">8</div>
            <div class="kpi-label">待处理告警</div>
          </div>
        </div>
        <div class="kpi-card" style="cursor:pointer;" onclick="filterByAlertLevel('urgent')">
          <div class="kpi-icon" style="background:#fff7e6;color:#fa8c16;"><i class="fa-solid fa-shield-halved"></i></div>
          <div>
            <div class="kpi-value" style="color:#fa8c16;">3</div>
            <div class="kpi-label">紧急告警</div>
          </div>
        </div>
        <div class="kpi-card" style="cursor:pointer;" onclick="filterByAlertStatus('closed')">
          <div class="kpi-icon" style="background:#e6f4ff;color:#1677ff;"><i class="fa-solid fa-circle-check"></i></div>
          <div>
            <div class="kpi-value" style="color:#1677ff;">15</div>
            <div class="kpi-label">今日已处理</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="background:#f6ffed;color:#52c41a;"><i class="fa-solid fa-gauge"></i></div>
          <div>
            <div class="kpi-value" style="color:#52c41a;">65%</div>
            <div class="kpi-label">处理效率</div>
          </div>
        </div>
      </div>

      <!-- 下方：设备树 + 列表同级 -->
      <div style="display:flex;gap:16px;">
        <!-- 左侧设备树 -->
        <div style="width:200px;flex-shrink:0;background:#fff;border-radius:8px;border:1px solid var(--ant-border-secondary);padding:12px;">
          <select class="ant-select" style="width:100%;margin-bottom:10px;font-size:12px;height:28px;">
            <option>行政区域</option>
            <option>监控场景</option>
            <option>项目归属</option>
          </select>
          <div id="deviceTree">
            <div class="tree-node" onclick="filterByRegion('all')" style="padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px;margin-bottom:1px;">
              <i class="fa-solid fa-chevron-down" style="margin-right:4px;font-size:10px;color:var(--ant-text-tertiary);"></i><i class="fa-solid fa-folder-open" style="margin-right:6px;color:#faad14;"></i>全市
            </div>
            <div class="tree-node" style="margin-left:16px;">
              <div style="padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px;margin-bottom:1px;">
                <i class="fa-solid fa-chevron-down" style="margin-right:4px;font-size:10px;color:var(--ant-text-tertiary);"></i><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;"></i>西区
              </div>
              <div style="margin-left:16px;">
                <div style="padding:5px 8px;cursor:pointer;border-radius:4px;font-size:12px;margin-bottom:1px;color:var(--ant-text-secondary);" onclick="filterByRegion('西区-路口')"><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;font-size:11px;"></i>路口-C片区</div>
                <div style="padding:5px 8px;cursor:pointer;border-radius:4px;font-size:12px;margin-bottom:1px;color:var(--ant-text-secondary);" onclick="filterByRegion('西区-广场')"><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;font-size:11px;"></i>广场-P片区</div>
              </div>
            </div>
            <div class="tree-node" style="margin-left:16px;">
              <div style="padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px;margin-bottom:1px;">
                <i class="fa-solid fa-chevron-down" style="margin-right:4px;font-size:10px;color:var(--ant-text-tertiary);"></i><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;"></i>北区
              </div>
              <div style="margin-left:16px;">
                <div style="padding:5px 8px;cursor:pointer;border-radius:4px;font-size:12px;margin-bottom:1px;color:var(--ant-text-secondary);" onclick="filterByRegion('北区-入口')"><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;font-size:11px;"></i>入口-G片区</div>
                <div style="padding:5px 8px;cursor:pointer;border-radius:4px;font-size:12px;margin-bottom:1px;color:var(--ant-text-secondary);" onclick="filterByRegion('北区-道路')"><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;font-size:11px;"></i>道路-D片区</div>
              </div>
            </div>
            <div class="tree-node" style="margin-left:16px;">
              <div style="padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px;margin-bottom:1px;">
                <i class="fa-solid fa-chevron-right" style="margin-right:4px;font-size:10px;color:var(--ant-text-tertiary);"></i><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;"></i>东区
              </div>
            </div>
            <div class="tree-node" style="margin-left:16px;">
              <div style="padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px;margin-bottom:1px;">
                <i class="fa-solid fa-chevron-right" style="margin-right:4px;font-size:10px;color:var(--ant-text-tertiary);"></i><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;"></i>南区
              </div>
            </div>
            <div class="tree-node" style="margin-left:16px;">
              <div style="padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px;margin-bottom:1px;">
                <i class="fa-solid fa-chevron-right" style="margin-right:4px;font-size:10px;color:var(--ant-text-tertiary);"></i><i class="fa-solid fa-folder" style="margin-right:6px;color:#faad14;"></i>市中心
              </div>
            </div>
          </div>
        </div>

        <!-- 右侧列表区 -->
        <div style="flex:1;min-width:0;">
          <div class="ant-card">
            <div class="ant-card-body" style="padding:16px 24px 24px;">
              <!-- 筛选 -->
              <div class="flex gap-3 flex-wrap pb-4">
                <input class="ant-input" id="searchInput" style="width:240px;" placeholder="搜索设备名称">
                <select class="ant-select"><option>全部报警类型</option><option>链路异常</option><option>画面异常</option><option>丢包致花屏</option><option>无线信号弱</option><option>网络异常-丢包</option><option>网络异常-延迟</option><option>网络异常-波动</option></select>
                <select class="ant-select"><option>全部状态</option><option>待处理</option><option>已关闭</option></select>
                <select class="ant-select"><option>全部负责人</option><option>张工程师</option><option>李工程师</option><option>王工程师</option><option>赵工程师</option></select>
                <button class="ant-btn" onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i>查询</button>
                <div style="margin-left:auto;">
                  <button class="ant-btn ant-btn-sm" id="batchExportBtn" onclick="exportAlerts()"><i class="fa-solid fa-download mr-1"></i>批量导出</button>
                </div>
              </div>
              <!-- 列表 -->
              <div style="overflow-x:auto;">
              <table class="ant-table" style="min-width:1100px;">
                <thead>
                  <tr>
                    <th style="width:40px;">
                      <div class="select-all-wrap">
                        <input type="checkbox" id="selectAll" style="accent-color:#1677ff;cursor:pointer;" onclick="toggleSelectDropdown(event)">
                        <div class="select-all-dropdown" id="selectAllDropdown">
                          <div class="select-all-item" onclick="selectPage()"><i class="fa-solid fa-file" style="font-size:12px;color:var(--ant-text-tertiary);"></i>选中本页</div>
                          <div class="select-all-item" onclick="selectAll()"><i class="fa-solid fa-list" style="font-size:12px;color:var(--ant-text-tertiary);"></i>选中全部</div>
                        </div>
                      </div>
                    </th>
                    <th>事件ID</th>
                    <th>级别</th>
                    <th>设备名称</th>
                    <th>报警类型</th>
                    <th>下级平台名称</th>
                    <th>负责人</th>
                    <th>触发时间</th>
                    <th>状态</th>
                    <th>处理人</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="alertTableBody"></tbody>
              </table>
              <div class="ant-pagination">
                <span class="ant-page-item">«</span>
                <span class="ant-page-item active">1</span>
                <span class="ant-page-item">2</span>
                <span class="ant-page-item">3</span>
                <span class="ant-page-item">»</span>
                <span style="font-size:13px;color:rgba(0,0,0,0.45);margin-left:8px;">共 11 条</span>
              </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 关闭原因弹窗（v5改造：+处置备注） -->
<div class="ant-modal-mask" id="closeModal">
  <div class="ant-modal" style="width:480px;">
    <div class="ant-modal-header">
      <span><i class="fa-solid fa-times-circle" style="margin-right:8px;color:#ff4d4f;"></i>处理告警</span>
      <span style="cursor:pointer;color:rgba(0,0,0,0.45);font-size:18px;" onclick="closeCloseModal()">×</span>
    </div>
    <div class="ant-modal-body">
      <div style="margin-bottom:16px;">
        <label style="display:block;margin-bottom:12px;font-size:14px;color:rgba(0,0,0,0.88);font-weight:500;">关闭原因 <span style="color:#ff4d4f;">*</span></label>
        <div style="display:grid;gap:10px;">
          <label id="reasonFixed" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px;border:2px solid var(--ant-border-secondary);border-radius:8px;transition:all 0.2s;" onclick="selectCloseReason('fixed')">
            <input type="radio" name="closeReason" value="fixed" style="accent-color:#52c41a;">
            <div>
              <div style="font-weight:600;color:#52c41a;">已解决</div>
            </div>
          </label>
          <label id="reasonFalse" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px;border:2px solid var(--ant-border-secondary);border-radius:8px;transition:all 0.2s;" onclick="selectCloseReason('false')">
            <input type="radio" name="closeReason" value="false" style="accent-color:#faad14;">
            <div>
              <div style="font-weight:600;color:#faad14;">误报</div>
            </div>
          </label>
          <label id="reasonIgnore" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px;border:2px solid var(--ant-border-secondary);border-radius:8px;transition:all 0.2s;" onclick="selectCloseReason('ignore')">
            <input type="radio" name="closeReason" value="ignore" style="accent-color:rgba(0,0,0,0.45);">
            <div>
              <div style="font-weight:600;color:rgba(0,0,0,0.65);">忽略</div>
            </div>
          </label>
        </div>
      </div>
      <div style="border-top:1px solid var(--ant-border-secondary);padding-top:16px;">
        <label style="display:block;margin-bottom:6px;font-size:14px;color:rgba(0,0,0,0.88);font-weight:500;">处置备注 <span id="remarkRequired" style="color:#ff4d4f;display:none;">*</span></label>
        <textarea class="ant-input" id="closeRemark" placeholder="选填，最多500字符" style="height:80px;padding:8px 11px;resize:vertical;width:100%;box-sizing:border-box;" maxlength="500"></textarea>
        <div id="remarkError" style="color:#ff4d4f;font-size:12px;margin-top:4px;display:none;">已解决时备注为必填，请简述修复措施</div>
      </div>
    </div>
    <div class="ant-modal-footer">
      <button class="ant-btn" onclick="closeCloseModal()">取消</button>
      <button class="ant-btn ant-btn-primary" onclick="confirmClose()">确认提交</button>
    </div>
  </div>
</div>

<script>
const alerts = [

  {id:'ALT-20260413-010',level:'警告',levelColor:'#fa8c16',levelBg:'#fff7e6',type:'画面异常',sites:'南区-CAM-0098',region:'南区',channelCode:'34010000001310000098',platform:'南区公安分局平台',owner:'张工',time:'2026-04-13 18:07',status:'closed',handler:'张工'},
  {id:'ALT-20260413-007',level:'警告',levelColor:'#fa8c16',levelBg:'#fff7e6',type:'链路异常',sites:'南区-CAM-0088',region:'南区',channelCode:'34010000001310000088',platform:'南区公安分局平台',owner:'张工',time:'2026-04-13 14:30',status:'closed',handler:'张工'},
  {id:'ALT-20260413-005',level:'提示',levelColor:'#1677ff',levelBg:'#e6f4ff',type:'链路异常',sites:'北区-CAM-0130',region:'北区',channelCode:'34010000001310000130',platform:'北区交警大队平台',owner:'李工',time:'2026-04-13 10:05',status:'closed',handler:'李工'},
  {id:'ALT-20260413-003',level:'提示',levelColor:'#1677ff',levelBg:'#e6f4ff',type:'无线信号弱',sites:'东区-CAM-0320',region:'东区',channelCode:'34010000001310000320',platform:'东区城管局平台',owner:'王工',time:'2026-04-13 09:11',status:'closed',handler:'王工'},
  {id:'ALT-20260414-005',level:'提示',levelColor:'#1677ff',levelBg:'#e6f4ff',type:'丢包致花屏',sites:'西区-CAM-0288',region:'西区',channelCode:'34010000001310000288',platform:'西区公安分局平台',owner:'赵工',time:'2026-04-14 10:35',status:'pending',handler:'—'},
  {id:'ALT-20260414-006',level:'提示',levelColor:'#1677ff',levelBg:'#e6f4ff',type:'无线信号弱',sites:'南区-CAM-0415',region:'南区',channelCode:'34010000001310000415',platform:'南区公安分局平台',owner:'张工',time:'2026-04-14 09:50',status:'pending',handler:'—'},
];

const statusMap = {
  pending:{label:'待处理',dot:'#ff4d4f'},
  closed:{label:'已关闭',dot:'rgba(0,0,0,0.25)'}
};

var currentAlertId = '';

function renderTable(filter='all'){
  const tbody = document.getElementById('alertTableBody');
  const filtered = filter === 'all' ? alerts : alerts.filter(a=>a.status===filter);
  tbody.innerHTML = filtered.map(a=>{
    const s = statusMap[a.status];
    const isUrgent = a.level==='紧急';
    const actions = a.status==='pending'
      ? `<button class="ant-btn ant-btn-sm" style="border-color:#1677ff;color:#1677ff;" onclick="acceptAlert('${a.id}')">接单</button><button class="ant-btn ant-btn-sm" onclick="openTransferModal('${a.id}')">转单</button><button class="ant-btn ant-btn-sm" onclick="openCloseModal('${a.id}','pending')">关闭</button>`
      : a.status==='handling'
      ? `<button class="ant-btn ant-btn-sm" style="border-color:#52c41a;color:#52c41a;" onclick="openCloseModal('${a.id}','handling')">关闭</button><button class="ant-btn ant-btn-sm" onclick="openTransferModal('${a.id}')">转单</button>`
      : `—`;
    return `<tr style="${isUrgent?'background:#fff1f0;':''}">
      <td><input type="checkbox" class="alert-checkbox" value="${a.id}" onchange="updateBatchBtn()" style="accent-color:#1677ff;"></td>
      <td style="font-size:13px;font-weight:500;">${a.id}</td>
      <td><span style="background:${a.levelBg};color:${a.levelColor};font-size:12px;padding:1px 7px;border-radius:4px;font-weight:600;border:1px solid ${a.levelColor};">${a.level}</span></td>
      <td style="font-size:13px;">${a.sites}</td>
      <td>${a.type}${isUrgent?'<span class="pulse-dot" style="color:#ff4d4f;margin-left:6px;font-size:10px;">●</span>':''}</td>
      <td>${a.platform}</td>
      <td><span style="color:#1677ff;">${a.owner}</span></td>
      <td style="font-size:13px;color:rgba(0,0,0,0.65);">${a.time}</td>
      <td><span class="status-dot" style="background:${s.dot};"></span>${s.label}</td>
      <td>${a.handler}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

function toggleSelectDropdown(e){
  e.stopPropagation();
  var dd = document.getElementById('selectAllDropdown');
  dd.classList.toggle('show');
}

function selectPage(){
  document.querySelectorAll('.alert-checkbox').forEach(function(cb){ cb.checked = true; });
  document.getElementById('selectAll').checked = true;
  document.getElementById('selectAllDropdown').classList.remove('show');
  updateBatchBtn();
}

function selectAll(){
  document.querySelectorAll('.alert-checkbox').forEach(function(cb){ cb.checked = true; });
  document.getElementById('selectAll').checked = true;
  document.getElementById('selectAllDropdown').classList.remove('show');
  updateBatchBtn();
}

document.addEventListener('click', function(){
  document.getElementById('selectAllDropdown').classList.remove('show');
});

function updateBatchBtn(){
  // 保留checkbox交互，无批量关闭按钮
}

var selectedCloseReason = '';

function openCloseModal(id){
  currentAlertId = id;
  selectedCloseReason = '';
  document.querySelectorAll('#closeModal input[type="radio"]').forEach(r=>r.checked=false);
  document.querySelectorAll('#closeModal label[id]').forEach(l=>l.style.borderColor='var(--ant-border-secondary)');
  document.getElementById('closeRemark').value = '';
  document.getElementById('remarkError').style.display = 'none';
  document.getElementById('remarkRequired').style.display = 'none';
  document.getElementById('closeModal').classList.add('active');
}

function closeCloseModal(){
  document.getElementById('closeModal').classList.remove('active');
  currentAlertId = '';
}

function selectCloseReason(reason){
  selectedCloseReason = reason;
  document.querySelectorAll('#closeModal label[id]').forEach(l=>l.style.borderColor='var(--ant-border-secondary)');
  document.getElementById('reason'+reason.charAt(0).toUpperCase()+reason.slice(1)).style.borderColor = reason==='fixed'?'#52c41a':reason==='false'?'#faad14':'rgba(0,0,0,0.25)';
  document.getElementById('remarkRequired').style.display = reason==='fixed' ? '' : 'none';
  if(reason==='fixed') document.getElementById('remarkError').style.display = 'none';
}

function confirmClose(){
  if(!selectedCloseReason){
    alert('请选择关闭原因');
    return;
  }
  var remark = document.getElementById('closeRemark').value.trim();
  if(selectedCloseReason==='fixed' && !remark){
    document.getElementById('remarkError').style.display = '';
    return;
  }
  var labels = {fixed:'已解决',false:'误报',ignore:'忽略'};
  alert('✅ 关闭成功！\n\n告警 '+currentAlertId+' 已关闭\n关闭原因：'+labels[selectedCloseReason]+(remark?'\n处置备注：'+remark:''));
  closeCloseModal();
  location.reload();
}

document.getElementById('closeModal').addEventListener('click',function(e){if(e.target===this)closeCloseModal();});

var currentRegion = 'all';

function filterByRegion(region){
  currentRegion = region;
  // 更新设备树选中状态
  document.querySelectorAll('.tree-node').forEach(node=>{
    node.classList.remove('active');
    node.style.background = '';
    node.style.color = '';
    node.style.fontWeight = '';
  });
  event.currentTarget.classList.add('active');
  event.currentTarget.style.background = '#e6f4ff';
  event.currentTarget.style.color = '#1677ff';
  event.currentTarget.style.fontWeight = '600';
  // 重新渲染表格
  renderTable();
}

// 修改renderTable函数，增加区域筛选
var originalRenderTable = renderTable;
renderTable = function(filter='all'){
  const tbody = document.getElementById('alertTableBody');
  var filtered = filter === 'all' ? alerts : alerts.filter(a=>a.status===filter);
  if(currentRegion !== 'all'){
    filtered = filtered.filter(a=>a.region===currentRegion);
  }
  var keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  if(keyword){
    filtered = filtered.filter(a=>a.sites.toLowerCase().includes(keyword));
  }
  tbody.innerHTML = filtered.map(a=>{
    const s = statusMap[a.status];
    const isUrgent = a.level==='紧急';
    const actions = a.status==='pending'
      ? `<div class="action-wrap"><button class="ant-btn ant-btn-sm" style="border-color:#1677ff;color:#1677ff;" onclick="location.href='detail.html?id=${a.id}'">处理</button></div>`
      : `—`;
    return `<tr style="${isUrgent?'background:#fff1f0;':''}">
      <td><input type="checkbox" class="alert-checkbox" value="${a.id}" onchange="updateBatchBtn()" style="accent-color:#1677ff;"></td>
      <td style="font-size:13px;font-weight:500;">${a.id}</td>
      <td><span style="background:${a.levelBg};color:${a.levelColor};font-size:12px;padding:1px 7px;border-radius:4px;font-weight:600;border:1px solid ${a.levelColor};">${a.level}</span></td>
      <td style="font-size:13px;">${a.sites}</td>
      <td>${a.type}${isUrgent?'<span class="pulse-dot" style="color:#ff4d4f;margin-left:6px;font-size:10px;">●</span>':''}</td>
      <td>${a.platform}</td>
      <td><span style="color:#1677ff;">${a.owner}</span></td>
      <td style="font-size:13px;color:rgba(0,0,0,0.65);">${a.time}</td>
      <td><span class="status-dot" style="background:${s.dot};"></span>${s.label}</td>
      <td>${a.handler}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
  document.querySelector('.ant-pagination span:last-child').textContent = `共 ${filtered.length} 条`;
}

renderTable();

function doSearch(){
  renderTable();
}

// KPI卡片点击筛选
function filterByAlertStatus(status){
  var sels = document.querySelectorAll('.ant-select');
  // 状态筛选是第3个select
  if(sels[2]){
    if(status==='pending') sels[2].value='待处理';
    else if(status==='closed') sels[2].value='已关闭';
    renderTable();
  }
}
function filterByAlertLevel(level){
  // 级别映射到报警类型筛选不够直接，用Toast提示
  if(level==='urgent') showToast('已筛选紧急告警');
  renderTable();
}

// 搜索框回车触发查询
document.getElementById('searchInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});

// Toast 提示
function showToast(msg,duration){
  duration = duration || 2000;
  var wrap = document.querySelector('.toast-wrap');
  if(!wrap){wrap = document.createElement('div');wrap.className='toast-wrap';document.body.appendChild(wrap);}
  var el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = '<i class="fa-solid fa-circle-info" style="color:#1677ff;"></i>' + msg;
  wrap.appendChild(el);
  requestAnimationFrame(function(){el.classList.add('show');});
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){el.remove();},300);
  },duration);
}

function exportAlerts(){
  showToast('告警数据导出中...');
}

</script>
